  status: "[CONFIRMED]"
  act1: "第一章＋第二章（設定提示・日常確立・最初の試練＝真魚事件）"
  act2: "第三章〜（対立の本格化・敵の正体露呈・分岐）"
  act2_start: "第三章"
  note: "第一幕の終わり（第二章ラスト）は『不安定な均衡』で着地済み"

# ==========================================================
# [2] 第二幕の骨格タイムライン
# ==========================================================
act2_timeline:
  opening:
    status: "[CONFIRMED]"
    where: "第三章"
    event: "秋のオープンカレッジ、正統館大学訪問で諏訪・香取と初遭遇"
    mode: "線形（分岐なし）。日常の中で敵と静かに出会う"
  midpoint:
    status: "[WORKING]"
    event: "真魚父の存在がクローズアップ。国家の魔法抑圧体制の闇が片鱗を見せる"
    function:
      - "分岐の種が蒔かれる（真魚を揺さぶる父の問題）"
      - "真の敵＝諏訪個人でなく背後の国家体制の闇が見え始める"
      - "個（真魚の父）と世界（体制の闇）が同一事象で結ばれる"
  climax:
    status: "[CONFIRMED]"
    event: "真魚が決定的選択→実分岐。隼太のターニングポイントも同時期"
    note: "分岐スキーマがフル稼働するのはここから"

# ==========================================================
# [3] 分岐ナラティブ設計（作品最大の“売り”）
# ==========================================================
branching_design:
  type:
    status: "[CONFIRMED]"
    value: "分岐ツリー型（不可逆・別結末）。ルート内条件型で奪還ルートへ"
  purpose:
    status: "[WORKING]"
    value: "周回要素。真魚の運命がエンディングまで変わって終わる"
    final_form: "[OPEN] ゲーム／読み物 未定。ただし周回前提でゲーム寄りに組む"

  routes:
    common_before_split:
      status: "[CONFIRMED]"
      span: "第三章〜第二幕クライマックス手前"
      note: "1回設計・1回生成。分岐管理不要。ただし周回用の伏線を仕込む区間"
    route_A:
      status: "[CONFIRMED]"
      name: "友愛／温"
      summary: "真魚は父の奪還より隼太たちとの友情を選び、共に諏訪と戦う"
      mao_position: "隼太側。“守る対象”に入る"
    route_B:
      status: "[CONFIRMED]"
      name: "悲劇／冷"
      summary: "真魚は父への執着を捨てられず諏訪と手を結び敵へ。諏訪と共に破滅"
      mao_position: "敵側。“守れなかった／向こう側へ行った者”"
      special_emotion:
        target: "ユーザーにNTR感情（非性的）を抱かせる"
        definition: >
          恋愛的寝取られでなく『救えたはずの存在を救えなかった／こちらを
          選んでくれなかった』という喪失と敗北の感情。
        dependency: "共通部分で真魚への愛着を十分育てることが成立の絶対条件"
    route_B_rescue:
      status: "[WORKING]"
      relation: "Bの内部から枝分かれ（ルート内条件型）"
      summary: "Bの絶望を通過した者だけが、真魚を奪還するチャンスに至る"
      merit: "喪失を経験しないと救済に挑めない＝感情の落差を最大化"
    true_end:
      status: "[WORKING / REVISABLE]"
      unlock: "2周目以降（ルート内条件型で解放）"
      summary: >
        真魚に魔法が発現、ナツヤキヒメの再来として諏訪をも屈服させる。
        人間としての真魚とは永遠の別れだが、日本的な『神』となり、
        いつでもまた会える存在になる。
      thematic_resonance: >
        『強い魔法は人を神へ近づけ人でなくす』が、諏訪では堕落・真魚では
        昇華になる対比。同じ神化が悲劇と救済に分かれる。
        TH-06（真魚の潜在発動）・ナツヤキヒメ・エピジェネティック発現が
        すべてここに収束＝周回の再解釈で全開放。
      caution: "作者が『ストーリーを作るうえで再考する』と明言。変動あり"
    sub_branch:
      status: "[WORKING]"
      value: "各ルート内で みず葉×隼太 が結ばれるか否かの小分岐。従属的規模でOK"

  周回_design_principle:
    status: "[CONFIRMED]"
    rule: "共通部分の再体験に耐える設計＋分岐後の差分の価値の両立"
    key: >
      1周目で気づけない伏線が2周目で見える。真魚の些細な言動の意味が
      ルート踏破後に変わる＝『再解釈の快楽』。
    theme_fit: >
      周回=プレイヤーの認識をズラす装置。PMC第一原理『認識のズレ』と
      構造が完全一致。この作品は周回を売りにするために生まれた設定を持つ。
    mandatory_task: >
      周回用『再解釈される伏線』は共通部分（第三章〜）に仕込む必要がある。
      後付けは困難。第三章設計時に“2周目に意味が変わる種”を意識して埋める。

# ==========================================================
# [4] 思想的背骨：三項対立
# ==========================================================
three_way_conflict:
  status: "[CONFIRMED]"
  suwa: "魔法者が国家を導くべき（能動的支配）"
  takashima: "国家が魔法を利用してはならない（封印・隔離）"
  shunta: "そもそも誰も導くべきではない（意志ある不関与）"
  magic_redefinition: "魔法＝『能力』でなく『接続』。神・人・自然が未分離だった認識"
  suwa_danger: >
    強い魔法は人を神へ近づけ、一定以上で人でいられなくなる。人格も善意も
    残るが価値観が人のものでなくなる。暴君でなく“人でなくなる”悲劇。

# ==========================================================
# [5] 主人公アーク要約（詳細は CHAR_DEEPENING_shunta_actII.yaml）
# ==========================================================
protagonist_arc:
  status: "[CONFIRMED]"
  core_shift: "受動性の意味が『逃げ・無関心』から『意志ある不関与』へ深化"
  ideological_root: "『動物との会話』＝力を“横に並ぶ”ために使う原体験が思想の根"
  trauma: "幼稚園の禁圧（本質否定）＋小学生のみず葉救出（信じる使い方の踏み越え）"
  turning_point: >
    第二幕ラスト。みず葉の“正しくて優しい”引き止め（戦うな/隠れていよう＝
    禁圧の反復）を振り切り、大事なものを守るため『彼なりの戦い』を決意。
    討伐でなく防衛。リーダーにならない主人公のまま戦う。
  mao_branch_link: "隼太の『何を守るか』が真魚分岐A/Bと第二幕クライマックスで共鳴"

