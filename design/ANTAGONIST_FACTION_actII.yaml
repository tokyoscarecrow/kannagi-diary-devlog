# ==========================================================
# [D] 主人公側との接続：第二幕の幕開け
# ==========================================================
connection_to_protagonists:
  first_encounter:
    event: "秋のオープンカレッジ"
    place: "正統館大学（諏訪・香取のホームグラウンド）"
    logic: >
      高校生が進路見学で大学を訪れる、日常的で自然なイベント。
      PMCのトーン（日常と異常の共存・過剰演出回避）に合致。
      主人公側が無防備に敵の本拠へ踏み込む静かな緊張。
    why_strong: "劇的襲撃ではなく『進路見学』の中で敵と出会う。第二幕の静かな開幕"
  hooks_into_existing_threads:
    - thread: "TH-01 真魚の父奪還（未達）"
