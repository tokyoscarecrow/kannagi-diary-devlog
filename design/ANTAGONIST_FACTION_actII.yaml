    name: "諏訪公命"
    reading: "すわ・こうめい"
    en: "Suwa Komei"
    role: "主人公のライバル / 第二幕の敵の中心"
    affiliation: "正統館大学 政治学部2年"
    age: 19
    build: "筋肉質 / 身長166cm"
    family: "なし"          # 天涯孤独。支配欲・信念の背景になりうる
    addressing: "全キャラから『諏訪先輩』。香取のみ『諏訪様』"
    core:
      magic_user: true
      origin: "幼少期に魔法が発動した天才児。エリート教育を受けた。"
      belief: "魔法を社会のため、自らの正義のもとで使うべき"
      goal: "日本の平和と安寧（本気で世のためと信じている）"
      method: "サークルを装った組織で同志（魔法者）を集め、計画を練る"
    psychology:
      strengths: ["リーダー役", "人脈づくり", "揺るがぬ信念"]
      flaws: ["反省しない", "自分によく従う者を好む（＝対等を求めない）"]
      hates: ["愚鈍・怠惰・自堕落"]
