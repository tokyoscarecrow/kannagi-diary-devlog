# ==========================================================
# [A] 思想的土台（この陣営が立脚する世界観）
#     ※詳細な世界観改訂は別ドキュメント(A)に。ここは陣営に必要な要点のみ
# ==========================================================
ideological_foundation:
  magic_redefinition:
    summary: "魔法は『能力』ではなく『接続』。神・人間・自然が未分離だった時代の認識。"
    relevance: "諏訪の目的は、この接続を強化し『神に近づく』方向へ進むこと。"
  the_danger_of_suwa:
    quote_concept: "神との再接続"
    description: >
      強い魔法は人間を神へ近づける。一定以上進むと人間でいられなくなる。
      人格も善意も残るが、価値観が人のものでなくなる。暴君になるのではなく
      『人間でなくなる』。善意のまま人類を支配する存在が生まれうる。
    why_ideal_villain: >
      諏訪は『悪人』ではない。善意で人類を救おうとし、その過程で人ならざる
      ものへ変質していく。倒すべき敵ではなく、止めるべき悲劇。
  three_way_conflict:    # 第二幕の思想的背骨
    suwa:    "魔法者が国家を導くべき（能動的支配）"
    takashima: "国家が魔法を利用してはならない（封印・隔離）"
    shunta:  "そもそも誰も導くべきではない（受動の思想化）"
    note: >
      隼太の受動性・逃げ癖が、第二幕で初めて思想的意味を獲得する。
      諏訪の能動的支配欲へのアンチテーゼとして昇華する。主人公アークの核。

# ==========================================================
# [B] 組織：サークルを装った魔法者結社
# ==========================================================
organization:
  front_name: "[要確認] ボランティアサークル名（正統館大学）"
  true_nature: "戦力となる魔法者を探し、計画を練る思想結社"
  base: "正統館大学（政治学部が中心）"
  cover_activity: "ボランティア活動（諏訪・香取ともに所属）"
  structure_dual_circle:    # 二重円構造（確定）
    outer_circle:
      members: "一般学生数十人（魔法者ではない）"
      overt_function: "本物のボランティア活動。社会的信用の供給源"
      covert_function: >
        諏訪の思想の教育機関（洗脳装置）。一般人を『兵隊』として育てる。
        善意の活動を通じ『導く者に従う』心性を刷り込む。
      thematic_weight: >
        諏訪は一般人を無自覚に利用するだけでなく、意図的に変質させて
        戦力化する＝人間を理念の部品に作り変えることを厭わない。
        国家（人を管理・規格化する体制）と同じ手口であり、諏訪は国家と
        戦いながらミニチュア国家を作っている。この自己矛盾が、隼太の
        『誰も導くべきでない』を裏から証明する。
    inner_circle:
      members: "魔法者と腹心のみ（一桁人数）"
      function: "結社の本体。計画立案・魔法者の勧誘と統率"
      gatekeeper: "香取アンネ＝マリー（外円からの選別・引き上げを担う）"
  method:
    - "サークルを隠れ蓑に、魔法者を勧誘・選別する"
    - "手段を選ばぬ工作活動（香取が実働）"
  recruitment_logic: >
    魔法者はランダム発現で自覚なき者も多い（エピジェネティック継承）。
    諏訪は『戦力となる魔法者』を探している＝隼太・真魚は標的になりうる。
  detection_system:    # 探知体系（MAGIC_SYSTEM 1.0.0 対応に改訂）
    problem: >
      政府はアメダス検知（国家インフラ）を持つが、民間の諏訪組は
      どうやって魔法者を見つけるのか——第一章からの積み残しへの回答。
    solution_revised:
      part1_passive_sensing: >
        MAGIC_SYSTEMによりパッシブ感知は全魔法者の標準装備。
        諏訪自身（および内円の魔法者たち）が『他の魔法者や魔法による
        自然の乱れ』を感知できる。近接時の識別は虹彩の明滅も手掛かり。
        感知の専任者は不要——組織自体がセンサー網。
      part2_espionage: >
        香取（魔法の能力なし・二重スパイ）が政府のシステム情報
        （使用記録・登録者リスト）を諏訪へ流出させている。
      cross_check: >
        盗んだリスト × 魔法者メンバーの感知 のクロスチェックで探知網が完成。
    mutual_detection_caution: >
      相互感知は双方向。オープンカレッジでは香取ではなく『諏訪が隼太を
      感知し、隼太側のパッシブも諏訪に反応する』。敵地で自分の虹彩が
      明滅し続ける不気味さ——第三章の静かな緊張の核。
    future_asset: >
      香取の二重スパイ性は展開資産。忠誠の真の向きは意図的に保留中
      （characters.katori_anne_marie.core.loyalty_direction 参照）。
      『諏訪様』という呼称すら演技だった可能性まで残せる。
    act1_rewrite_seed: >
      [確定] 第一幕リライトで『政府側の魔法者もいるらしい』という
      不正確情報を一瞬だけ記述する（RD-03）。ミッドポイント以降、読者は
      『香取のことか』と思うが、真相は『能力なしの人間スパイ』——
      噂は最後まで不正確なまま。不正確さ自体が二段のミスリードになる。
    targeting_implication: >
      第二章の事件（真魚→みずは→隼太）は政府の記録に残っているはず。
      香取が盗んだ記録の中で、隼太と真魚は既に『要注目』として浮かんで
      いた。オープンカレッジの遭遇は偶然ではなく、最初から狙われていた。
      香取は記録で標的を知り、人間的な観察と工作でアプローチする。
  thematic_tie: "PMC『管理と逸脱』の“逸脱”側を、組織的・思想的に極限化した存在"

grand_strategy:    # 諏訪の戦略ドクトリン（行動計画からの帰結）
  strategic_problem: >
    19歳の学生と少数の魔法者で国家に勝つ方法。武力蜂起は数で負け、
    テロは弾圧を正当化するだけ。国家の力が及ばない土俵が必要。
  three_pillars_of_the_state:    # 体制の力の源泉＝折るべき柱
    - "秘匿：社会は魔法者を知らない→抑圧は世論の監視外で行える"
    - "検知：アメダスで使用を捕捉できる"
    - "分断：魔法者は互いを知らず孤立。連帯が存在しない"
  core_doctrine: >
    最大の柱『秘匿』は国家最大の弱点でもある。魔法の存在を、国家では
    なく諏訪の演出するタイミングと文脈で公開する——『怪物』ではなく
    『奇跡を起こす救済者』として。国民は魔法者を愛し、政府は『善人を
    秘密裏に収容してきた抑圧者』として告発される側に回る。
    諏訪の武器は暴力ではなく、公開という核のボタン。
  disaster_doctrine: >
    公開の舞台は災害。理由は三重: (1)アメダスは荒天下で無効（TH-04）＝
    検知の死角 (2)ボランティア出動が自然 (3)公然の人命救助は奇跡の
    インパクト最大。災害はこの世界で魔法と国家の関係が動く特異点
    （高島是則が関東大震災で消えた因縁とも重なる）。
  phases:
    phase0:
      name: "基盤構築（済〜現在）"
      actions: ["サークル設立", "表の活動実績づくり", "情報収集網の確立"]
    phase1:
      name: "勧誘と覚醒（第三章時点）"
      actions:
        - "魔法者の発見・勧誘（居場所と目的を与える）"
        - "自覚なき者の覚醒（『あなたは特別だ』）"
        - "オープンカレッジ＝高校生から素質ある者を探す網の一部"
      note: "主人公たちは勧誘網に自分から歩み込む"
    phase2:
      name: "挑発と暴露の準備（ミッドポイント前後）"
      actions:
        - "小規模な『善行としての魔法使用』の反復→管理体制の疲弊"
        - "体制の闇（収容魔法者の処遇＝真魚父）の証拠収集"
      logic: "政府が強硬化するほど、公開時の告発材料が積み上がる"
    phase3:
      name: "公開と屈服（クライマックス〜第三幕）"
      actions:
        - "災害を舞台に魔法を『救済』として公開"
        - "世論を握り政府に交渉を突きつける"
        - "隔離施設の魔法者集団を一挙に解放する（作者確定・具体的標的）"
      demands: ["魔法者の法的承認", "収容魔法者の解放", "魔法者の指導的地位"]
      facility_note: >
        隔離施設はMAGIC_SYSTEM 1.0.0で実在確定。体制の闇の物理的実体で
        あり、真魚の父の居場所であり、第三幕の舞台候補。解放は抽象的
        要求ではなく特定の場所への具体的な作戦になりうる。
  hook_on_mao:    # AF-03の解決
    resolution: >
      AF-03は行動計画から『YES、計画の本筋として』帰結。phase3の要求に
      『収容魔法者の解放』が入る＝諏訪は真魚に正規の計画として言える:
      『私の計画が成就すれば君の父は解放される。政府に頭を下げても
      あの人は還らない。だが私と来れば、確実に還る』。嘘ですらない。
      父を想う真魚に最も抗いがたい誘い＝分岐Bへの鉤。
  planned_weakness: >
    諏訪の欠点『反省しない』『従う者を好む』は計画の潜在的破綻点。
    計画が狂ったとき（例: 真魚の覚醒）、彼は軌道修正できない。
    欠点が第三幕の敗因の種として機能する。

