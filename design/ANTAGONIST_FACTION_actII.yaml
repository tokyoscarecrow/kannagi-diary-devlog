      note: "第二幕後半〜第三幕で変質が顕在化。今は魅力的なカリスマとして登場"
    foil_to_shunta: >
      諏訪『誰かが導くべき＝自分が』 ⇔ 隼太『誰も導くべきでない』。
      家族なし(諏訪) ⇔ 父母あり・平穏志向(隼太)。能動 ⇔ 受動。
      魔法を誇る(R17自信=信念) ⇔ 魔法を疎む(隼太R16嫌い=積極性の強要)。

  # ----------------------------------------------------
  katori_anne_marie:
    name: "香取アンネ＝マリー"
    reading: "かとり・あんねまりー"
    en: "Katori Anne-Marie"
    role: "ライバルの部下 / 実働工作員"
    affiliation: "正統館大学 政治学部3年（諏訪の1つ上）"
    age: 21
    build: "カーヴィー / 身長166cm"
    family: "父・母（健在）"   # 真魚（父を奪われた）との対照に使える
    appearance: "中欧と日本のハーフ（おそらく）。完璧なスタイルの美女"
    addressing: "諏訪を『諏訪様』と呼ぶ（崇拝/臣従の唯一の例外的敬称）"
    core:
      magic_user: false      # [確定・改訂] 魔法の能力なし。ただの人間。
      revision_note: >
        旧統合案（感知特化型魔法者）はMAGIC_SYSTEM 1.0.0で廃止。
        新システムでパッシブ感知が全魔法者の標準装備になったため、
        『感知型』の希少価値が消滅（諏訪自身が感知を持つ）。組織の探知は
        諏訪本人＋盗んだシステム情報で足りる。香取が魔法者である必然性が
        消えた。
      why_stronger: >
        魔法者たちの結社の中枢に、ただの人間が一人だけいる。武器は
        4か国語と社交と工作技能と忠誠のみ。異能の世界を才覚だけで泳ぐ女。
        異能なしで異能者を追い詰める工作員の方が怖い。
      double_agent: >
        [確定] 香取は二重スパイである（両陣営に通じている事実は確定）。
        政府のシステム情報を諏訪へ流し、同時に政府側とも接続を持つ。
      loyalty_direction: >
        [意図的な未決定・寝かせ中] 忠誠の真の向き（政府の工作員として
        諏訪に潜入しているのか、諏訪側として政府に潜っているのか、
        あるいは第三の答えか）は作者が意図的に保留。彼女に決定的な役割を
        与える余地を残すため。
        執筆上の注記: 『二重である事実』と『忠誠の向き』は分離可能。
        第三章〜ミッドポイントの香取の行動（隼太への接近・諏訪への奉仕・
        政府への報告）はどちらの忠誠でも同じ外形を取るため、答えを
        寝かせたまま両義的に書ける。作者も断定しないことで一挙一動が
        本当に両義的になる。
      languages: "日英仏伊の4か国語"
      function: "手段を選ばぬ工作活動。隼太に超積極的アプローチで誘惑"
    psychology:
      desire: "心地よい束縛が欲しい / 諏訪に仕えることが将来の希望"
      flaw: "自分で決断できない"
      skill: "外見を活かすこと / ダンス / 美容"
      hates: "面白味のない人"
    intentional_blank:    # 作者の明示的判断：今は埋めない
      policy: "人物背景は現段階で意図的に余白とする"
      reason: "この種のキャラはストーリー中で『育つ』可能性。余裕を持たせる"
      do_not: "諏訪への従属の起源・過去の経歴を今は固定しない"
    open_design_points:   # 育てる際の引き出し（埋めるのは後）
      - "諏訪『様』と呼ぶに至った経緯（救済恩義か / 崇拝か / 別の何か）"
      - "隼太への『誘惑』が任務か、途中から別の感情が芽生える余地か"
      - "家族健在(香取) vs 父喪失(真魚) の対照を物語で使うか"

  # ----------------------------------------------------
