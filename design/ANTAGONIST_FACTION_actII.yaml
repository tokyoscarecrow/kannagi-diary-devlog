    appearance: "髭と禿頭の老人（写真でのみ登場）"
    connection_to_canon: >
      第一章で明神が読んだ組織変遷（陰陽寮→内務省寺社局→厚生省）の
      『寺社局』に属した実在感のある過去人物。現管理体制の源流に位置する。
    core:
      goal: "魔法の完全封印"
      discovery: "晩年に『魔法を消去し取り除く方法』を発見していたらしい"
      lost: "関東大震災で行方不明、資料も焼失。方法は現在まで失われている"
      theories:
        - "接続断絶説：魔法=接続を切る。魔法者は死なず普通の人間になる"
