# ==========================================================
# ANTAGONIST FACTION — 第二幕 敵陣営 設定ドキュメント
# Project: Kannagi Diary / Act II (第3章〜)
# Version: 0.1.0 (DRAFT)
# Encoding: UTF-8 (LF)
#
# 目的:
#   第二幕の敵陣営（諏訪公命 / 香取アンネ＝マリー / 高島是則）を
#   構造化し、第三章ストーリー設計の土台とする。
#   キャラ表（kannnagi_chara_data.xlsx）と展開案テキストを統合。
#
# 注意:
#   本ドキュメントは canon 昇格前のドラフト。確定分は将来
#   PROJECT_MASTER_CONTEXT / WORLD_AND_RULE_CONFIG / キャラシートへ。
#   [要確認] マーカーは作者判断待ちの設計判断。
#   [意図的空白] は埋め忘れではなく、意図的に余白を残した箇所。
# ==========================================================

meta:
  doc_id: ANTAGONIST_FACTION_actII
  version: "0.1.0"
  status: DRAFT
