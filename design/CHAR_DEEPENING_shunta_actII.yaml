# ==========================================================
# CHARACTER DEEPENING — 飯綱隼太 / 第二幕に向けた性格の深化
# Project: Kannagi Diary / Act II
# Version: 0.1.0 (DRAFT)
# Encoding: UTF-8 (LF)
#
# 原則:
#   IM-CH-001（根本原理は無断変更しない）に従う。
#   第一幕の隼太を「変える」のではなく「掘る」。既存要素に
#   意味を与え直し、深さを足す。否定や上書きはしない。
# ==========================================================

meta:
  doc_id: CHAR_DEEPENING_shunta_actII
  version: "0.1.0"
  status: DRAFT
  character: "飯綱隼太（izuna_shunta）"
  sources:
    - "Config_v2.5 CHARACTER_LAYER（speech_style等）"
    - "kannnagi_chara_data.xlsx（キャラ表）"
    - "第二幕展開案（三項対立）"
  promote_target: "飯綱隼太キャラシート / PROJECT_MASTER_CONTEXT（主人公アーク）"

# ==========================================================
# [1] 第一幕で確立済みの芯（不変・土台）
# ==========================================================
established_core:
  role: "主人公 / 調停者"
  traits: ["受動的", "状況判断型", "他者優先"]
  flaw: "逃げ癖"
  hope: "平穏な暮らし"
  dislikes: "積極性の強要 / リーダー役（苦手）"
  magic:
    has_power: true
    self_view: "自信はある(R17)が、考えは消極的。『無ければ良かった』とさえ思う"
    everyday_use: "動物との会話（得意）。生きもの部。命令でなく“対等に通じ合う”使い方"
  immutable_note: >
    これらは第一幕で読者に提示済み。第二幕で否定・反転させない。
    深化は『これらの意味を変える』方向でのみ行う。

# ==========================================================
# [1.5] 魔法トラウマの二段階構造（隼太の傷の核心）
#   隼太の魔法忌避・思想・みずはとの絆すべての根。
# ==========================================================
magic_trauma:
  stage1_kindergarten:
    what: "幼稚園の頃、魔法は『シャボン玉を飛ばす』程度の無邪気な遊びだった"
    what_happened: >
      害意も支配も暴力もない遊びが、政府により『重大な反社会性』として
      禁圧された。幼い隼太は悪意なく遊んだだけなのに、力を恥として刻印された。
    wound: "自分の本質を否定された傷。世界から拒絶された記憶。"
    thematic_weight: >
      問題は魔法の危険性ではなく、体制が魔法を『危険と定義する』こと自体。
      展開案『国家の魔法抑圧の闇』を、隼太個人の原体験として先取りしている。
      主人公の存在そのものが体制批判の生き証人。
    reframes_self_view: >
      『無ければ良かった』は力への嫌悪ではなく、力ゆえに拒絶された記憶から
      くる。シャボン玉も動物との会話も“無害で対等な使い方”＝魔法の原風景は
      一貫して穏やか。その穏やかさが体制に『反社会』と断じられた。
  stage2_elementary:
    what: "小学生のとき、みずはを救いたい一心で再び、しかし『危険な形』で使用"
    reference: "CP-002（第一章3話：みずは誘拐撃退・おそらく致死）と同一事件"
    double_transgression:   # 二重の踏み越え
      - "禁忌の侵犯：幼稚園で『使ってはいけない』と刻まれた力を破って使った"
      - "魔法観の逸脱：遊びの穏やかな魔法でなく、他者を害する危険な行使だった"
    inner_meaning: >
      隼太にとってあの救出は誇りでも英雄性でもない。『愛する者を守るために、
      自分の信じる力の使い方（対等・無害）を裏切った』瞬間。だから魔法を疎む。
      だから“力を行使すべきでない”と考える。思想が抽象的信条ではなく
      生々しい後悔から生えている。
  effect_on_mizuha_bond:
    what: "事件は隼太とみずは両方の心に影を落とし、両者の価値観形成に影響した"
    structure: >
      絆であると同時に澱。みずは=『自分のせいで隼太が禁忌を破った』負い目、
      隼太=『みずはを守るために踏み越えた』記憶。二人は共犯者であり、
      互いに救い救われた関係。
    retroactive_payoff: >
      第一幕で描かれたみずはの独占欲・隼太への特別な執着の“根”がこれ。
      設定が過去へ遡って既存の関係性を裏付ける（遡及的伏線の好例）。

# ==========================================================
# [2] 深化の核心：受動性の「意味」を変える
# ==========================================================
core_transformation:
  before: "第一幕の受動性 = 逃げ・無関心・面倒の回避"
  after:  "第二幕の受動性 = 意志ある不関与（誰も導かせないため、自らも導かない）"
  key_principle: >
    受動性を“捨てて能動的英雄になる”のではない。同じ受動性に
    思想的な芯が通る。逃げ癖が、信念に裏打ちされた静かな抵抗へ。
  why_not_hero: >
    急に積極的になればIM-CH-001違反（キャラ崩壊）。隼太は最後まで
    『リーダーにならない主人公』であり続ける。それが諏訪への最大の回答。

# ==========================================================
# [3] 思想の根拠：「動物との会話」が思想になる
# ==========================================================
ideological_root:
  setup_in_act1: "『動物との会話』は第一幕では趣味・特技に見えた"
  status_note: >
    [確定] 会話は魔法ではない。『なんとなくわかる』という検証不能な
    人柄の一部（SH-04解決参照）。思想の根としての機能は変わらない——
    むしろ“確かめない”態度自体が思想の表れとして強化された。
  reinterpretation_in_act2: >
    隼太の魔法は、動物を“支配・命令・操作”する力ではなく、
    “対等に通じ合う”力。彼は力を、誰かの上に立つためでなく
    横に並ぶために使ってきた。これが彼の魔法観の原体験。
  resulting_belief: >
    諏訪『魔法者が人々を導くべき』に対し、隼太は理屈以前に
    生理的な拒否を抱く。『力は誰かの上に立つためのものじゃない』を
    身体で知っている。生きもの部の経験が、そのまま思想になる。
  design_merit:
    - "第一幕の何気ない設定が第二幕で思想の根拠に再解釈される（周回的快楽の人物版）"
    - "教義としてでなく生活実感として思想が立つ＝説教臭くならない"
    - "PMC『説明過多を避ける/観察と推測で理解させる』に合致"

# ==========================================================
# [4] 三項対立における隼太の極
# ==========================================================
position_in_conflict:
  suwa:    "魔法者が国家を導くべき（能動的支配 / リーダー役を是とする）"
  takashima: "国家が魔法を利用してはならない（封印・隔離）"
  shunta:  "そもそも誰も導くべきではない（不関与の思想）"
  mirror_to_suwa:    # キャラ表レベルで隼太と諏訪は鏡像
    - "苦手=リーダー役(隼太) ⇔ 得意=リーダー役(諏訪)"
    - "嫌い=積極性の強要(隼太) ⇔ 好き=人脈づくり/同志拡大(諏訪)"
    - "家族あり・平穏志向(隼太) ⇔ 家族なし・理想国家(諏訪)"
    - "力を疎む(隼太) ⇔ 力を誇り使命とする(諏訪)"
  note: "隼太と諏訪は性格特性のレベルで対称。対立は思想であると同時に気質の衝突"

# ==========================================================
# [5] 深化を駆動する第二幕の試練
# ==========================================================
trials_that_force_growth:
  - trial: "諏訪の勧誘"
    pressure: "『君も魔法者だ、共に世界を導こう』と能動性を求められる"
    growth: "断る理由が『面倒』から『誰も導く構造を拒む』という信念へ変わる"
  - trial: "真魚の分岐（父への執着 vs 友情）"
    pressure: "真魚の運命に対し、隼太の『不関与』が問われる"
    growth: >
      『誰も導かない』は『誰も助けない』ではない、という線引きに直面する。
      導く（上に立つ）ことと、隣に立つ（友として関わる）ことの差を、
      隼太自身が引き受ける必要が出る。受動の思想の“限界”の試練。
    open_point: "[要検討] この試練の解像度は真魚分岐の設計と連動。後で詰める"
  - trial: "国家の抑圧体制の闇（ミッドポイント以降）"
    pressure: "政府も信用できないと判明。『誰も導くべきでない』の正しさが裏付く"
    growth: "諏訪も政府も否定する隼太の立場が、消極ではなく見識として確立する"

# ==========================================================
# [6] speech_style への影響（Config_v2.5との整合）
# ==========================================================
speech_style_note:
  current: "neutral_casual / 短文 / 反応主体 / 感情を強く出さない"
  in_act2: >
    基調は維持。ただし“思想を語る場面”が出てくる。その時も長台詞や
    熱弁にしない（forbidden: 感情的な長台詞 を守る）。隼太の思想は
    断片的・ぶっきらぼうに、しかし芯のある短い言葉で漏れる方が
    キャラに合う。例:『誰かが上に立つ時点で、もう違う気がする』程度。
  caution: "思想深化を“説明セリフの増加”で表現しないこと（PMC negative_constraints）"

# ==========================================================
# [7] 第二幕ラストのターニングポイント（隼太アークの結節点）
# ==========================================================
turning_point:
  placement: "第二幕のラスト（クライマックス）。真魚の分岐と同時期に置く"
  what_he_fights_for:
    principle: "『大事なものを守る』の一点。抽象的正義ではない"
    not_this: >
      危険な諏訪を“正義の立場から討伐する”のではない。それは諏訪と同じ
      『大きな理念のために力を振るう』側への堕落。隼太はそれを選べない。
    but_this: >
      隼太が唯一戦える理由は具体的な『守りたいもの』。討伐でなく防衛、
      征服でなく庇護。魔法観（横に並ぶ/隣を守る）と一貫する。
  mizuha_as_brake:
    her_claim: "『戦うな、何もしなくていい、二人でひっそり隠れていればいい』"
    why_powerful: >
      みずはの主張は“正しくて優しく、しかも隼太自身の第一幕の願い（平穏な
      暮らし・R20）そのもの”。彼女は間違っていない。隼太がずっと欲しかった
      ものを差し出している。だから振り切ることが本物の決意になる。
    trauma_link: >
      みずはの『隠れていよう』は、幼稚園の禁圧（stage1）の“優しい反復”＝
      『力を使うな、目立つな、安全でいよう』。彼女は愛ゆえに隼太を再び
      “力を使わない檻”に入れようとする。それは彼の本質の再否定でもある。
  the_decision:
    what: "みずはの引き止めを振り切り、彼なりの戦いを決意する"
    meaning_layers:
      - "第一幕の自分（平穏を求めて逃げる自分）を、初めて自ら乗り越える"
      - "外圧でなく内側からの選択（受動の思想を保ったまま“守る”へ踏み出す）"
      - "自分の力を、恥ではなく守る手段として引き受ける＝trauma stage1への決着"
    consistency_guard: >
      これは『能動的英雄への転向』ではない。隼太は依然リーダーにならず、
      世界を導こうとしない。ただ“隣にあるものを守る”ためだけに立つ。
      core_transformation（意志ある不関与）と矛盾しない。
  link_to_mao_branch:
    note: >
      隼太の『何を守るために戦うか』が、真魚分岐と共鳴する。
      分岐A（友愛）: 真魚も“守る対象”に入る。
      分岐B（悲劇）: 真魚は“守れなかった/向こう側へ行った者”になる。
      両者のターニングポイントが第二幕クライマックスで同時に来る配置。
    open_point: "[要検討] みずはのブレーキと真魚分岐の因果順序。後で詰める"

# ==========================================================
# 要確認リスト
# ==========================================================
open_questions_for_author: []   # 現在なし

resolved_questions_sh04:
  - id: SH-04
    was: "キャラ表『動物との会話』とMAGIC_SYSTEM確定能力『運動干渉』の関係"
    resolution: >
      [作者確定] 動物との会話は魔法ではなく、『なんとなく僕にはわかるんだ』
      という、本当かどうか確定できない隼太の性格のひとつとして扱う。
      魔法システム（アクティブ1+パッシブ1）の純度は無傷のまま、
      隼太に科学で割り切れない余白が残る。魔法なのか観察眼なのか
      思い込みなのか、本人にも読者にも分類できない。
    ideological_note: >
      思想の根としてはむしろ強化。『本当に通じているかは分からないが、
      通じている気がする。それでいい』という態度こそ、支配や証明を
      求めない隼太の在り方。諏訪なら検証し体系化し利用する。隼太はしない。
      確かめないことが、彼の優しさの形式。

resolved_by_magic_system:
  - id: SH-01
    was: "隼太の魔法の正体・範囲"
    resolution: >
      MAGIC_SYSTEM 1.0.0で確定：『質量を持つ物体の運動状態への干渉』
      （加速・減速・停止・方向変更）。守りと制止の能力。パッシブ感知
      （共鳴・虹彩明滅）も全魔法者標準として保有。
  - id: SH-03
    was: "隼太が最終的に魔法をどう受け入れる/手放すか"
    resolution: >
      MAGIC_SYSTEM 1.0.0で確定：隼太は高島の魔法消去法（使用者自身にも
      作用する）を用いて諏訪たちを止め、自身も魔法を失う。禁圧（奪われる）
      ではなく選択（手放す）としての喪失。思想と行動が一致する着地。

resolved_questions:
  - id: SH-02
    was: "幼少期の撃退（CP-002）は“支配”では？隼太の“対等な力”観と矛盾しないか"
    resolution: >
      矛盾ではなく物語の核へ転化。magic_trauma に二段階構造として定式化。
      撃退＝『自分の信じる力の使い方を裏切った踏み越え』であり、隼太の魔法
      忌避・思想・みずはとの絆すべての感情的根拠になった。SH-02は解決。
