# ==========================================================
# GOVERNMENT RESPONSE — 第二幕 政府側の対応（項目2）
# Project: Kannagi Diary / Act II
# Version: 0.1.0 (DRAFT)
# Encoding: UTF-8 (LF)
#
# 基本方針（作者確定）:
#   物語の主軸は隼太と諏訪の決着。政府は強敵たりえず、
#   「無能なFBI」型でよい。ただし明神とごく一部の柔軟な
#   メンバーが最終的に隼太を支援する側にまわる。
# ==========================================================

meta:
  doc_id: GOVERNMENT_RESPONSE_actII
  version: "0.1.0"
  status: DRAFT
  related_docs:
    - "ANTAGONIST_FACTION_actII.yaml（諏訪組・香取のスパイ網）"
    - "ACT2_MASTER_PLAN.yaml（全体構想）"
    - "CHAR_DEEPENING_shunta_actII.yaml（隼太アーク）"

# ==========================================================
# [1] 政府を強敵にしない構造的理由
# ==========================================================
design_rationale:
  why_weak: >
    決着は隼太vs諏訪の思想対決（誰も導くべきでない vs 魔法者が導くべき）。
    政府が有能な第三勢力になると主軸が薄まり、しかも『国家が機能するなら
    どちらの思想も不要では』という余計な問いが立つ。政府が頼りにならない
    ことは、両者の思想が真剣に衝突するための前提条件。
  beyond_the_trope: >
    この政府は単に無能なのではなく『秘匿に最適化しすぎて公開戦を戦えない』
    組織。全ドクトリンが隠蔽（露見は局所処理・存在しないものとして管理）
    なのに、諏訪の武器は公開。百年磨いた武器が一切通用しない敵と初めて
    対峙する。無能さが個人の資質でなく組織の構造的硬直として描ける。
    隠すことしかできない組織は、暴かれる戦いに勝てない。
  leak_factor: >
    香取のスパイ網により、政府の対応は原則諏訪に筒抜け。手の内が漏れて
    いる組織は勝てない——『無能なFBI』の構造的補強。

# ==========================================================
# [2] 政府側の「顔」：凸凹コンビ（新キャラ）
# ==========================================================
odd_couple:
  design_intent: >
    (a)悪意なき官僚の上司 ＋ (b)信念の強硬派の部下 を組ませ、
    コメディを演じさせる。第二幕の重さ（分岐Bの喪失・体制の闇・諏訪の
    変質）に対する呼吸＝コメディリリーフの受け皿。第一幕の住吉や
    回文ネタが担った軽さの、第二幕版。
  mechanism: >
    互いが互いを打ち消し合う——部下が動こうとすれば上司が前例を盾に止め、
    上司が動くべき時は部下が的外れに動く。組織が機能しない理由がコンビの
    力学として可視化され、説明台詞が不要になる。
  boss:
    name: "[要命名]"
    type: "(a) 悪意なき官僚型"
    traits: ["保身", "前例主義", "決断の先送り", "憎めないが救いがない"]
    function: "体制の構造悪の体現。誰も悪くないのに体制は間違う、の怖さ"
    position: "明神の上司にあたる管理課の上役"
  subordinate:
    name: "[要命名]"
    type: "(b) 信念の強硬派"
    traits: ["魔法者を本気で脅威と信じる", "行動的", "的外れな暴走"]
    function: >
      抑圧が惰性でなく信念によっても支えられている怖さを、コメディの
      皮を被せて提示。笑わせながら笑えないものを見せる。
      思想的には『諏訪の裏返し』（力への恐怖 vs 力への信仰）。
  contrast_to_myojin: >
    上司は動かなさすぎ、部下は動きすぎ。その間で規則と現場を両方見て
    裁量する明神の柔軟さが対比で際立つ。明神の例外性が説明なしで伝わる。

# ==========================================================
# [3] 政府の対応フェーズ（諏訪組の行動計画への応答）
# ==========================================================
response_phases:
  vs_phase1:    # 諏訪の勧誘期
    action: "異変の断片を検知するが『個別事案』として処理。組織的脅威と認識しない"
    note: "秘匿ドクトリンの慣性。すべてを局所処理しようとする"
  vs_phase2:    # 諏訪の挑発期
    action: >
      善行型の魔法使用が頻発し、管理が疲弊。上層部は収容の拡大・
      予防拘束など『抑圧の強化』で応じる（それしか知らない）。
    effect: "強硬化が諏訪の告発材料を積み上げる＝諏訪の思う壺"
    myojin_view: "現場で管理される側の顔を知る明神の中で、疑問が臨界に向かう"
  vs_phase3:    # 諏訪の公開期
    action: "公開に対し隠蔽で応じようとして完全に後手に回る。機能不全"
    note: "ここで政府は事実上退場し、決着は隼太vs諏訪の主軸に収斂する"

# ==========================================================
# [4] 明神の離反：体制の原点への回帰
# ==========================================================
myojin_defection:
  seeds_already_planted:
    - "第二章：文化祭事件を規則でなく現場裁量で処理（柔軟さの実証済み）"
    - "初期設定：中盤以降に高島の封印法を再発見し隼太の仲間になる（TH-03）"
  necessity_chain: >
    組織の強硬化 → 管理される側の顔を知る唯一の官僚としての疑問 →
    真魚父の処遇（体制の闇）を知る立場 → 高島の思想の再発見。
  the_irony: >
    高島は体制の祖でありながら、体制の今のあり方（国家による魔法の
    利用・抑圧）を最も否定する人物だった。明神の離反は裏切りではなく
    体制の原点への回帰。管理課の係官が管理思想の源流を掘り、
    体制の逸脱に気づく。
  companions: "[OPEN] 明神と共に離反する『ごく一部の柔軟なメンバー』の顔ぶれ"

# ==========================================================
# [5] 封印法＝最奥義（作者確定）
# ==========================================================
sealing_method_as_ultimate:
  difficulty: >
    高島の封印法は最奥義。明神が苦労と知力を注いで初めて発見できる
    レベル。断片的なノートから失われた奥義を再構築する作業であり、
    明神の第二幕の個人的クエスト＝彼のアークの背骨。
  katori_limit: >
    香取のスパイ網は『封印法が存在する』ことまでは掴めるが、内容には
    到達できない。→ 諏訪は脅威を認識し警戒・妨害できる（第二幕終盤の
    危機として使える）が、対抗も無効化もできない。
    情報の非対称が『存在は知られるが本体は届かない』深度で切られる。
  value_created:
    - "明神が『代替不可能な仲間』になる（頭数ではなく唯一の到達者）"
    - "緊張（諏訪の妨害）と切り札（封印法本体）の両立"
  thematic_meaning: >
    諏訪への対抗手段が『力』ではなく『知』であること。力の物語に対する
    知の回答。百年前の研究者の遺した断片を、一人の官僚が誠実に掘り
    起こすことが鍵になる。隼太の『力は上に立つためのものじゃない』と
    響き合う。

# ==========================================================
# [6] 三項対立の人的配置（完成形）
# ==========================================================
final_alignment:
  suwa_pole: "諏訪（中心）/ 香取 / 内円の魔法者たち / 外円の兵隊"
  takashima_pole: "明神（封印法の再発見者）/ 離反する少数の柔軟なメンバー"
  shunta_pole: "隼太（中心）/ みずは / （分岐Aなら）真魚"
  government_rest: "凸凹コンビと本体＝機能不全のまま背景化"
  note: "三つの思想それぞれに生きた人間が配された"

