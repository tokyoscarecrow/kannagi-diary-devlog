# ==========================================================
# MAGIC SYSTEM — 魔法システム設定（確定版）
# Project: Kannagi Diary
# Version: 1.0.0 (CONFIRMED for Act II)
# Encoding: UTF-8 (LF)
#
# 位置づけ:
#   Act II 進行にあたり作者が確定した魔法システムの正本。
#   旧設定（world_concept_initial.md の能力記述、パッシブ=一部系統説）
#   を置き換える。矛盾する旧記述はすべて本ドキュメントを正とする。
# ==========================================================

meta:
  doc_id: MAGIC_SYSTEM
  version: "1.0.0"
  status: CONFIRMED
  supersedes:
    - "world_concept_initial.md の能力構成記述"
    - "『パッシブ能力=一部の魔法者の系統』とする旧案"
  promote_target: "WORLD_AND_RULE_CONFIG（L2）への昇格候補"

# ==========================================================
# [1] 世界観・起源
# ==========================================================
origin:
  essence: >
    魔法とは、神・人間・自然が互いに切り離されていなかった時代に
    人間が持っていた能力である。
  kami_definition: >
    神とは人格神ではなく、八百万の神のような非人格的な自然の存在。
  mechanism: "魔法は、その自然との接続（共鳴）によって発現する。"
  lineage: >
    魔法者は、古代日本で大和王権に服属しなかった先住民『都知久母』の
    一部族であるナツヤキヒメ一族の後裔とされる。
  lineage_caveat: >
    ただしこれは長い年月の中で史実・伝承が混在したものであり、
    現代では誰も自らの系譜を自覚していない。

# ==========================================================
# [2] 発現・継承
# ==========================================================
inheritance:
  medical_view: "現代医学では遺伝性を確認できない。"
  actual_mechanism: "DNAではなくエピジェネティックな継承によると考えられる。"
  randomness: "家系に関係なくランダムに発現。本人にも家族にも予測できない。"

# ==========================================================
# [3] 魔法の基本原則（禁止則）
# ==========================================================
fundamental_rules:
  rules:
    - id: MR-01
      rule: "魔法は自然現象への干渉・増幅であり、無から現象を生み出せない。"
    - id: MR-02
      rule: "人間や動植物の精神・意思を直接操作することはできない。"
    - id: MR-03
      rule: "既に存在する自然現象に対してのみ作用する。"
    - id: MR-04
      rule: "自然法則の否定ではなく、流れの一時的変化である。"
  narrative_significance: >
    MR-02（精神操作の禁止）は物語の誠実さを保証する最重要則。
    洗脳魔法が存在しないため、諏訪の勧誘は言葉と思想で行われ、
    外円の兵隊育成も真魚の分岐Bも、すべて本人の意志による選択になる。
    分岐の重みはこのルールに支えられている。

# ==========================================================
# [4] 能力構成：全魔法者 = パッシブ1種 + アクティブ1種
# ==========================================================
ability_structure:

  passive:
    universality: "魔法者は全員、一種類のみのパッシブ能力を持つ（標準装備）。"
    nature: "自然や周囲の変化を感知する『共鳴能力』。"
    targets:
      - "気温"
      - "湿度"
      - "気圧"
      - "気流"
      - "天候変化"
      - "地面や空気の異変"
      - "他の魔法者や魔法による自然の乱れ"
    image: "万能型の緊急地震速報"
    control: "本人の意思で発動・停止できない。生理現象のように自然に作動。"
    mutual_detection_implication: >
      『他の魔法者』が感知対象に含まれるため、魔法者同士は接近すれば
      互いに何かを感じる。相互探知が世界のルールになった。

  passive_visual_sign:    # 虹彩変化
    normal: "濃い茶色"
    activated: "ダークグリーンへ変化し、元の色と明滅するように入れ替わる"
    duration: "ごく短時間。一般人はほとんど気付かない"
    for_magosha: "魔法者はこれを重要な手掛かりとして認識できる"
    narrative_uses:
      - "魔法者同士の相互識別手段"
      - "読者への視覚的シグナル（ビジュアル化時の発動の絵）"
      - "[作者内答] RD-02『痕跡』の正体候補：真魚が父の目で見た緑の明滅"

  active:
    uniqueness: "魔法者は一種類のみのアクティブ能力を持つ。"
    determination: "能力は自然現象・物理現象への親和性によって決まる。"
    restriction: "一人が複数系統を扱うことはできない。"

# ==========================================================
# [5] 確定済みの能力例
# ==========================================================
confirmed_abilities:

  izuna_shunta:
    domain: "質量を持つ物体の運動状態への干渉"
    can_do: ["加速", "減速", "停止", "運動方向変更"]
    examples:
      - "ボールをゆっくり飛ばす"
      - "落下物を止める"
      - "花瓶が倒れるのを防ぐ"
    character_resonance: >
      守りと制止の能力。加速も可能だが、彼の使い方は止める・防ぐ・逸らす。
      幼稚園のシャボン玉（浮遊の制御）とも、CP-002の誘拐犯撃退
      （運動への干渉は致死的にも使える怖さ）とも整合。
      能力仕様そのものが隼太の人格（力は隣を守るためのもの）と響き合う。

  mao_father:
    domain: "流体への干渉"
    targets: ["水", "空気", "泥流", "マグマなどの流体"]
    at_mastery: >
      洪水・暴風・火山活動への干渉など、大規模自然災害を誘発できる
      可能性がある。ただしMR-01により、無から発生させることはできず、
      既に存在する流れを増幅・制御するのみ。

  plasma_type:
    domain: "プラズマ・炎・雷・高エネルギー状態"
    status: "未登場。もっとも危険な系統として位置付ける予定"
    note: >
      [観察] 保持者の予約席として最も自然なのは諏訪（未確定）。
      『神に近づく』者の能力が雷・炎という神話的系統であれば、
      ナツヤキヒメ的な奇跡の絵も最終決戦のスケールも立つ。

# ==========================================================
# [6] 社会との関係：秘匿と永久隔離
# ==========================================================
social_rules:
  secrecy: "魔法の存在は国家によって秘匿されている。"
  legality: "魔法そのものは禁止ではない。"
  isolation_rule: >
    第三者に魔法者であることが明確に発覚した場合、人間社会から
    永久隔離される。このため魔法者は日常生活で能力を隠して生きる。
  isolation_trigger_clarified:    # 作者確認により確定した運用
    definition: "『発覚』とは公的な露見・当局の認定を指す。"
    private_sharing: >
      私的な秘密の共有は『発覚』に含まれない。当局が知らない／
      立証できない限り、隔離条件を満たさない。
    canon_case: >
      隼太は幼稚園時に『誰にも見せていません』とシラを切り通し、
      みず葉も第三者に話さず秘密を守り続けている。ゆえに二人は
      制度の網の外にいる。変質者撃退時に隼太が『終わった』と思ったのは、
      『見られた＝永久隔離』という制度的な死の宣告の実感だった。
    narrative_weight: >
      隼太とみず葉の『二人だけの秘密』は、形式はラブコメ的だが、
      中身は一人の人間が人生を懸けた選択の共有。みず葉の第二幕での
      ブレーキ（戦うな・隠れていよう）は、あの日『終わった』と思った
      隼太の顔を見た唯一の人間の、経験に基づく必死の防衛である。
  isolation_facility:    # 作者確認により実在確定
    existence: "発覚した魔法者を収容する隔離施設が実在する。"
    narrative_roles:
      - "体制の闇の物理的実体"
      - "真魚の父が現在いる場所"
      - "諏訪の解放目標：『隔離されている魔法者集団を一挙に解放する』"
      - "ミッドポイントで存在が匂わされ、第三幕の舞台候補になる"

# ==========================================================
# [7] 魔法消去法（高島の最奥義）
# ==========================================================
erasure_method:
  discovery: >
    高島是則は『魔法とは能力ではなく、神・自然との接続である』と見抜いた。
  definition: "魔法消去法とは、この接続そのものを断つ方法である。"
  cost: "使用者自身にも作用する。"
  ending_design:    # 作者確定の結末構想
    plan: >
      将来的に隼太はこの方法を用いて諏訪たちを止め、自身も魔法を失う。
    arc_completion: >
      幼稚園で禁圧され『無ければ良かった』と思った少年が、第二幕で力を
      『守るための手段』として引き受け、最後に自らの意志で手放す。
      奪われる（禁圧）と手放す（選択）は結果が同じでも意味が正反対。
      彼の物語は『力を取り戻す話』ではなく『力との関係を自分で決められる
      ようになる話』だったと、結末が証明する。『誰も導くべきでない』の
      最終形＝『自分もまた力を持たない側に降りる』。思想と行動が一致して終わる。
    true_end_contrast: >
      トゥルーエンドで真魚は神になり、隼太は接続を断って完全な人間になる。
      一人は神に、一人は人に——魔法（接続）をめぐる対極の決着が同じ結末に
      並ぶ。『いつでも会える存在』になった真魚と、もう接続を持たない隼太。
    resolves: "SH-03（隼太が魔法をどう受け入れる/手放すか）はこれで解決"
