      source: "作者確認により確定（OQ-01解決）"
      promote_to: "GLOBAL_CONFIG addressing_rules / 飯綱隼太キャラシート / 全本文"
      disposition: CONFIRMED
      priority: HIGHEST
      note: "ボイス収録の正本。表記ゆれ（飯縄/飯綱）を全文検査し統一すること"
      verified_discrepancies:   # 実ファイル照合（2026-06）で判明した具体的な不整合
        - file: "Config_v2.5.yaml / CHARACTER_LAYER"
          issue: >
            主人公のキーが『hayata』、コメント表記が『飯縄隼太』。
            addressing_rules のキー『izuna_shunta』・読み『いずな』と二重に
            ズレている。GP-002／IM-CH-004に照らし要修正（縄→綱）。
          fix: "キーは izuna_shunta に統一、表記は『飯綱隼太』へ"
        - file: "addressing_rules.yaml"
          issue: "キー izuna_shunta は正。読み『いずな』も正。整合済み"
