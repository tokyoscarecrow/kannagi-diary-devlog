# =============================================================
# STATE_SNAPSHOT
# 「かんなぎダイアリー」長編生成チャット移行用 状態スナップショット
# -------------------------------------------------------------
# 目的: 第二章完結時点の到達状態を構造化し、第三章を生成する
#       新チャットへ全本文履歴を運ばずに連続性を引き継ぐ。
#
# 構造の原則:
#   このファイルは2つの異なる性質の情報を明示的に分離する。
#   [A] canon_promotions  = 生成中に確定した「正史」。採否を人間が
#                            判断し、採用分はPMC/キャラシートへ昇格させる。
#                            (= カノンへの還流待ちキュー)
#   [B] dynamic_state     = 第三章開始時点の動的状態。物語進行で
#                            変化する関係性・感情・誤認の配置。
#   この2つを混同しないこと。[A]は上流へ還流して恒久化、
#   [B]は第三章の出発点として消費される。
# =============================================================

meta:
  snapshot_id: STATE_SNAPSHOT_ch03
  schema_version: 1.0.0          # 確定（全OQ解決）
  covers_through: "第二章・第十話（最終回）"
  next_target: "第三章 第一話"
  generated_from:
    - "第一章（全8話）本文"
    - "第二章（全10話）本文"
    - "world_concept_initial.md（初期世界観設定）"
  status: CONFIRMED              # 全OQ解決。canon昇格作業を残すのみ
  open_questions_unresolved: 0   # 全件解決済み
  verified_against_canon:        # 実Configファイルとの照合実施記録
    date: "2026-06"
    files_checked:
      - "GLOBAL_CONFIG.yaml v0.1.0"
      - "PROJECT_MASTER_CONTEXT.yaml v1.0.0"
      - "Config_v2.5.yaml"
      - "addressing_rules.yaml v1.0"
      - "ep02_structure.yaml v1.0"
    result: >
      本文からの逆算で組んだスナップショットを実正本と照合。CP-000の
      具体的不整合（hayata/飯縄）、昇格タスクの既述/未述の別、RD-01の
      真因（L5のL3逸脱）、TH-02の呼称準備済みを各項目に反映済み。

# =============================================================
# [0] 進捗アンカー  —  時間軸と物語位置の基準点
# =============================================================
progress_anchor:
  story_time: "文化祭から3日後の朝（第二章ラスト時点）"
  season: "九月（二学期）"
