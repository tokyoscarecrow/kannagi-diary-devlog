# =============================================================
# NAME CHANGE REGISTRY  —  命名変更の履歴（旧名→新名）
#   初期設定からの改名を一元管理。旧名の復活を防ぐ。
# =============================================================
name_change_registry:
  note: >
    固有名の命名変更を一元管理する唯一の裁定基準。新旧が『どのファイルに
    正があるか』で割れているため、単一ファイルを常に正とは見なせない。
    迷ったら必ず本レジストリを参照すること。
  changes:
    - old: "甘南備（明）"
      new: "明神明"
      direction: "本文(第一章)側が旧 → 正本へ統一修正する"
      status: "確定。第一章1話の表記修正が改稿タスクとして残る（CP-005参照）"
    - old: "藤代アンジェリカ"
      new: "香取アンネ＝マリー"
      direction: "正本(addressing_rules)が旧名のまま → 新名へ修正する"
      status: >
        確定。修正対象は addressing_rules.yaml（キー angelica_fujishiro→
        要改名、全キャラからの呼称『藤代◯◯』→『香取◯◯』へ）。本文未登場
        のため本文側の修正は不要。甘南備→明神と同じく『正本を新名へ直す』型。
      correction_note: >
        ※当初このレジストリは向きを誤り『香取→藤代（藤代が新）』と記録して
        いたが、作者確認により『藤代→香取（香取が新）』へ訂正した。
  doc_status:
    "world_concept_initial.md": >
      初期構想資料。一部の固有名は現行と異なる。注意: 主人公『飯縄』
      （現行は飯綱）は旧。一方『香取アンネ＝マリー』は現行の正と一致する
      （addressing_rules側がむしろ旧名『藤代』のまま）。よって本ドキュメントを
      一律に旧扱いせず、固有名ごとに name_change_registry で正否を判定する。
  fragmentation_warning: >
    重要: 命名の新旧が『どのファイルに正があるか』で割れている。
    ・明神: 正本が新、本文が旧
    ・香取: 初期設定が新、addressing_rules(正本)が旧
    ・飯綱: addressing_rulesが新、Config_v2.5/初期設定が旧
    単一ファイルを『常に正』とは見なせない。固有名は本レジストリを
    唯一の裁定基準（single source of truth）とすること。

# =============================================================
# REVISION DIRECTIVES  —  既存本文への改稿指示
#   第三章を書く前 or 並行で、既存章に施す修正の方針。
# =============================================================
revision_directives:

  - id: RD-01
    target: "第二章 第六話〜第九話（水位・致死性の扱い）"
    problem: >
      第六話の地の文が『水位は膝程度・溺れない』と早期に安全を保証し、
      緊張を自ら解除していた。結果、第七話の救出劇の切迫感と地の文が
      矛盾し、第九話みず葉の『殺しかけて』が事実と食い違って見えた。
    root_cause_reframe:    # 実ファイル照合（ep02_structure.yaml）で判明した真因
      finding: >
        これは設計（L3）の欠陥ではなく、本文化（L5）が構造を裏切った逸脱。
        ep02_structure は既に正しい設計を持っていた:
        ・EP02-INV-02『当初は制御可能に見えるが、想定外により生命危機へ転化』
        ・hazard_progression HZ-01→HZ-04 で恐怖→水位→老朽化破断→生命危機を段階設計
        ・HZ-04『第三者が死を現実に想起する段階』
        つまりL3設計の意図は最初から『本物の生命危機』。第六話本文の
        『膝程度・溺れない』は、上位レイヤー(L3)に反した下位(L5)の逸脱。
      governance_basis: >
        GLOBAL_CONFIG layer_model / resolution_rule に照らせば、L3が正・
        L5が矛盾。本来は『L5を矛盾として報告』すべき事案だった。よって
        RD-01の本質は『L5本文をL3 ep_structureに従わせる改稿』と再定義する。
    principle: >
      致死性の否定を『地の文の事実』から『明神の事後的発見』へ移す。
      危機の最中は誰も（読者も）安全を知らない状態を維持し、緊張を保つ。
      （これは ep02_structure の HZ-04 段階設計をL5で正しく実装すること。）
    revised_beat_sequence:
      - "1. みず葉に生命の危機が迫る状況を明確化し、強調する"
      - "2. 隼太も『このままでは危険』と認識。魔法使用の瀬戸際に立つ"
      - "3. 真魚が隼太を煽り『みず葉を殺そうとしている』とミスリード誘導"
      - "4. みず葉が力技で自力脱出。逃げた真魚を追い、隼太も後を追う"
      - "5. ひとり残された明神が仕掛けに気づき、実は生命の危険は"
      - "   なかったと判明する（致死性否定の遅延配置）"
    constraint_compliance:   # 改稿時に守るべき既存ep_structure制約
      - ref: "EP02 rescue_constraints"
        rule: >
          救出は魔法でなく物理で成立させる（prohibited: 救出の主成立を
          魔法に依存）。ビート2『隼太が魔法使用の瀬戸際』は、最終的に
          魔法不使用で決着すること（瀬戸際まで＝可、使用＝不可）。みず葉の
          自力脱出(ビート4)はこの制約と整合する。
      - ref: "EP02-INV-03"
        rule: "救出は魔法ではなく物理で成立（倫理選択の強調）を維持"
    thematic_payoff: >
      致死性の真相を明神だけが最後に知る構造により、読者・隼太・みず葉・
      真魚・明神がそれぞれ異なる情報量を持つ『認識のズレ』が、破綻では
      なく意図的な多層構造として成立。第一章冒頭の設計思想と一貫する。
    disposition: APPROVED_AWAITING_REWRITE
    note: "みず葉の『殺しかけて』(9話)はみず葉視点で正当な認識として保持可能に"
    scene_card_level_finding:   # SC全10枚の確認で判明した、より精密な真因
      summary: >
        問題はL3でもL5単独でもなく、L4シーンカードの情報配置にあった。
        三層が少しずつズレて緊張が抜けていた。
      layer_trace:
        - "L3 ep02_structure: 正しい（INV-02『生命危機へ転化』HZ-04『死を想起』）"
        - "L4 SC06: key_information_revealedに『水は致死量にならない設計（安全装置）』が混入"
        - "L4 SC07: 実は正しい遅延構造を保持（phase『違和感:水位が想定より低く止まり仕掛けの異常に気づく』）"
        - "L5 本文: SC06の安全情報を地の文で『膝程度・溺れない』と早期に明示してしまった"
      precise_fix:
        - "SC06: key_information_revealed から『致死量にはならない設計（安全装置）』を削除"
        - "  → 同情報を withheld_information へ移動（読者にもこの時点では伏せる）"
        - "SC07: 既存の『違和感』フェーズ（水位が低く止まる）はそのまま活かす"
        - "  → 安全だった事実の判明を、明神が気づくこの地点まで遅延させる"
        - "L5本文: SC06本文から致死性否定の地の文を削除し、SC07の違和感フェーズで開示"
      note: >
        SC07のphase列は吉田さんのRD-01理想形（5ビート）と既にほぼ一致。
        改稿は『新構造の発明』ではなく『SC06の情報配置の是正＋L5の追従』。
      affected_files:
        - "EP02_SC06.yaml（情報配置の修正）"
        - "EP02_SC07.yaml（確認のみ。構造は概ね正しい）"
        - "第二章6〜7話 本文（note掲載分。L4修正に追従）"

  - id: RD-02
    target: "第一章（リライト・挿入）"
    disposition: APPROVED_AWAITING_REWRITE
    directive: >
      真魚の探知手段として『痕跡』設定を追加する。真魚は隼太に、
      父親と同じ『痕跡』を発見した（魔法者と暮らした者だけが持つ、
      喪失の記憶による認識。超常の感知ではなく経験による識別）。
      これを起点に、第一章へ次の因果連鎖を挿入する:
      『真魚の気づき（痕跡の発見）→確かめ行動→隼太に執着を開始→
      恋愛感情と誤解した邪魔者みず葉を人身御供にする陰謀を計画』。
    effect: >
      第二章の真魚の行動（みず葉を罠に嵌める）に遡って冷たい必然性を
      与える。『恋愛と誤解される執着』は第二章ラストの『学校公認
      カップル』誤認まで一本の皮肉な線で繋がる。
    note: "『痕跡』の具体的内容（仕草/気配/目つき等）は当面ぼかす余白を残す"

  - id: RD-03
    target: "第一幕（リライト・挿入箇所は選定）"
    disposition: APPROVED_AWAITING_REWRITE
    directive: >
      『政府側の魔法者もいるらしい』という不正確情報を一瞬だけ記述する。
      歪んだ噂レベルの断片として埋める。
    effect: >
      ミッドポイント以降の香取の正体（感知型・政府潜入スパイ）開示で
      再解釈される周回用の種。情報が不正確であること自体が
      secrecy_model（断片は体系化されない）と整合。
    cross_ref: "ANTAGONIST_FACTION_actII.yaml / detection_system"

