# =============================================================
# RESOLVED QUESTIONS  —  作者確認により解決済み（記録）
# =============================================================
resolved_questions:
  - id: OQ-01
    resolution: "表記『飯綱隼太』／読み『いずな・しゅんた』で確定。CP-000参照"
  - id: OQ-02
    resolution: "管理課係官は『明神明』に統一。甘南備明は表記の暫定。CP-005参照"
  - id: OQ-03
    resolution: "真魚は魔法者ではない（magic_user: false）。将来発動は留保（latent ARMED）"
  - id: OQ-04
    resolution: "第六話の致死性処理を改稿。下記 revision_directives RD-01 に方針を記録"
  - id: OQ-05
    resolution: >
      SE鋳造物は『事実の種類』で扱いを分ける。恒久的事実は昇格、
      可変的演出は正史化しない。下記 se_canon_policy に確定ルールを記録。

# =============================================================
# SE CANON POLICY  —  Side Episode 由来の新事実の扱い（確定）
# =============================================================
se_canon_policy:
  principle: >
    SEは原則 canon消費専用。だがSE生成中に新事実が発生したとき、
    その事実の『種類』によって正史化の要否を分ける。一律ではない。
  rules:
    - id: SECP-01
      category: "恒久的・物語拘束的な事実"
      examples: ["家族構成", "出身・経歴", "人間関係の固定的事実", "能力・体質"]
      handling: "PROMOTE（キャラシート等へ昇格し正史化）"
      rationale: "後続の本文整合を縛るため。放置すると影の正本化する。"
    - id: SECP-02
      category: "可変的・演出的な事実"
      examples: ["服装", "その日の髪型", "一回限りの小物", "場面限定の所作"]
      handling: "DO_NOT_CANONIZE（正史に固定しない）"
      rationale: >
        舞台・季節・場面に合わせ都度決定してよい。固定するとかえって
        演出の自由を奪う。ビジュアル化の段階で個別に考慮する。
  resolved_promotions:
    - ref: CP-D02
      decision: "PROMOTE — 飯綱家の家族設定はキャラシートへ昇格（SECP-01）"
    - ref: CP-D01
      decision: "DO_NOT_CANONIZE — 真魚の私服は固定しない（SECP-02）"

# =============================================================
# PROPER NOUN REGISTRY  —  固有名詞の表記基準（正式/略称/禁止）
#   表記揺れの唯一の裁定基準。固有名詞はここを参照して統一する。
# =============================================================
proper_noun_registry:
  note: >
    固有名詞の正式表記・読み・公認略称・禁止表記を一元管理する唯一の
    裁定基準（single source of truth）。表記揺れを見つけたら本レジストリで
    裁定する。命名『変更』(旧名→新名)は別途 name_change_registry を参照。
  entries:
    - id: PN-001
      official: "六ッ川高校"
      reading: "むつかわこうこう"
      sanctioned_abbr: "むつこう"
      abbr_note: "世間での公認略称。作中の口語・世間の呼称として許容"
