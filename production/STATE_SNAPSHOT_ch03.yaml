  emotional_keynote: "不安定な均衡。表面的日常、水面下に未解決の対立"

# =============================================================
# [A] CANON PROMOTIONS  —  カノン還流待ちキュー
#     生成中に確定したが、まだPMC/キャラシートに記録されていない事実。
#     採否を判断し、採用分は昇格させてから正史化する。
# =============================================================
canon_promotions:

  confirmed_facts:
    # 第一・二章本文で確定し、初期設定にない/詳細化された事実
    - id: CP-000
      fact: >
        主人公の正式表記＝「飯綱隼太」、読み＝「いずな・しゅんた」。
        （初期設定の『飯縄』は変換ミス、『飯綱』が正。読みは現代仮名
