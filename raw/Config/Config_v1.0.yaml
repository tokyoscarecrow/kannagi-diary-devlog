# ==========================================================
# NARRATIVE COMPOSER CONFIG TEMPLATE
# Project: かんなびメモランダム (Kannabi Memorandum)
# Author: Yoshida Ryo
# Version: 1.0
# ==========================================================

project:
  title: "かんなびメモランダム"
  genre: "現代ファンタジー／シニカル社会派コメディ"
  keywords: ["国家機密", "特異体質", "隠し事", "人間関係と孤独", "将来"]
  core_theme: "自分の可能性を拡げ、人生を切り開くのに大事なものは勇気だ"
  tone_style: "静かな現代描写 × 内省的心理 × 映像的リアリズム"
  target_audience: "青年～成人向けドラマ"
  narrative_structure: "三幕構成（導入／対立／解放）"

world:
  summary: "現代日本。10万人に1人が『魔法者』として特異体質を持つ。"
  definition_of_magosha: "精神エネルギーを物質に作用させる能力。強度は感情に強く依存。"
  government_policy: "厚生労働省地方局に『魔法者管理課』設置。対象者を監視・隔離。"
  public_awareness: "魔法者の存在は歴史的に隠蔽され、国家中枢の最高機密。"
  constraints:
    - "発動は感情変動と連動"
    - "使用痕跡は検出可能"
    - "魔法は使用厳禁。公然と使った場合は社会から隔離される"
  ethics_structure: "魔法＝社会の危険因子＝隠蔽・隔離すべき、という国家の秘密政策"
  motifs: ["光", "手", "記録", "記憶"]

magic:
  inheritance: "遺伝的傾向は未確認。発現は突然変異的。"
  categories:
    passive:
      name: "パッシブ能力"
      description: "周囲30mの他者感知。接触時に思考読取。自然発生で禁止対象ではない。"
    active:
      name: "アクティブ能力"
      description: "物質三態（固体・液体・気体）のいずれか一系統のみ操作可能。プラズマ操作は最危険。"
  surveillance:
    traces: "魔法使用時のエネルギー痕跡は検出可能（具体仕様は今後追加可能なプレースホルダ）。"
  control_mechanism: "感情変動と強く連動し、心理的ストレス下で暴発リスクが上昇。"
  taboo_policy: "公私問わず使用禁止。違反時は強制措置入院＝社会的隔離。"

characters:
  - name: "飯綱隼太"
    reading: "いづな しゅんた"
    role: "主人公"
    age: 16
    attributes: ["魔法者", "六ッ川高校2年生"]
    outer_goal: "将来の夢は特にないが、平穏な人生を送りたい。"
    inner_desire: "魔法者という選ばれた人間としての抑圧されたプライドを解放する。"
    greatest_fear: "魔法を使う＝才能を発揮することで、批判や誹謗中傷を受けること。"
    change_arc: "「隠す」→「大事なものを守るために魔法を使いたい」"
    keywords: ["抑圧", "自己承認欲求", "劣等感とプライド", "優しい心根"]

  - name: "大神みず葉"
    reading: "おおみわ みず葉"
    role: "ヒロイン／幼なじみ"
    age: 17
    attributes: ["六ッ川高校2年生"]
    outer_goal: "隼太の能力を知っているが、事情を理解して秘密を守っている。"
    inner_desire: "隼太のことを誰よりも思いやり、心配している。一生そばにいたい。"
    greatest_fear: "魔法のせいで隼太を失うこと。"
    change_arc: "「隼太を庇護下に置きたい」→「隼太の成長を応援したい」"
    keywords: ["親愛", "本心を隠す", "嫉妬と独占欲", "献身", "幼馴染"]

  - name: "氷川真魚"
    reading: "ひかわ まお"
    role: "ヒロイン／転校生"
    age: 16
    attributes: ["六ッ川高校2年生"]
    outer_goal: "優等生として難関大に進学を目指す。友人付き合いは最低限でよい。"
    inner_desire: "魔法者だった父親が家庭を崩壊させたため、魔法者を憎み排除したい。"
    greatest_fear: "魔法者とその魔法。"
    change_arc: "「魔法者はこの世から消えろ」→「魔法が悪いのではない」"
    keywords: ["敵意", "恨み", "拒絶", "見せかけの柔和さ", "孤立", "平穏への憧憬"]

  - name: "住吉奨太郎"
    reading: "すみよし しょうたろう"
    role: "親友"
    age: 17
    attributes: ["六ッ川高校2年生", "クラスメート"]
    outer_goal: "楽しい学校生活を送りたい。苦労や努力が嫌い。将来の夢はラノベ作家。"
    inner_desire: "豊かな想像力が性的方向へ向きがちで、少し変態的なエロ話が多い。"
    change_arc: "「呑気に楽して成功したい」→「本気で夢を実現したい」"
    keywords: ["友情", "性的話題", "家が裕福", "楽天家", "うかつ"]

  - name: "甘南備明"
    reading: "かんなび あきら"
    role: "政府の監視者（南関東厚生地方局）"
    age: 29
    attributes: ["魔法者の監視者", "公務員"]
    outer_goal: "職務をきっちりこなし、官僚として出世し中央省庁に栄転したい。"
    inner_desire: "現在の職務内容に不満。まだ童貞である。"
    change_arc: "「魔法者は監視対象」→「人間としての付き合い」"
    keywords: ["役人根性", "生マジメ", "童貞", "現状から逃げたい"]

  - name: "高島是則"
    reading: "たかしま これのり"
    role: "過去の重要人物／魔法者の発見者"
    life_span: "1851–1923"
    attributes: ["明治12年 内務省寺社局勤務"]
    outer_goal: "魔法者の存在を発見し政府に報告、隠蔽政策の立案に関与。"
    inner_desire: "日本民族の歴史に隠されてきた『魔法者』について秘密裏に研究していた。"
    change_arc: "「学問的興味」→「魔法者は極めて危険な存在である」と結論。"
    keywords: ["研究者", "秘密のすべてを知る者", "歴史の重み", "権威"]

structure:
  base_model: "三幕構成（導入／対立／解放）"
  inciting_incident: "魔法者の隼太と、その秘密を知るみず葉の学校に謎めいた美少女・真魚が転校してくる。"
  turn_point: "転校生・真魚が正体を現し、憎き魔法者を排除しようと行動する。"
  climax: "追い詰められた隼太は、みず葉を守るために魔法を使わざるを得ない状況になる。"
  ending_policy: "静かな共存（AIには「悲劇／融和／別れ」三択で生成評価させる）"

emotion_curve:
  - phase: "導入"
    main_emotion: "安心／緊張の芽生え"
    value_range: [0.2, 0.4]
    note: "日常の中の違和感を表現"
  - phase: "展開"
    main_emotion: "不安／怒り／衝突"
    value_range: [0.5, 0.8]
    note: "対立・秘密の暴露・後悔"
  - phase: "終幕"
    main_emotion: "決戦／受容／別れ"
    value_range: [0.3, 0.6]
    note: "希望を示唆する余韻で閉じる"

scene_card_template:
  scene_id: "EP01_SC01"        # 例: EP01_SC02, EP02_SC01 ...
  title: "放課後の屋上"
  setting: "六ッ川高校の屋上。夕焼け。"
  characters: ["飯綱隼太", "大神みず葉", "氷川真魚"]
  conflict: "恋心と秘密の衝突。隼太の魔法が暴発しかける。"
  emotional_phase: "安堵→緊張→動揺→決意"
  world_rule_reminder: "発動は感情変動と連動／使用痕跡は検出可能／公然使用は隔離処分"
  key_dialogue_hint: "『……もし僕が、普通じゃなかったら？』"
  output_format: "narrative prose + inner monologue + natural dialogue"
  expected_outputs:
    - "SceneText (Markdown)"
    - "EmotionScore (0.0–1.0)"
    - "NarrativeNotes (設定遵守・整合性の自己診断)"
    - "RewriteSuggestions (改善用プロンプト)"

themes_symbols:
  statements:
    - "『魔法』は人間の個性や才能の比喩"
    - "『魔法の禁止』は個性や才能を発揮して他者に関わることの暗喩"
    - "『魔法者への監視』は失敗の恐怖や他者からの非難・誹謗中傷の象徴"
    - "これらの困難を越える鍵は『勇気』"
    - "現代を生き抜くために『他者とのつながり』が大切"
  motifs: ["光", "手", "記録", "記憶"]

evaluation:
  character_consistency:
    description: "キャラの行動・発言が設定と整合しているか"
    method: "AI出力文と設定表の照合（自動＋手動）"
  emotion_tone:
    description: "シーンの感情波形が設定値と一致しているか"
    method: "AI出力から感情スコア抽出／emotion_curveとの偏差を算出"
  world_coherence:
    description: "魔法や監視体制のルール逸脱がないか"
    method: "ルール違反検出プロンプト＋AI自己診断コメント"
  theme_alignment:
    description: "『隠すこと／守ること』および『勇気』『つながり』のモチーフが反映されているか"
    method: "主題語出現率・セマンティック評価（embedding類似度）"

