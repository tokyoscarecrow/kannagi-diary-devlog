# ==========================================================
# NARRATIVE COMPOSER CONFIG
# Project: かんなびメモランダム (Kannabi Memorandum)
# Author: Yoshida Ryo
# Version: 2.3
# ==========================================================

project:
  title: "かんなびメモランダム"
  genre: "現代ファンタジー／シニカル社会派コメディ"
  keywords:
    - "国家機密"
    - "特異体質"
    - "隠し事"
    - "人間関係と孤独"
    - "将来"
  core_theme: "自分の可能性を拡げ、人生を切り開くのに大事なものは勇気だ"
  tone_style: "静かな現代描写 × 内省的心理 × 映像的リアリズム"
  target_audience: "青年～成人向けドラマ"
  narrative_structure: "三幕構成（導入／対立／解放）"

# ----------------------------------------------------------
# WORLD LAYER
# ----------------------------------------------------------
world:
  summary: "現代日本。約10万人に1人の割合で『魔法者』と呼ばれる特異体質者が発現する。"
  definition_of_magosha: "精神エネルギーを物質に作用させる能力。感情変動と強く連動する。"
  government_policy: "厚生労働省地方厚生局に『魔法者管理課』を設置。発見・監視・隔離を担当。"
  public_awareness: "魔法者の存在は国家中枢レベルの最高機密として秘匿されている。"
  ethics_structure: "魔法＝社会不安要因。存在は隠蔽・隔離されるべきという国家判断。"
  motifs:
    - "光"
    - "手"
    - "記録"
    - "記憶"

# ----------------------------------------------------------
# MAGIC SYSTEM
# ----------------------------------------------------------
magic:
  inheritance: "遺伝的傾向は未確認。突然変異的に発現する。"

  categories:
    passive:
      name: "パッシブ能力"
      description: "周囲30m程度の他者感知、接触時の思考読取。自然発生し原則黙認。"
    active:
      name: "アクティブ能力"
      description: "物質三態（固体・液体・気体）のいずれか一系統のみ操作可能。"
      note: "プラズマ操作系は理論上存在が示唆され、最危険区分とされる。"

  prohibition_rules:
    - "他者に影響を与える魔法の使用は厳禁（最重要違反）"
    - "魔法者であることを他者に告げてはならない"
    - "魔法使用を目撃・察知されてはならない"
    - "他の魔法者の存在を公言してはならない"
    - "私的利便に限った使用は黙認される場合がある"

  surveillance:
    method: "気象庁アメダスの秘匿拡張機能による局地気候変動検知"
    blind_spot: "台風・豪雨などの荒天時は検知不能"
    note: "この盲点は国家最高機密"

# ----------------------------------------------------------
# CHARACTER LAYER
# ----------------------------------------------------------
characters:

  - name: "飯綱隼太"
    reading: "いづな しゅんた"
    role: "主人公"
    age: 16
    attributes: ["魔法者", "六ッ川高校2年生"]
    body: "172cm・標準体型"
    personality: "特別な才能を自覚しておらず、平穏な人生を望む諦観型。魔法を『無ければよかった』と思っている。"
    outer_goal: "平凡な高校生活を送る"
    inner_desire: "抑圧された自己価値の解放"
    greatest_fear: "才能を示すことで社会から排除されること"
    change_arc: "隠す → 守るために使う"
    keywords: ["抑圧", "自己承認欲求", "優しさ"]

  - name: "大神みずは"
    reading: "おおみわ みずは"
    role: "ヒロイン／幼なじみ"
    age: 17
    attributes: ["六ッ川高校2年生"]
    body: "155cm・標準体型"
    personality: "明るく成績優秀。幼少期に隼太の魔法に救われた経験を持つ。"
    outer_goal: "隼太の秘密を守る"
    inner_desire: "隼太を失わないこと"
    greatest_fear: "魔法によって隼太が社会から奪われること"
    change_arc: "庇護 → 応援"
    keywords: ["親愛", "献身", "独占欲"]

  - name: "氷川真魚"
    reading: "ひかわ まお"
    role: "転校生／対立者"
    age: 16
    attributes: ["六ッ川高校2年生"]
    body: "164cm・スレンダー"
    personality: "冷静で距離を取るが、内面に激しい感情を抱える。"
    outer_goal: "平穏な学校生活"
    inner_desire: "魔法者への復讐と否定"
    greatest_fear: "魔法という存在そのもの"
    change_arc: "排除 → 再定義"
    keywords: ["恨み", "拒絶", "孤立"]

  - name: "住吉奨太郎"
    reading: "すみよし しょうたろう"
    role: "親友"
    age: 17
    attributes: ["六ッ川高校2年生"]
    body: "184cm・細身"
    personality: "楽天的で想像力過多。軽口が多いが隼太の支え。"
    outer_goal: "楽しい学校生活"
    inner_desire: "承認と成功"
    change_arc: "軽薄 → 本気"
    keywords: ["友情", "楽天性"]

  - name: "明神明"
    reading: "みょうじん あきら"
    role: "政府監視者"
    age: 29
    attributes: ["南関東厚生地方局"]
    personality: "生真面目な官僚。制度と人間の狭間で揺れる。"
    outer_goal: "職務遂行と出世"
    inner_desire: "現状からの逃避"
    change_arc: "監視 → 共犯"
    keywords: ["制度", "迷い"]

# ----------------------------------------------------------
# STYLE GUIDE
# ----------------------------------------------------------
style_guide:
  narrator_person: "三人称近接（隼太寄り）"
  tense: "現在形ベース（回想のみ過去）"
  register: "常体。説明を抑え、行動と感覚を優先"
  sentence_length: "短文7割・中文3割"
  imagery_focus:
    - "手触り"
    - "風や金属音"
    - "夕景の色温度"
  dialogue_format: "会話は鉤括弧、内心は（）"

# ----------------------------------------------------------
# HUMAN BEHAVIOR CONSTRAINTS (NEW)
# ----------------------------------------------------------
human_behavior_constraints:
  purpose: "人間の具体行動・発話の不自然さを抑制するための制約"

  principles:
    - "感情は説明しない。行動と間でにじませる"
    - "会話は未完で終わってよい"
    - "人物は誤解し、判断を保留する"
    - "沈黙・回避・話題転換を行動として扱う"

  dialogue_rules:
    forbid:
      - "感情語の直接表現"
      - "結論を明言する台詞"
      - "関係性の説明台詞"
    prefer:
      - "曖昧な相槌"
      - "言い淀み"
      - "話題転換"
      - "返答しない行動"

  action_granularity:
    preferred:
      - "未完の動作"
      - "身体の一部の反応"
      - "環境との接触"
    avoid:
      - "過剰な感情演出"

  perception_limits:
    rule: "視点人物は状況を誤読してよい"

  failure_injection:
    rule: "1シーンにつき軽微な失敗を最低1回含める"

# ----------------------------------------------------------
# EVALUATION
# ----------------------------------------------------------
evaluation:
  character_consistency: "行動・発言が設定と整合しているか"
  emotion_tone: "感情曲線と乖離していないか"
  world_coherence: "魔法・監視ルールの逸脱がないか"
  theme_alignment: "勇気・隠す／守るモチーフが機能しているか"
