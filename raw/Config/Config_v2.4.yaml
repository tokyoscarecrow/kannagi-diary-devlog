# ==========================================================
# NARRATIVE COMPOSER CONFIG
# Project: かんなびメモランダム (Kannabi Memorandum)
# Author: Yoshida Ryo
# Version: 2.4
# Updated: 2026-02-16
# ==========================================================

project:
  title: "かんなびメモランダム"
  genre: "現代ファンタジー／シニカル社会派コメディ"
  keywords:
    - "国家機密"
    - "特異体質"
    - "隠し事"
    - "人間関係と孤独"
    - "将来"
  core_theme: "自分の可能性を拡げ、人生を切り開くのに大事なものは勇気だ"
  tone_style: "静かな現代描写 × 内省的心理 × 映像的リアリズム"
  target_audience: "青年〜成人向けドラマ"
  narrative_structure: "三幕構成（導入／対立／解放）"

# ----------------------------------------------------------
# WORLD LAYER
# ----------------------------------------------------------

world:
  summary: "現代日本。約10万人に1人の割合で『魔法者』と呼ばれる特異体質者が発現する。"
  definition_of_magosha: "精神エネルギーを物質に作用させる能力。感情変動と強く連動する。"
  government_policy: "厚生労働省地方厚生局に『魔法者管理課』を設置。発見・監視・隔離を担当。"
  public_awareness: "魔法者の存在は国家中枢レベルの最高機密として秘匿されている。"
  ethics_structure: "魔法＝社会不安要因。存在は隠蔽・隔離されるべきという国家判断。"
  motifs:
    - "光"
    - "手"
    - "記録"
    - "記憶"

# ----------------------------------------------------------
# MAGIC SYSTEM
# ----------------------------------------------------------

magic:
  inheritance: "遺伝的傾向は未確認。突然変異的に発現する。"

  categories:
    passive:
      name: "パッシブ能力"
      description: "周囲30m程度の他者感知、接触時の思考読取。自然発生し原則黙認。"
    active:
      name: "アクティブ能力"
      description: "物質三態（固体・液体・気体）のいずれか一系統のみ操作可能。"
      note: "プラズマ操作系は理論上存在が示唆され、最危険区分とされる。"

  prohibition_rules:
    - "他者に影響を与える魔法の使用は厳禁（最重要違反）"
    - "魔法者であることを他者に告げてはならない"
    - "魔法使用を目撃・察知されてはならない"
    - "他の魔法者の存在を公言してはならない"
    - "私的利便に限った使用は黙認される場合がある"

  surveillance:
    method: "気象庁アメダスの秘匿拡張機能による局地気候変動検知"
    blind_spot: "台風・豪雨などの荒天時は検知不能"
    note: "この盲点は国家最高機密"

# ----------------------------------------------------------
# CHARACTER LAYER
# ----------------------------------------------------------

characters:

  - name: "飯綱隼太"
    reading: "いづな しゅんた"
    role: "主人公"
    age: 16
    attributes: ["魔法者", "六ッ川高校2年生"]
    body: "172cm・標準体型"
    personality: "特別な才能を自覚しておらず、平穏な人生を望む諦観型。魔法を『無ければよかった』と思っている。"
    outer_goal: "平凡な高校生活を送る"
    inner_desire: "抑圧された自己価値の解放"
    greatest_fear: "才能を示すことで社会から排除されること"
    change_arc: "隠す → 守るために使う"
    keywords: ["抑圧", "自己承認欲求", "優しさ"]

  - name: "大神みずは"
    reading: "おおみわ みずは"
    role: "ヒロイン／幼なじみ"
    age: 17
    attributes: ["六ッ川高校2年生"]
    body: "155cm・標準体型"
    personality: "明るく成績優秀。幼少期に隼太の魔法に救われた経験を持つ。"
    outer_goal: "隼太の秘密を守る"
    inner_desire: "隼太を失わないこと"
    greatest_fear: "魔法によって隼太が社会から奪われること"
    change_arc: "庇護 → 応援"
    keywords: ["親愛", "献身", "独占欲"]

  - name: "氷川真魚"
    reading: "ひかわ まお"
    role: "転校生／対立者"
    age: 16
    attributes: ["六ッ川高校2年生"]
    body: "164cm・スレンダー"

    personality: >
      冷静で距離を取る。目的のためなら他者を利用する合理性を持つ。
      父の罪を理解しているが、それでも救うと決めている。

    outer_goal: "父救出のための手段探索（表向きは平穏を装う）"
    inner_desire: "連れ去られた父を取り戻すこと"
    greatest_fear: "父が永久に消されること"

    ideological_position:
      initial: "制度を壊してでも救う"
      transition_trigger: "隼太の倫理的選択と行動"
      long_term_arc: "制度の内部に救出可能性を見出す"

    change_arc:
      EP02: "利用 → 人として認識"
      long_term: "制度否定 → 制度再定義"

    relational_state:
      EP02_start:
        隼太: "利用対象"
      EP02_end:
        隼太: "希望の媒介者"
      long_term:
        隼太: "対等な存在"

    speech_style:
      default: "敬語"
      tone: "丁寧だが距離を保つ"
      conditional_shift:
        隼太のみ: "将来的に崩す可能性（未確定）"

    keywords: ["救済", "合理性", "使命", "孤立"]

  - name: "明神明"
    reading: "みょうじん あきら"
    role: "政府監視者"
    age: 29
    attributes: ["南関東厚生地方局"]
    personality: "生真面目な官僚。制度と人間の狭間で揺れる。"
    outer_goal: "職務遂行と出世"
    inner_desire: "現状からの逃避"
    change_arc: "監視 → 共犯"
    keywords: ["制度", "迷い"]

    operational_position:
      - "魔法使用抑止側"
      - "制度側の監視者"

    ethical_baseline:
      - "人命優先"
      - "見殺しにはしない"

# ----------------------------------------------------------
# HUMAN BEHAVIOR CONSTRAINTS
# ----------------------------------------------------------

human_behavior_constraints:
  purpose: "人間の具体行動・発話の不自然さを抑制するための制約"

  principles:
    - "感情は説明しない。行動と間でにじませる"
    - "会話は未完で終わってよい"
    - "人物は誤解し、判断を保留する"
    - "沈黙・回避・話題転換を行動として扱う"

  dialogue_rules:
    forbid:
      - "感情語の直接表現"
      - "結論を明言する台詞"
      - "関係性の説明台詞"
    prefer:
      - "曖昧な相槌"
      - "言い淀み"
      - "話題転換"
      - "返答しない行動"

  action_granularity:
    preferred:
      - "未完の動作"
      - "身体の一部の反応"
      - "環境との接触"
    avoid:
      - "過剰な感情演出"

  perception_limits:
    rule: "視点人物は状況を誤読してよい"

  failure_injection:
    rule: "1シーンにつき軽微な失敗を最低1回含める"

  magic_ethical_cost:
    - "魔法使用は心理的・社会的孤立を加速させうる"
    - "使わない選択は倫理的成立を持つ"
