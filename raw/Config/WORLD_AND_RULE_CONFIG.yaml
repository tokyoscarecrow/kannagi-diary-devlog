WORLD_AND_RULE_CONFIG:
  meta:
    title: "WORLD AND RULE CONFIG"
    project: "かんなぎダイアリー"
    version: "1.2.0"
    layer: "L2"
    status: "active"
    changelog:
      - "1.2.0: 高島是則の地磁気観測所・気象台を利用した魔法使用監視研究と、戦後のアメダス観測網への非公開機能導入という歴史を確定。探知を担う監禁魔法者の存在案は未採用・保留として分離。検知原理の細目は未確定のまま維持。"
      - "1.1.1: 初動制約とエネルギー保存の解釈を分離。各類の個別条件を明確化。魔法者の行政監視と隔離認定の区別を明記。政府組織の部署名称の齟齬を回避し、旧陰陽転換設定の廃止状況を同期。"
      - "1.1.0: 能力を四類体系（第一類=固体/第二類=液体/第三類=気体/第四類=プラズマ）に再整理。二層命名（本来の神通力名は非開示／政府秘匿名=第N類）を導入。諏訪=第三類気体、真魚=第四類プラズマに確定。総一郎=第二類液体に限定（マグマ・気体を削除）。諏訪のプラズマ予約席を廃止。隼太の慣性応用・プラズマの核融合破壊をクライマックス限定設定として追加。"
      - "1.0.0: MAGIC_SYSTEMをL2として新設。"
    role: >
      本作の世界法則（魔法の起源・原理・能力構成・社会規則）を定義する
      L2レイヤー。L1 PROJECT_MASTER_CONTEXT のテーマ原理・世界論理を
      具体的な「動作するルール」に落とし込む。全ての EP構造・Scene Card・
      本文生成は本ファイルの世界法則に準拠する。
    depends_on:
      - "L0 GLOBAL_CONFIG"
      - "L1 PROJECT_MASTER_CONTEXT@1.0.0"
    supersedes:
      - "world_concept_initial.md の能力記述"
      - "Config_v2.5 MAGOSHA_COMMON_RULES の transformation（陰陽転換）※下記参照"
    source_docs:
      - "MAGIC_SYSTEM.yaml v1.0.0（本ファイルの母体）"
    usage: >
      本ファイルは『参照して補う』ものではなく『逸脱していないかを検証する』
      ために使用する。矛盾は自動補正せず、指摘する（GLOBAL_CONFIG準拠）。

  # ========================================================
  # 1. 魔法の起源
  # ========================================================
  origin:
    essence: >
      魔法とは、神・人間・自然が互いに切り離されていなかった時代に
      人間が持っていた能力である。
    kami_definition: "神とは人格神ではなく、八百万の神のような非人格的な自然の存在。"
    mechanism: "魔法は、その自然との接続（共鳴）によって発現する。"
    lineage: >
      魔法者は、古代日本で大和王権に服属しなかった先住民『都知久母
      （つちぐも）』の一部族であるナツヤキヒメ一族の後裔とされる。
    lineage_caveat: >
      ただしこれは長い年月の中で史実・伝承が混在したものであり、
      現代では誰も自らの系譜を自覚していない。

  # ========================================================
  # 2. 発現・継承
  # ========================================================
  inheritance:
    medical_view: "現代医学では遺伝性を確認できない。"
    actual_mechanism: "DNAではなくエピジェネティックな継承によると考えられる。"
    randomness: "家系に関係なくランダムに発現。本人にも家族にも予測できない。"

  # ========================================================
  # 3. 基本原則（禁止則）— 本文生成の絶対制約
  # ========================================================
  fundamental_rules:
    - id: "MR-01"
      rule: "魔法は自然現象への干渉・増幅であり、無から現象を生み出せない。"
    - id: "MR-02"
      rule: "人間や動植物の精神・意思を直接操作することはできない。"
    - id: "MR-03"
      rule: "既に存在する自然現象に対してのみ作用する。"
    - id: "MR-04"
      rule: "既存の物質・自然現象の状態への干渉であり、通常の物理法則だけでは説明できない運動・状態変化を起こしうる。"
  fundamental_rules_note: >
    MR-02（精神操作の禁止）は物語の誠実さを保証する最重要則。洗脳魔法が
    存在しないため、諏訪の勧誘は言葉と思想で行われ、真魚の選択もすべて
    本人の意志による。本文生成時、いかなるキャラの説得・勧誘・支配も
    魔法によって達成してはならない。

  # ========================================================
  # 4. 能力構成：全魔法者 = パッシブ1種 + アクティブ1種
  # ========================================================
  ability_structure:
    passive:
      universality: "魔法者は全員、一種類のみのパッシブ能力を持つ（標準装備）。"
      nature: "自然や周囲の変化を感知する『共鳴能力』。"
      targets:
        - "気温"
        - "湿度"
        - "気圧"
        - "気流"
        - "天候変化"
        - "地面や空気の異変"
        - "他の魔法者や魔法による自然の乱れ"
      image: "万能型の緊急地震速報"
      control: "本人の意思で発動・停止できない。生理現象のように自然に作動。"
      mutual_detection: >
        『他の魔法者』が感知対象に含まれるため、魔法者同士は接近すれば
        互いに何かを感じる。相互探知は双方向。
    passive_visual_sign:
      normal: "濃い茶色の虹彩"
      activated: "ダークグリーン（ウグイス色）へ変化し、元の色と明滅する"
      duration: "ごく短時間。一般人はほとんど気付かない。"
      for_magosha: "魔法者はこれを重要な手掛かりとして認識できる。"
      generation_note: >
        本文では発動時に必ず虹彩の明滅を描写する（作品の視覚文法）。
        ただし『魔法者にしか気づけない』ルールを守り、一般人視点では
        描写しないか、気づかせない。
    active:
      uniqueness: "魔法者は一種類のみのアクティブ能力を持つ。"
      determination: "能力は自然現象・物理現象への親和性によって決まる。"
      restriction: "一人が複数系統を扱うことはできない。"
      common_principle: >
        全類に共通する原理は、既存の物質・自然現象の運動や状態への干渉。
        作用対象を無から創造することはできない。運動の初動条件は類型ごとに
        異なり、第一類は原則として静止した固体を魔法だけで動かせない。
        いったん運動が成立すれば、加減速・停止・方向転換等が可能。
        初動制約はエネルギー保存則による出力制限を意味しない。
        第二類〜第四類の操作条件は各類の規定に従う。

  # --- 能力の類型（四類）---
  ability_taxonomy:
    naming_model:
      true_name: >
        本来は古来から人々が呼んできた神通力に相当する固有の名がある。
        だがその本来の名は作中で最後まで明かさない（誰も正しくは知らない）。
      official_codename: >
        政府機密としての秘匿名。政府側が、現在までに判明しているものを
        『第一類〜第四類』として類別した役所用語。
        順位ではなく分類。『現在までに判明しているもの』であり、これが
        全てとは限らない（未観測の力や、分類に収まらない力の余地を残す）。
      usage_note: >
        役所・厚生局側の人物は秘匿名（第N類・特種）で語る＝制度の冷たさ。
        本来の名は前景化させない。本文で神通力の固有名を創作しないこと。
    classes:
      - id: "第一類"
        type_tag: "A"
        domain: "固体の運動の支配"
        holder: "飯綱隼太"
        can_do: ["動いている固形物の加減速", "浮揚と落下", "停止", "方向転換"]
        restriction: >
          動いていない物は動かせない（まず手で押すなど、運動を与えてから操る）。
        climax_only: >
          【クライマックスシーンのみで使用する設定】隼太は後日、慣性の法則を
          停止させることで、静止物を動かせることに気づく。通常シーンでは使わない。
      - id: "第二類"
        type_tag: "B"
        domain: "液体の運動の支配"
        holder: "氷川総一郎"
        can_do: ["流れている液体の加減速", "浮揚と落下", "方向転換", "平衡"]
        note: >
          原則は第一類と同様だが、液体は簡単に平衡を破れるため固体より
          自在に操れる。電離した流体は含まない（それは第四類の領分）。
        at_mastery: >
          洪水・暴風時の増水など大規模な流れに干渉しうる。ただしMR-01により
          無から発生させることはできず、既存の流れを増幅・制御するのみ。
      - id: "第三類"
        type_tag: "C"
        domain: "気体の運動の支配"
        holder: "諏訪公命"
        can_do: ["気圧の変化", "熱（気温）の変化", "気流＝風や空気抵抗の増減"]
        note: >
          原則は同様だが『空気が動かない』状況はあり得ないため、事実上
          制限を受けない。もっとも万能で有力な魔法。真空では使えない。
        resonance_note: >
          遍在し目に見えない力の性質が、諏訪の『神との再接続』による変質と
          響き合う（最も神に近い性質の力）。
      - id: "第四類"
        type_tag: "X"
        domain: "プラズマの支配"
        holder: "氷川真魚（※現在は未発動。将来発現しうる潜在者）"
        can_do: ["雷・火炎・高温プラズマを自在に動かす"]
        restriction: >
          プラズマの『種』が必要。裸火・ネオン管・電子レンジ等があれば作成可能。
        danger: >
          雷の操作は危険性が大きい。最も危険な系統。
        climax_only: >
          【クライマックスシーンのみで使用する設定】最大の脅威は
          核融合発電所の破壊。真魚の覚醒がもたらす最大スケールの布石であり、
          クライマックス以外では描写・言及しない。
    legacy_note: >
      旧記述『流体操作でマグマ・空気も操れる』『プラズマ系の保持者は諏訪
      （予約席）』は本改稿で廃止。総一郎は第二類（液体のみ）、気体は諏訪
      （第三類）、プラズマは真魚（第四類）に確定。

  # ========================================================
  # 5. 確定済みの能力例
  # ========================================================
  # 各類の詳細は ability_taxonomy.classes を正とする。以下は確定保持者の要約。
  confirmed_abilities:
    izuna_shunta:
      class: "第一類（固体）"
      domain: "固体の運動の支配"
      can_do: ["加速", "減速", "停止", "方向転換"]
      examples: ["ボールをゆっくり飛ばす", "落下物を止める", "花瓶が倒れるのを防ぐ"]
      character_note: "守りと制止の能力。彼の使い方は止める・防ぐ・逸らす。"
    mao_father:
      class: "第二類（液体）"
      domain: "液体の運動の支配"
      holder_name: "氷川総一郎"
      note: "操れるのは液体のみ。電離流体（＝第四類）・気体（＝第三類）は含まない。"
      at_mastery: >
        洪水・暴風時の増水など大規模な流れに干渉しうる。ただしMR-01により
        無から発生させることはできず、既存の流れを増幅・制御するのみ。
    suwa_komei:
      class: "第三類（気体）"
      domain: "気体の運動の支配（気圧・気温・気流）"
      note: "最も万能で有力。遍在し制限を受けにくい。真空では不可。"
    hikawa_mao:
      class: "第四類（プラズマ）"
      status: "現在は未発動の潜在者（magic_user: false）。将来発現しうる。"
      note: "発現時はプラズマ（雷・火炎）を操る。最も危険な系統。種が必要。"

  # ========================================================
  # 6. 社会との関係：秘匿と永久隔離
  #    （L1 PMC secrecy_model / control_structure を具体化）
  # ========================================================
  social_rules:
    secrecy: "魔法の存在は国家によって秘匿されている。"
    legality: "魔法そのものは禁止ではない。"
    isolation_rule: >
      第三者に魔法者であることが明確に発覚した場合、人間社会から
      永久隔離される。このため魔法者は日常生活で能力を隠して生きる。
    isolation_trigger:
      definition: "『発覚』とは公的な露見・当局の認定を指す。"
      private_sharing: >
        私的な秘密の共有は『発覚』に含まれない。当局が知らない／
        立証できない限り、隔離条件を満たさない。
      canon_case: >
        隼太は幼稚園時の魔法使用について『誰にも見せていません』と
        主張し、みず葉も第三者に秘密を話していない。一方で、隼太は
        当局の監視対象であり、明神による月次面接を受ける。
        当局による監視と、第三者への公的露見に基づく隔離認定は別の事柄。
        隼太が登録・監視対象となった経緯は本項目では規定しない。
    isolation_facility:
      existence: "発覚した魔法者を収容する隔離施設が実在する。"
      description: "古い団地のような場所。一人一部屋に隔離され、誰とも会えない。"
      roles: ["体制の闇の物理的実体", "真魚の父の居場所", "諏訪の解放目標"]
    detection_system_amedas:
      nature: >
        国家はアメダス観測網の非公開機能を利用して、魔法使用を監視する
        システム（通称アメダス）を運用している。
      historical_development:
        takashima_research: >
          明治期、高島是則の研究により、既存の地磁気観測所と気象台を
          活用した魔法使用監視方法が開発された。
        meiji_to_prewar: >
          明治期から戦前までの監視方法は検知精度が低く、
          実際の監視への有効性は限定的であった。
        postwar_to_modern: >
          戦後、観測技術と観測網の発展に伴って監視方法が継承・改良された。
          アメダス観測網の導入後、同網に非公開の裏機能が組み込まれ、
          現代の監視体制へつながった。裏機能の設置開始年は未確定。
      infrastructure_rule: >
        魔法監視専用の独立した観測装置は設けない。
        既存の地磁気・気象観測施設およびアメダス観測網を活用する。
        裏機能の具体的な機器構成、検知原理、分析方法は未確定。
      limitation: "『使用』のみ検知。未使用の魔法者・潜在者は捕捉できない。"
      weather_flaw: >
        荒天下では大量の誤検知が発生し、機能不全に陥る（沈黙ではなく攪乱）。
        諏訪が災害時に動く戦略的根拠のひとつ。
      unresolved_details:
        - "魔法使用を判定する物理的・技術的原理"
        - "検知できる規模・範囲・位置特定精度"
        - "四類の能力による検知精度の違い"
        - "検知後の行政側の具体的な対応手順"
      reserved_plot_option:
        status: "HOLD"
        canon: false
        idea: >
          政府に隔離・監禁され、魔法の探知だけを行う魔法者が存在する可能性。
          物語のジョーカーとして使用できる余地を残す。
        restriction: >
          存在の有無、能力の特殊性、拘束理由、具体的な運用はいずれも未確定。
          作者の採用判断までは確定設定として本文・Scene Cardに混入させない。

  # ========================================================
  # 7. 魔法消去法（高島の最奥義）
  # ========================================================
  erasure_method:
    discovery: "高島是則が『魔法とは能力ではなく接続である』と見抜いた。"
    related_research: >
      高島は魔法消去法とは別に、地磁気観測所と気象台を用いた魔法使用の
      監視方法も開発した（詳細は social_rules.detection_system_amedas.historical_development）。
    definition: "接続そのものを断つ方法。魔法者は死なず普通の人間になる。"
    cost: "使用者自身にも作用する。"
    status: "断片的記述から推測される最奥義。再発見には多大な知力を要する。"
    plot_role: "明神が中盤以降に再発見する（隼太陣営の切り札 / TH-03）。"

  # ========================================================
  # 8. 旧設定との整合メモ（要確認事項）
  # ========================================================
  legacy_reconciliation:
    - id: "LR-01"
      issue: >
        Config_v2.5 MAGOSHA_COMMON_RULES の transformation
        『陰と陽の転換時に心身変調が起きる』は旧記述。
        Config_v3.0 の変更履歴で廃止済みと明記されている。
      status: "CLOSED"
      resolution: "現行の魔法運用ルールには適用しない。再採用する場合は作者の明示的な設定変更を要する。"
      note: "旧設定として履歴のみ保持し、本文生成時に自動復活させない。"
