WORLD_AND_RULE_CONFIG:
  meta:
    title: "WORLD AND RULE CONFIG"
    project: "Kannagi Diary"
    version: "1.1.0"
    layer: "L2"
    status: "active"
    role: >
      本作の世界法則（魔法の起源・原理・能力構成・社会規則）を定義する
      L2レイヤー。L1 PROJECT_MASTER_CONTEXT のテーマ原理・世界論理を
      具体的な「動作するルール」に落とし込む。全ての EP構造・Scene Card・
      本文生成は本ファイルの世界法則に準拠する。
    depends_on:
      - "L0 GLOBAL_CONFIG"
      - "L1 PROJECT_MASTER_CONTEXT@1.0.0"
    supersedes:
      - "world_concept_initial.md の能力記述"
      - "Config_v2.5 MAGOSHA_COMMON_RULES の transformation（陰陽転換）※下記参照"
    source_docs:
      - "MAGIC_SYSTEM.yaml v1.0.0（本ファイルの母体）"
    usage: >
      本ファイルは『参照して補う』ものではなく『逸脱していないかを検証する』
      ために使用する。矛盾は自動補正せず、指摘する（GLOBAL_CONFIG準拠）。
    changelog:
      - version: "1.1.0"
        date: "2026-08-24"
        category: "canonical"
        approval_status: "approved"
        changes:
          - "detection_system_amedas を全面改訂（3行 → 検知原理・解像度・記録の完全定義）"
          - "痕跡＝地磁気・大気電場の微細擾乱と確定。接続の副産物であり系統差なし"
          - "パッシブが検知不能である理由を原理化（受信のみ＝痕跡を残さない）"
          - "正式名称『特種気象観測網』／実在アメダスへの物理的相乗りを確定"
          - "ログ永久保存を確定"
          - "isolation_trigger に detection_routes（機械経路／人的経路の二重性）を新設"
          - "isolation_trigger に canon_case_shunta（幼稚園期・小学生期の経路別記録）を新設"
          - "erasure_method に discovery_path（高島の到達経路・前史）を追加"
          - "erasure_method に posthumous_records を追加（遺稿の構成は意図的にOPEN）"
      - version: "1.0.0"
        changes:
          - "初版。MAGIC_SYSTEM.yaml v1.0.0 を母体としてL2を新設"

  # ========================================================
  # 1. 魔法の起源
  # ========================================================
  origin:
    essence: >
      魔法とは、神・人間・自然が互いに切り離されていなかった時代に
      人間が持っていた能力である。
    kami_definition: "神とは人格神ではなく、八百万の神のような非人格的な自然の存在。"
    mechanism: "魔法は、その自然との接続（共鳴）によって発現する。"
    lineage: >
      魔法者は、古代日本で大和王権に服属しなかった先住民『都知久母
      （つちぐも）』の一部族であるナツヤキヒメ一族の後裔とされる。
    lineage_caveat: >
      ただしこれは長い年月の中で史実・伝承が混在したものであり、
      現代では誰も自らの系譜を自覚していない。

  # ========================================================
  # 2. 発現・継承
  # ========================================================
  inheritance:
    medical_view: "現代医学では遺伝性を確認できない。"
    actual_mechanism: "DNAではなくエピジェネティックな継承によると考えられる。"
    randomness: "家系に関係なくランダムに発現。本人にも家族にも予測できない。"

  # ========================================================
  # 3. 基本原則（禁止則）— 本文生成の絶対制約
  # ========================================================
  fundamental_rules:
    - id: "MR-01"
      rule: "魔法は自然現象への干渉・増幅であり、無から現象を生み出せない。"
    - id: "MR-02"
      rule: "人間や動植物の精神・意思を直接操作することはできない。"
    - id: "MR-03"
      rule: "既に存在する自然現象に対してのみ作用する。"
    - id: "MR-04"
      rule: "自然法則の否定ではなく、流れの一時的変化である。"
  fundamental_rules_note: >
    MR-02（精神操作の禁止）は物語の誠実さを保証する最重要則。洗脳魔法が
    存在しないため、諏訪の勧誘は言葉と思想で行われ、真魚の選択もすべて
    本人の意志による。本文生成時、いかなるキャラの説得・勧誘・支配も
    魔法によって達成してはならない。

  # ========================================================
  # 4. 能力構成：全魔法者 = パッシブ1種 + アクティブ1種
  # ========================================================
  ability_structure:
    passive:
      universality: "魔法者は全員、一種類のみのパッシブ能力を持つ（標準装備）。"
      nature: "自然や周囲の変化を感知する『共鳴能力』。"
      targets:
        - "気温"
        - "湿度"
        - "気圧"
        - "気流"
        - "天候変化"
        - "地面や空気の異変"
        - "他の魔法者や魔法による自然の乱れ"
      image: "万能型の緊急地震速報"
      control: "本人の意思で発動・停止できない。生理現象のように自然に作動。"
      mutual_detection: >
        『他の魔法者』が感知対象に含まれるため、魔法者同士は接近すれば
        互いに何かを感じる。相互探知は双方向。
    passive_visual_sign:
      normal: "濃い茶色の虹彩"
      activated: "ダークグリーン（ウグイス色）へ変化し、元の色と明滅する"
      duration: "ごく短時間。一般人はほとんど気付かない。"
      for_magosha: "魔法者はこれを重要な手掛かりとして認識できる。"
      generation_note: >
        本文では発動時に必ず虹彩の明滅を描写する（作品の視覚文法）。
        ただし『魔法者にしか気づけない』ルールを守り、一般人視点では
        描写しないか、気づかせない。
    active:
      uniqueness: "魔法者は一種類のみのアクティブ能力を持つ。"
      determination: "能力は自然現象・物理現象への親和性によって決まる。"
      restriction: "一人が複数系統を扱うことはできない。"

  # ========================================================
  # 5. 確定済みの能力例
  # ========================================================
  confirmed_abilities:
    izuna_shunta:
      domain: "質量を持つ物体の運動状態への干渉"
      can_do: ["加速", "減速", "停止", "運動方向変更"]
      examples: ["ボールをゆっくり飛ばす", "落下物を止める", "花瓶が倒れるのを防ぐ"]
      character_note: "守りと制止の能力。彼の使い方は止める・防ぐ・逸らす。"
    mao_father:
      domain: "流体への干渉"
      targets: ["水", "空気", "泥流", "マグマなどの流体"]
      at_mastery: >
        洪水・暴風・火山活動への干渉など大規模自然災害を誘発しうる。
        ただしMR-01により、無から発生させることはできず、既存の流れを
        増幅・制御するのみ。
    plasma_type:
      domain: "プラズマ・炎・雷・高エネルギー状態"
      status: "未登場。もっとも危険な系統。保持者は未確定（諏訪の予約席候補）。"

  # ========================================================
  # 6. 社会との関係：秘匿と永久隔離
  #    （L1 PMC secrecy_model / control_structure を具体化）
  # ========================================================
  social_rules:
    secrecy: "魔法の存在は国家によって秘匿されている。"
    legality: "魔法そのものは禁止ではない。"
    isolation_rule: >
      第三者に魔法者であることが明確に発覚した場合、人間社会から
      永久隔離される。このため魔法者は日常生活で能力を隠して生きる。
    isolation_trigger:
      definition: "『発覚』とは公的な露見・当局の認定を指す。"
      private_sharing: >
        私的な秘密の共有は『発覚』に含まれない。当局が知らない／
        立証できない限り、隔離条件を満たさない。
      canon_case: >
        隼太は幼稚園時に『誰にも見せていません』とシラを切り通し、
        みず葉も第三者に話さず秘密を守り続けている。ゆえに隔離の
        条件は成立していない。ただし隼太は監視対象として登録されて
        おり、『隔離の網の外』であって『制度の網の外』ではない。
      detection_routes:
        principle: >
          当局が魔法者を把握する経路は二系統ある。機械（アメダス）と
          人間（目撃・通報・噂の伝播）。両者は独立に作動する。
        mechanical:
          source: "特種気象観測網による痕跡検知"
          limitation: "閾値以下は埋没。荒天下は判別不能。個人は特定できない"
        human:
          source: "目撃・通報・噂の伝播（教師・保護者・地域・ネット）"
          limitation: >
            立証を伴わない。本人が否認し第三者の証言が固まらなければ
            『発覚』の認定には至らない。
        interaction: >
          機械経路は領域までしか示さず、人的経路は立証力を欠く。両者が
          結合したときに初めて当局の認定（＝isolation_trigger の成立）へ
          近づく。片方のみでは監視対象登録に留まりうる。
      canon_case_shunta:
        kindergarten:
          route: "人的経路"
          detail: >
            微弱な遊びの魔法が園児間に広まり、教師から保護者へ伝播した
            段階で当局が察知した。使用規模は閾値以下でありアメダスは
            反応していない。本人が否認を貫き立証されなかったため隔離には
            至らず、監視対象として登録された。
        elementary:
          route: "いずれの経路も作動せず"
          detail: >
            荒天下での使用であったためアメダスは判別不能。目撃者は
            みず葉のみであり、彼女が沈黙を守ったため人的経路も作動せず。
            当局の記録に存在しない。
          consequence: >
            当局のファイル上、隼太は『幼少期に微弱な使用歴のある低リスク
            対象』でしかない。最も重大な使用は記録されていない。監視官の
            明神は担当対象の本質を知らないまま職務を遂行している。
          thematic_role: >
            隼太は監視されているが、監視されている理由は本当の理由では
            ない。罪悪感の核心が制度の外側にある（TP-001）。
    isolation_facility:
      existence: "発覚した魔法者を収容する隔離施設が実在する。"
      description: "古い団地のような場所。一人一部屋に隔離され、誰とも会えない。"
      roles: ["体制の闇の物理的実体", "真魚の父の居場所", "諏訪の解放目標"]
    detection_system_amedas:
      official_name: "特種気象観測網"
      common_name: "アメダス"
      nature: "国家は魔法使用の痕跡を検知するシステムを持つ。"
      limitation: "『使用』のみ検知。未使用の魔法者・潜在者は捕捉できない。"
      name_origin: >
        気象庁の地域気象観測システム（アメダス）の観測点・データ回線に
        物理的に相乗りしているため、現場職員が本来のアメダスと区別せず
        呼ぶうちに通称として定着した。対外的には正式名称を出しても
        差し支えない（実際に地磁気の特異変動を観測しているため嘘がない）。
      dependency_note: >
        母体の観測網が停止すれば本網も停止する。災害時の脆弱性は二重。

      # ---- 何を検知しているのか ----
      detection_target:
        principle: "魔法そのものは検知していない。検知対象は使用時に残る痕跡のみ。"
        trace: "地磁気および大気電場の微細な擾乱。"
        source_of_trace: >
          痕跡は『何をしたか』ではなく『繋がったこと』から生じる。
          すなわち自然との接続そのものの副産物であり、能力の効果とは無関係。
        no_system_variance: >
          系統による検知差はない。運動干渉系も流体系もプラズマ系も、
          痕跡の性質は同一。差が出るのは規模のみ（設定簡潔化のための確定事項）。
        passive_undetectable: >
          パッシブ（共鳴感知）は受信のみで自然に干渉しないため、痕跡を
          残さず原理的に検知不能。アクティブは干渉＝送信であり位置を晒す。
          これにより『未使用の魔法者・潜在者は捕捉できない』が例外規定では
          なく原理的帰結となる。

      # ---- 国家の理解の限界（TP-001の物証）----
      state_understanding:
        knows: "魔法使用と磁場擾乱に相関があることを経験的に把握している。"
        does_not_know: >
          なぜ相関するかを説明できていない。理論はなく、閾値と統計処理だけが
          運用されている。国家は魔法を『能力』と誤認しているため、痕跡を
          『能力の副作用』と解釈している。
        thematic_role: >
          検知システムの設計思想の限界そのものが、国家の認識のズレの物証。
          同じデータを見て、国家は運用に使い、高島は原理に到達した。

      # ---- 解像度（基地局方式）----
      resolution:
        model: "携帯電話の基地局測位に類似。おおよその領域までしか分からない。"
        single_point: "単独観測点では判定不能。"
        judgement: "複数観測点の同時性と空間相関により異常と判定する。"
        obtainable:
          - "時刻（分オーダー）"
          - "領域（数百m〜数km）"
          - "規模の大小（ぼんやりと）"
        not_obtainable:
          - "個人の特定"
          - "系統の識別"
        identification_process: >
          個人特定は既知名簿との突合・現地調査・目撃情報という人力の照合
          作業に依存する。ここに管理課の実務が発生し、同時に官僚組織の
          処理速度が構造的ボトルネックとなる。
        sub_threshold: "閾値以下の微弱な使用はノイズに埋没し、検知されない。"

      # ---- 荒天下の機能不全 ----
      weather_flaw:
        mechanism: >
          台風・雷雨下では連続的な雷放電と空電により広域の電磁環境が乱れ、
          閾値超過が全域で発生し続ける。S/N比が崩壊する。
        nature: "沈黙ではなく攪乱。検知が止まるのではなく、判別が不可能になる。"
        consequences:
          - "荒天下の魔法使用は事実上検知されない"
          - "諏訪が災害時に公然と行動する戦略的根拠"
          - "諏訪組の安全は『検知されない』ではなく『照合されない』に留まる"

      # ---- 記録 ----
      logging:
        retention: "観測ログは永久に保存される。破棄されない。"
        note: >
          荒天下の使用も『記録が無い』のではなく『ノイズに埋もれた記録が
          残り続けている』。当時の技術で抽出できなかっただけである。
        enables: >
          明神が高島の時代（1913年前後）の観測記録を再解析しうる根拠。
        idea_only_not_canon:
          item: "遡及発見の脅威"
          detail: >
            永久保存ゆえ、解析技術の進歩により過去のノイズ埋没ログから
            隼太の小学生期の使用が遡って発見されうる。時効がない。
          status: >
            アイディアとして記録するのみ。現時点では設定として使用しない
            （作者判断 2026-08）。採用する場合は明神が最初に気づく位置にある。

      # ---- 前史（制度の地層）----
      history:
        - era: "前近代"
          system: "寺社報告網"
          detail: >
            怪異・祟り・凶兆の報告が神社・寺社を通じて中央へ上がる制度。
            加えて磁針の狂いが古くから兆候として知られていた（羅針の乱れ＝凶兆）。
            技術ではなく経験則と報告網によって運用されていた。
        - era: "明治以降"
          system: "内務省寺社局"
          detail: >
            寺社報告網が近代官僚機構に吸収される。魔法管理は『宗教行政の
            一部』として制度化された。高島是則の所属はこの経緯による。
        - era: "1913年前後"
          system: "観測の科学化"
          detail: >
            地磁気観測が都市の人工的な磁気ノイズにより不能となり、観測所が
            移転。『人工的なノイズが観測を殺す』という現代の weather_flaw の
            原型が、システムの誕生時点に既に存在していた。
          fact_check_note: >
            東京→柿岡への移転経緯は現実の史実に基づく想定。正史固定前に
            年号・経緯の裏取りを推奨（作者メモ）。
        - era: "戦後"
          system: "厚生省へ移管"
          detail: >
            内務省解体に伴い移管。『特種能力者管理課』という名称の官僚的な
            曖昧さもこの経緯による。明神が厚生局に所属する制度史的根拠。
        - era: "現代"
          system: "気象庁観測網への相乗り（通称アメダス）"
          detail: "特種気象観測網として運用。name_origin 参照。"

  # ========================================================
  # 7. 魔法消去法（高島の最奥義）
  # ========================================================
  erasure_method:
    discovery: "高島是則が『魔法とは能力ではなく接続である』と見抜いた。"
    definition: "接続そのものを断つ方法。魔法者は死なず普通の人間になる。"
    cost: "使用者自身にも作用する。"
    status: "断片的記述から推測される最奥義。再発見には多大な知力を要する。"
    plot_role: "明神が中盤以降に再発見する（隼太陣営の切り札 / TH-03）。"

    # ---- 到達経路 ----
    discovery_path:
      position: >
        高島是則は内務省寺社局の官僚として、前近代からの寺社報告網
        （怪異・祟り・凶兆の報告）を管掌する立場にあった。1913年前後の
        観測科学化に際し、寺社局側の連絡官として観測所に関与した。
      method: >
        寺社報告網に蓄積された怪異報告と、観測記録の数値・日付を突合し、
        相関を発見した。そこから『魔法とは能力ではなく接続である』という
        原理へ到達し、接続を断つ方法を導いた。
      significance: >
        国家は同じデータを運用にのみ用い、原理に到達しなかった。高島は
        ただ一人、痕跡が『能力の副作用』ではなく『接続の副産物』である
        ことを見抜いた。ゆえに彼だけが消去法に至れた。
      rediscovery_implication: >
        明神による再発見は『書物を読む』のではなく『高島と同じ照合作業を
        100年遅れで再演する』形をとる。ログが永久保存であることが根拠。
        再発見は天才性ではなく執念によって成立する。

    # ---- 遺稿（OPEN：確定させない）----
    posthumous_records:
      status: OPEN
      confirmed:
        - "震災で正本は焼失した"
        - "何らかの形で断片が現存し、明神の再発見の手掛かりとなる"
        - "玄孫(1948-)が健在であり、入手経路の候補である"
      design_warning: >
        全ての答えが記された単一の書物を作らないこと。発見した瞬間に
        物語が終結する。断片は入手経路と解読条件を分離すること。
      unconfirmed_candidates:
        note: >
          以下は候補であり確定ではない。本文進行が要求する形が見えた
          時点で作者が決定する（GP-005 / 推測補完で確定扱いしない）。
        three_layer_hypothesis:
          - layer: "公文書（寺社局業務記録・現存・閲覧可能）"
            role: "明神の入口。職務権限の内側で正当にアクセスできる"
          - layer: "観測記録の副本（現存・要照合）"
