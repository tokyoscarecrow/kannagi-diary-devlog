# ==========================================================
# ADDRESSING RULES
# File: config/addressing_rules.yaml
# Version: 1.0
# Updated: 2026-02-16
#
# Purpose:
#   - キャラクター同士の呼称・敬称・心理距離を一貫管理する
#   - 呼称変化は「特定イベント発生後」にのみ切り替える
#   - ストーリー詳細ではなく、出力制御ルールとして扱う
# ==========================================================

addressing_rules:
  meta:
    note: "キャラクター同士の呼び方・敬称・心理距離の一貫管理。今後随時追加・修正可能。"
    policy:
      - "原則として default を使用する"
      - "transition は特定イベント発生後のみ有効化する"
      - "trigger の詳細内容は本ファイルでは規定しない"
      - "呼称変化は関係変化の結果であり、先行して使用しない"

  # ---------------------------------------------
  # 1. 飯綱隼太 → 他キャラ
  # ---------------------------------------------
  izuna_shunta:
    to_mizuha: "みずは"
    to_mao:
      default: "氷川さん"
      transition:
        trigger: "REL_EVENT_SHUNTA_TO_MAO_SHIFT"
        value: "真魚さん"
    to_sumiyoshi: "奨太郎"
    to_myojin: "明神さん"
    to_suwa: "諏訪先輩"
    to_anne_marie: "香取さん"

  # ---------------------------------------------
  # 2. 大神みずは → 他キャラ
