# =========================================
# CHANGELOG
# =========================================
changelog:
  - version: "v2.5"
    changes:
      - "speech_style を CHARACTER_LAYER に追加"
      - "飯縄隼太の口調を neutral 寄りに修正（住吉との差別化）"
      - "キャラクターごとの発話ルールを明文化"
      - "セリフ生成時のブレ防止のための制約を追加"
      - "キャラクター相互の呼称を定義"

# =========================================
# MAGOSHA COMMON RULES
# =========================================
MAGOSHA_COMMON_RULES:
  presence:
    description: "魔法者は場に完全同化せず、微細な違和感を残す"
  transformation:
    description: "陰と陽の転換時に心身変調が起きる"
  exposure_risk:
    description: "魔法の使用は社会的リスクを伴う（監視・記録・拘束）"

# =========================================
# HUMAN BEHAVIOR CONSTRAINTS
# =========================================
HUMAN_BEHAVIOR_CONSTRAINTS:
  general:
    - "感情は説明せず、行動と会話で表現する"
    - "1シーンにつき最低1つの軽微な不具合またはズレを含める"
    - "登場人物は常に自分の認識範囲でのみ判断する"
  dialogue:
    - "説明的な台詞は禁止"
    - "情報は会話のズレや間で提示する"

# =========================================
# CHARACTER LAYER
# =========================================
CHARACTER_LAYER:

  # -------------------------
  # 飯縄隼太
  # -------------------------
  hayata:
    role: "主人公 / 調停者"
    core_traits:
      - "受動的"
      - "状況判断型"
      - "他者を優先する"
    relationships:
      mizuha: "幼なじみ / 無自覚に特別視"
      mayo: "警戒と興味が混在"
      myojin: "監視官 / 面倒な大人"
    speech_style:
      tone: "neutral_casual"
      traits:
        - "口語だが崩しすぎない"
        - "短文"
        - "反応主体"
        - "感情を強く出さない"
      examples:
        - "そうか"
        - "まあいい"
        - "どうだろうな"
        - "分からない"
      forbidden:
        - "過度な砕け表現（例：〜じゃん多用）"
        - "過剰なツッコミ"
        - "感情的な長台詞"

  # -------------------------
  # 大神みずは
  # -------------------------
  mizuha:
    role: "ヒロイン / 感情ドライバー"
    core_traits:
      - "直情型"
      - "独占欲"
      - "行動が先に出る"
    relationships:
      hayata: "強い執着 / 無自覚な恋愛感情"
      mayo: "対抗意識"
    speech_style:
      tone: "emotional"
      traits:
        - "感情が先に出る"
        - "強い断定"
        - "声量・勢いがある"
      examples:
        - "違う！"
        - "〜なの！"
        - "絶対にそう！"
      forbidden:
        - "論理的すぎる会話"
        - "長い冷静な説明"

  # -------------------------
  # 氷川真魚
  # -------------------------
  mayo:
    role: "対立軸 / 観察者"
    core_traits:
      - "孤立"
      - "内面に強い目的を持つ"
      - "他者との距離がある"
    relationships:
      hayata: "利用対象 → 変化対象（EP02以降）"
      mizuha: "対立存在"
    speech_style:
      tone: "polite"
      traits:
        - "常に敬語"
        - "丁寧だが過剰ではない"
        - "感情を抑制"
        - "一歩距離を置いた言い方"
      examples:
        - "そうですね"
        - "問題ありません"
        - "少しよろしいでしょうか"
      forbidden:
        - "砕けた口調"
        - "感情的な発言"
        - "敬語崩れ（※例外は将来イベント時のみ）"

  # -------------------------
  # 住吉
  # -------------------------
  sumiyoshi:
    role: "コメディ / 撹乱役"
    core_traits:
      - "軽薄"
      - "空気をかき回す"
      - "対人距離が近い"
    relationships:
      hayata: "友人 / 振り回され役"
    speech_style:
      tone: "casual_comedic"
      traits:
        - "砕けた口調"
        - "軽口"
        - "茶化し"
        - "テンション高め"
      examples:
        - "マジで？"
        - "それヤバくない？"
        - "ウケる"
      forbidden:
        - "真面目な長台詞"
        - "丁寧語"

  # -------------------------
  # 明神明
  # -------------------------
  myojin:
    role: "監視者 / 制度の代弁者"
    core_traits:
      - "事務的"
      - "感情が薄い"
      - "規則優先"
    relationships:
      hayata: "監視対象 / 定期面接相手"
    speech_style:
      tone: "formal_flat"
      traits:
        - "丁寧語"
        - "定型応答"
        - "抑揚が少ない"
      examples:
        - "お答えできません"
        - "それは管轄外です"
        - "必要な措置です"
      forbidden:
        - "感情的表現"
        - "砕けた言い回し"

# =========================================
# WORLD HISTORY LAYER（概要）
# =========================================
WORLD_HISTORY_LAYER:
  summary:
    - "魔法者は歴史的に管理・監視対象である"
    - "国家はその存在を秘匿している"
    - "違反者は拘束・隔離される"

# =========================================
# RELATION EXPRESSION
# =========================================
relation_expression:
  addressing_rules_ref: "config/addressing_rules.yaml"
  note: "呼称・敬称・心理距離の管理は独立ファイルで行う"

# =========================================
# NOTES
# =========================================
notes:
  - "speech_style は全シーン生成の強制制約として扱う"
  - "例外は必ずイベントとして定義する（例：真魚の敬語崩れ）"

OUTPUT_FORMAT_CONSTRAINTS:
  forbidden:
    - "horizontal rules (---)"

