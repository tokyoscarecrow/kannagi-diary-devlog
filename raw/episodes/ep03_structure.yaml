# ==========================================================
# EPISODE STRUCTURE DEFINITION
# Episode: EP03（第三章 / 第二幕・前半）
# File: episodes/ep03_structure.yaml
# Version: 1.0
# Updated: 2026-06-22
#
# Purpose:
#   - EP03固有の舞台・装置・災害進行・救出制約・進行方式を定義する
#   - EP02と異なり、EP03は10話・複数舞台・2ライン進行を含むため、
#     「単一事件の物理設計」に加え「章全体の進行制約」も定義する
#   - ストーリー展開／台詞／心理／演出指示は規定しない（構造・制約のみ）
# ==========================================================

episode:
  id: EP03
  title: "第三章（第二幕・前半）"
  structure_version: 1.0
  status: active
  act: "第二幕・前半"
  episode_count: 10   # SC01〜SC10
  depends_on:
    - PROJECT_MASTER_CONTEXT@1.0.0
    - WORLD_AND_RULE_CONFIG@1.0.0
    - Config@3.0
    - addressing_rules@1.0
    - STATE_SNAPSHOT_ch03

scope:
  includes:
    - locations
    - progression_structure   # 2ライン交互・クリフハンガー方針
    - devices
    - hazard_progression       # 崖の土砂災害
    - rescue_constraints
    - foreshadow_seeds         # 周回の種の配置
  excludes:
    - plot
    - dialogue
    - scene_breakdown          # 話数構成は別ファイル（episode_breakdown）
    - character_emotion_design

# ==========================================================
# 章全体の進行方式
# ==========================================================
progression_structure:
  cliffhanger_rule:
    statement: "全SCのラストはクリフハンガーで終わる"
    method:
      - "弛緩から緊張への落差を作る（コメディで緩めて不穏で締める等）"
      - "各話に『次を読ませる』引きを必ず持たせる"
      - "情報優位（読者だけが知る）を引きに使ってよい"
  dual_line:
    span: "SC04〜SC07"
    line1: "みず葉 × 真魚（父の話 → 古い団地の手がかり）"
    line2: "明神 × 隼太（魔法者失踪 → 体制の綻び）"
    convergence:
      at: "SC07"
      point: "香取桃子のファイル窃盗 → 諏訪が隼太の資料を見る"
      effect: "『探す者たちの物語』が『探される隼太の物語』に収束する"
  tension_curve:
    shape: "上昇したまま終わる（EP02の山型と異なり収束させない）"
    peak: "SC10（92）＝諏訪の完全勝利で章を閉じる"
    note: "SC10は恐怖でなく高揚のピーク。EP02のピーク（95・恐怖）と対をなす"

# ==========================================================
# 章全体の前提（全SCに効かせる背景設定）
# ==========================================================
episode_premises:
  - id: PREM-01
    premise: "隼太とみず葉は高校2年の受験生。正統館大学は志望校の一つで、まだ合格していない"
    effect: >
      オープンキャンパスは受験前の見学。『もう入学が決まっている』ように
      描かない。受験という日常の圧力は第二幕全体の背景として機能し、
      非日常（諏訪組・災害）に踏み込む代償を重くする。みず葉の後の
      『普通に暮らそう』という願いにも受験・進学が含まれる。
  - id: PREM-02
    premise: "True Northの災害ボランティア実績は、遠隔地・抽象的にのみ語る"
    effect: >
      地元・水害・高齢者救援を予告しない。崖災害（SC10）での諏訪たちの
      登場を、不意打ちの衝撃を保ったまま、事後に納得できる形にするため。

# ==========================================================
# 舞台
# ==========================================================
locations:
  - id: EP03-LOC-01
    name: "正統館大学キャンパス"
    used_in: ["SC01", "SC02", "SC03"]
    properties: ["オープンキャンパスで開放", "敵のホームグラウンド", "日常的な進路見学の場"]
    note: "主人公側が無防備に敵地へ踏み込む静かな緊張"

  - id: EP03-LOC-02
    name: "六ッ川高校およびその周辺（横浜市想定）"
    used_in: ["SC04", "SC05", "SC06", "SC08"]
    properties: ["日常空間", "尾行・対話の舞台", "土砂災害の危険度が高い立地（明言しない）"]

  - id: EP03-LOC-03
    name: "地方厚生局オフィス"
    used_in: ["SC07"]
    properties: ["香取桃子が潜入して勤務", "魔法者ファイルの保管場所"]
    note: "情報提示が目的。短く映像的に処理する"

  - id: EP03-LOC-04
    name: "崖・高齢者介護施設周辺"
    used_in: ["SC08", "SC09", "SC10"]
    properties:
      - "崖上に住宅街、崖下に高齢者介護施設"
      - "大型台風の直撃で土砂災害が発生"
      - "第二幕前半のクライマックスの舞台"

# ==========================================================
# 装置
# ==========================================================
devices:
  - id: EP03-DEV-01
    name: "パッシブ感知（虹彩の明滅）"
    type: "magic_sign"
    purpose: "魔法者の探知・災害の予兆感知・伏線（真魚の種）を担う視覚装置"
    constraints:
      - "発動は不随意（本人の意思で制御不可）"
      - "一般人には気づかれない。魔法者のみ手掛かりにできる"
      - "本文では発動時に必ず描写する（作品の視覚文法）"
    ref: "WORLD_AND_RULE_CONFIG passive_visual_sign"

  - id: EP03-DEV-02
    name: "盗まれた魔法者ファイル"
    type: "information_object"
    purpose: "諏訪組の探知網の中核。隼太が『要注目』として浮かぶ根拠"
    constraints:
      - "香取が厚生局から窃取する"
      - "第二章の事件で隼太・真魚が既に記録に載っている前提"

  - id: EP03-DEV-03
    name: "限界団地訪問のYouTube動画"
    type: "information_object"
    purpose: "真魚が隔離施設を独力で探し当てる手段（次章EP04で本格使用）"
    constraints:
      - "国家機密が民間の隙間情報から漏れる（secrecy_model整合）"
    note: "EP03では伏線の下敷きのみ。実探索はEP04"

# ==========================================================
# 災害進行（崖の土砂災害）
# ==========================================================
hazard_progression:
  event: "その年最後の大型台風が関東を直撃"
  intent_level:
    initial: "自然災害（人為ではない純粋な天災）"
    escalation: "崖崩落 → 避難路の寸断 → 救援困難"
  stages:
    - id: EP03-HZ-01
      name: "予兆"
      description: "隼太が崖面の異変を感知する（範囲は大きい）"
      scene: "SC08"
      note: "隼太は感知するが『警察や消防が』と通り過ぎる＝受動性が見殺しの形をとる"
    - id: EP03-HZ-02
      name: "崩落"
      description: "崖が崩れ、道が土砂で埋まる"
      scene: "SC09"
    - id: EP03-HZ-03
      name: "二次崩落"
      description: "みず葉が乗り越えようとして、さらに土砂崩れ"
      scene: "SC09"
      primary_risks: ["みず葉の負傷・生き埋め"]
    - id: EP03-HZ-04
      name: "避難路の連続困難"
      description: "増水・地盤の緩み・倒木・危険な橋が避難を阻む"
      scene: "SC10"

# ==========================================================
# 救出制約（EP03の核心的な構造条件）
# ==========================================================
rescue_constraints:
  shunta_rule: >
    隼太が魔法を使うのは『大事なものを守る』時のみ（SC09でみず葉を守る）。
    EP03では隼太は自ら人々を救う側には回らない（目撃に留める）。
  suwa_rule: >
    諏訪たちは公然と魔法を使って人々を救う。遠慮しない。人前で堂々と。
    これがEP03のクライマックスであり、隼太の世界観を破壊する。
  critical_separation:
    principle: "『目撃』と『加担』を分ける"
    detail: >
      EP03で隼太は諏訪たちの救援を『目撃』するに留まる。隼太自身が
      公然と人々を救う『加担』はEP04へ繰り越す。EP03で加担させると早すぎる。
    warning: "本文生成時、SC10で隼太に人助けをさせないこと。彼は茫然と見ているだけ"
  mr02_compliance: >
    諏訪の魅力・勧誘はすべて言葉と行動（体験させること）で行う。
    魔法による説得・誘導は禁止（MR-02）。諏訪は心でなく状況を操る。

# ==========================================================
# 周回の種（共通ルートに仕込む伏線。EP03担当分）
# ==========================================================
foreshadow_seeds:
  note: "種2（団地での確信）はEP04で配置。EP03担当はSEED-1とSEED-3"
  seeds:
    - id: SEED-1
      name: "虹彩の明滅（種1）"
      placement: ["SC09（みず葉を守る時）", "事前補強：第一章・第二章"]
      surface_read: "隼太が魔法を使うサイン"
      rewatch_read: "真魚が父に見たのと同じ光。真魚が気づけたこと自体が伏線"
      rule: "説明は一切書かない。読者に『見せる』だけ"
    - id: SEED-3
      name: "真魚の予感（種3）"
      placement: ["SC08（台風の直前/最中）"]
      surface_read: "悪天候の不安、あるいは孤独"
      rewatch_read: "隼太が感知したのと同じ異変を、真魚も鈍く感じ取っていた"
      rule: "『天気が悪いから』と本人が説明し、忘れる。それだけ書く"

# ==========================================================
# 不変条件
# ==========================================================
invariants:
  - id: EP03-INV-01
    statement: "SC10で章を閉じる。隼太は『目撃』のみ。加担はEP04へ繰り越す"
  - id: EP03-INV-02
    statement: "諏訪の勝利で章が終わる。彼は誰も説得せず、正しさで隼太を追い詰める"
  - id: EP03-INV-03
    statement: "緊張曲線は収束させない。上昇したまま宙吊りで終わる"
  - id: EP03-INV-04
    statement: "周回の種（SEED-1, SEED-3）は説明を書かず、描写のみで置く"
  - id: EP03-INV-05
    statement: "全SCラストはクリフハンガー"

# ==========================================================
# 検証
# ==========================================================
validation:
  checklist:
    - "各SCのラストがクリフハンガーになっているか"
    - "SC04〜07が2ライン交互で進み、SC07で収束しているか"
    - "SC10で隼太が『加担』していないか（目撃のみか）"
    - "諏訪の救援がMR-02を犯していないか（魔法での説得をしていないか）"
    - "虹彩の種（SEED-1）と予感の種（SEED-3）が説明抜きで置かれているか"
    - "緊張曲線が収束せず上昇したまま終わっているか"
  tests: []
