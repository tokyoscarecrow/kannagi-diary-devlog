# ==========================================================
# EPISODE STRUCTURE DEFINITION
# Episode: EP04（第四章 / 第二幕・中盤）
# File: episodes/ep04_structure.yaml
# Version: 1.0
# Updated: 2026-10-16
# Status: DRAFT（作者承認待ち / GP-003）
#
# Purpose:
#   - EP04固有の舞台・装置・進行方式・魔法使用制約・周回の種を定義する
#   - EP03と異なり災害事件を持たない。代わりに「隔離施設の露見リスク」と
#     「隼太に迫る三方向の動き（明神・諏訪・真魚）」を構造条件として定義する
#   - ストーリー展開／台詞／心理／演出指示は規定しない（構造・制約のみ）
#   - 話数構成の正本は production/EP04_episode_breakdown_FINAL.md
# ==========================================================

episode:
  id: EP04
  title: "第四章（第二幕・中盤）"
  structure_version: 1.0
  status: draft
  act: "第二幕・中盤"
  episode_count: 10   # SC01〜SC10
  depends_on:
    - GLOBAL_CONFIG@0.1.0
    - PROJECT_MASTER_CONTEXT@1.0.0
    - WORLD_AND_RULE_CONFIG@1.1.1
    - Config@3.2
    - addressing_rules@1.0（2026-10-15更新：to_suwa＝諏訪さん）
    - kannnagi_chara_data.xlsx（日吉・熊野の正本）
    - ep03_structure@1.0
    - EP04_episode_breakdown_FINAL

scope:
  includes:
    - episode_premises
    - progression_structure
    - locations
    - devices
    - exposure_progression      # 隔離施設をめぐる露見リスク
    - magic_use_constraints     # 加担の取り下げを含む
    - exception_events          # speech_style 例外の定義
    - foreshadow_seeds          # 周回の種（SEED-2）
  excludes:
    - plot
    - dialogue
    - scene_breakdown           # 話数構成は EP04_episode_breakdown_FINAL
    - character_emotion_design

# ==========================================================
# 章全体の前提
# ==========================================================
episode_premises:
  - id: PREM-01
    premise: "EP03で隼太は『目撃』のみ。自ら人を救う『加担』は起きていない"
    effect: >
      EP04前半の『反芻』の対象は、諏訪たちの公然たる救援を見たこと、
      および大神みず葉を守るために自分が魔法を使ったこと。人々を救った
      実感は存在しない。EP03構成書の『EP04へ繰り越された内容』のうち
      『隼太が自ら魔法を使って人を救う』は取り下げ（作者決定 2026-10-16）。
  - id: PREM-02
    premise: "台風当夜のアメダスは荒天による大量誤検知で機能不全だった"
    effect: >
      当局は老人ホーム周辺の魔法使用を『怪情報』としてしか把握できない。
      隼太の魔法使用（みず葉の防衛）も確定できない。明神の疑惑（SC04）は
      この不確定性の上に成り立ち、確証を持たない訪問になる。
  - id: PREM-03
    premise: "EP03構成書の『以降の見通し』は全面失効。本ファイルと EP04_episode_breakdown_FINAL を正とする"
    effect: "旧案（香取の高校乗り込み・真魚の拘束・隼太が真魚を連れ帰る）は採用しない"
  - id: PREM-04
    premise: "隼太・みず葉は高校2年。受験生という日常の圧力は継続する（EP03 PREM-01継承）"

# ==========================================================
# 章全体の進行方式
# ==========================================================
progression_structure:
  cliffhanger_rule:
    statement: "全SCのラストはクリフハンガーで終わる（EP03継承）"
  convergence_on_shunta:
    statement: "前半（SC01〜SC05）は三方向の動きが隼太へ迫る構造"
    vectors:
      - "真魚：隔離施設の発見 → 隼太に『聞いて欲しい話』を持ち込む"
      - "明神（当局）：怪情報 → 疑惑での訪問"
      - "諏訪（True North）：香取の報告 → 隼太を加える時機の判断"
    note: "三者とも隼太の意思とは無関係に動く。隼太の受動性が包囲の形をとる"
  pov_policy:
    principle: "隼太の怒りの説得力を最優先する"
    fuel_scenes: ["SC02後半（制度の内側・明神視点）", "SC03（隔離施設の実物・真魚視点）"]
    eruption: "SC06は隼太一貫・内側から"
    validation: "SC08（第三者が『隼太は悪くない』と言う）"
  tension_curve:
    shape: "複数の山（降下 → SC06内的ピーク → 緩和 → 再上昇）"
    scores: "SC01(50) SC02(40) SC03(60) SC04(60) SC05(55→65) SC06(85) SC07(45→60) SC08(50→60) SC09(70) SC10(75)"
    peak: "SC06（85）＝恐怖と怒りの混成による内的頂点"
    ending: "SC10は収束させず上昇したまま次章へ（EP03と同じ宙吊り）"

# ==========================================================
# 舞台
# ==========================================================
locations:
  - id: EP04-LOC-01
    name: "限界団地（封鎖された一棟＝隔離施設）"
    used_in: ["SC01（動画上）", "SC03（実地）"]
    properties:
      - "居住者は老人と外国人ばかり。日常の生活空間に隔離施設が埋め込まれている（TP-004）"
      - "一棟だけ封鎖。『高圧注意』の表示"
      - "監視カメラと警備員による警備"
    note: "WORLD_AND_RULE_CONFIG isolation_facility の物理的実体。EP04では外観のみ。内部には入らない"
  - id: EP04-LOC-02
    name: "南関東厚生地方局オフィス"
    used_in: ["SC02"]
    properties: ["明神・日吉の勤務先", "香取桃子が潜入勤務中"]
  - id: EP04-LOC-03
    name: "True North 部室（正統館大学）"
    used_in: ["SC04"]
  - id: EP04-LOC-04
    name: "六ッ川高校およびその周辺"
    used_in: ["SC02", "SC04", "SC07"]
  - id: EP04-LOC-05
    name: "公園"
    used_in: ["SC05", "SC06"]
    properties: ["植え込みがあり、住吉が身を隠せる"]
    note: "ミッドポイントの舞台"
  - id: EP04-LOC-06
    name: "ファミレス／飯綱家"
    used_in: ["SC08"]
  - id: EP04-LOC-07
    name: "居酒屋（True North の飲み会会場）"
    used_in: ["SC09", "SC10"]
    properties: ["大人の参加者も混じる", "SNSに会場の画像が投稿されている"]

# ==========================================================
# 装置
# ==========================================================
devices:
  - id: EP04-DEV-01
    name: "限界団地訪問のYouTube動画"
    type: "information_object"
    purpose: "真魚が隔離施設を独力で特定する手段（EP03-DEV-03の本格使用）"
    constraints:
      - "国家機密が民間の隙間情報から漏れる（secrecy_model整合）"
      - "動画の投稿者は施設の正体を知らない"
  - id: EP04-DEV-02
    name: "真魚のタブレット"
    type: "trigger_object"
    purpose: "SC05末〜SC06で隼太のトラウマ記憶を起動する"
    constraints:
      - "映像は封鎖団地の外観のみ。内部映像は存在しない"
  - id: EP04-DEV-03
    name: "アメダス検知システム（説明）"
    type: "world_mechanism"
    purpose: "SC02で制度の内側から説明。荒天下の誤検知を明示する"
    constraints:
      - "説明は明神と日吉の業務会話の中で行う（説明台詞の禁止を守る）"
      - "隼太には極秘。隼太視点では知らない情報として扱う"
    ref: "WORLD_AND_RULE_CONFIG detection_system_amedas"
  - id: EP04-DEV-04
    name: "香取桃子の傍受"
    type: "information_leak"
    purpose: "厚生局の動きが諏訪側へ流れる経路を示す"
    constraints: ["短く差し込む（SC02末）", "香取の忠誠の向きは示さない"]
  - id: EP04-DEV-05
    name: "SNS画像とAI分析"
    type: "information_object"
    purpose: "みず葉と真魚が飲み会会場を特定する手段（SC09）"
    constraints: ["現実に可能な範囲の分析に留める（realism_level）"]
  - id: EP04-DEV-06
    name: "盗まれた魔法者ファイル（EP03-DEV-02）"
    type: "information_object"
    purpose: "香取が真魚の父の名と真魚の素性を知っている根拠（SC10）"

# ==========================================================
# 露見リスクの進行（EP04に災害事件はない）
# ==========================================================
exposure_progression:
  note: "EP03の hazard_progression に相当。物理的危機でなく、情報と監視の網が狭まる段階"
  stages:
    - id: EP04-EX-01
      name: "当局の不確定な把握"
      scene: "SC02"
      description: "老人ホーム周辺の怪情報。アメダスは機能不全で確証がない"
    - id: EP04-EX-02
      name: "真魚の接近と発見"
      scene: "SC03"
      description: "真魚が監視カメラに映り、警備員が来る。真魚は走り去る"
      primary_risks: ["真魚の身元特定（当局側に記録が残りうる）"]
      note: "記録が残ったか否かは本章では確定させない（withheld）"
    - id: EP04-EX-03
      name: "隼太への疑惑"
      scene: "SC04"
      description: "明神が疑惑で訪問。同時に諏訪側が隼太を加える時機と判断"
    - id: EP04-EX-04
      name: "真魚への接触"
      scene: "SC10"
      description: "香取が父の名で真魚に接触。逸脱組織と真魚が結節する（TH-01）"

# ==========================================================
# 魔法使用制約
# ==========================================================
magic_use_constraints:
  shunta_rule: >
    EP04で隼太はアクティブ魔法を使わない。加担（公然と他人を救う）は
    取り下げ。パッシブ感知は不随意に作動しうる（SC09の飲み会で鳴り続ける）。
  suwa_rule: >
    SC09の勧誘は言葉のみで行う（MR-02）。諏訪はEP03で見せた事実と
    自分の生き方を示すだけで、魔法で心を動かさない。
  minor_drinking: >
    隼太は未成年。SC09で香取が酒を勧め、諏訪が止める。隼太が飲酒する
    描写はしない。
  iris_rendering:
    status: needs_review
    issue: >
      虹彩の明滅を描写する条件について、作品裁定（アクティブ使用時）と
      Config v3.1 passive_sign（パッシブ発動時）が未整合。SC09の
      『感知が鳴り続ける』描写はこの裁定に依存する。

# ==========================================================
# speech_style 例外イベント（Config notes：例外は必ずイベントとして定義）
# ==========================================================
exception_events:
  - id: EXC-SHUNTA-01
    character: izuna_shunta
    scene: "SC06"
    suspended_rules: ["感情を強く出さない", "感情的な長台詞の禁止"]
    scope: "パニック発作から回復した直後の怒りの発露。この場面に限る"
    constraints:
      - "設計意図（受動性は怒りの封印だった等）を地の文で説明しない"
      - "発露後は通常の speech_style に戻る。以後の基調を変えない"
  - id: NON-EXC-01
    note: "SC06の真魚は敬語を維持する（『飯綱くんは悪くありません』）。真魚の敬語崩れ例外はEP04では発動しない"
  - id: NON-EXC-02
    note: >
      明神（SC04の動揺）・住吉（SC06の驚愕・SC08の疎外感）の反応は
      普通の人間の自然な反応であり、例外イベントとして扱わない。
      キャラクターの性格・ストーリー設定を拘束しない（作者決定 2026-10-16）。

# ==========================================================
# 周回の種（EP04担当分）
# ==========================================================
foreshadow_seeds:
  seeds:
    - id: SEED-2
      name: "団地での確信（種2）"
      placement: ["SC01（下地：動画の一棟から目が離せない）", "SC03（実地：ここに父がいると確信する）"]
      surface_read: "執念と、みず葉から聞いた話（古い団地・一人一部屋）との一致による確信"
      rewatch_read: "真魚は施設の魔法者の存在を鈍く感じ取っていた（TH-06 / latent ARMED）"
      rule: >
        説明は一切書かない。表層の推理だけで確信が成立するように、
        手がかり（封鎖された一棟・高圧注意・警備の厳重さ）を必ず置く。
        種は推理の補強であり、推理の代わりにしない（PMC：偶然でなく情報構造で成立）。

# ==========================================================
# 不変条件
# ==========================================================
invariants:
  - id: EP04-INV-01
    statement: "EP04で隼太は加担しない。アクティブ魔法を使わない"
  - id: EP04-INV-02
    statement: "SC06の怒りは隼太の内側から体験させる。設計意図を地の文で説明しない"
  - id: EP04-INV-03
    statement: "隔離施設は外観のみ。内部・収容者の現在の姿は見せない（隼太の記憶内を除く）"
  - id: EP04-INV-04
    statement: "諏訪の勧誘は言葉のみ（MR-02）。香取の忠誠の向きは示さない"
  - id: EP04-INV-05
    statement: "SC10は真魚の恐怖で閉じ、収束させない"
  - id: EP04-INV-06
    statement: "全SCラストはクリフハンガー"

# ==========================================================
# 未確定・保留（作者判断待ち）
# ==========================================================
open_items:
  - id: OI-01
    item: "SC01で真魚ラインと隼太ラインを並行させるか、SC01=真魚／SC02=隼太と分けるか"
  - id: OI-02
    item: "SC04・SC09で諏訪側の不在シーンをどこまで見せるか"
  - id: OI-03
    item: "住吉の疎外感（SC06・SC08）を第三幕の火種としてどこまで仕込むか"
  - id: OI-04
    item: "真魚の父『氷川総一郎』の設定と、事件の開示方法（後日設定）"
  - id: OI-05
    item: "SC07の隼太『全部自分の魔法のせい』の扱い（SC07作業時に再検討）"
  - id: OI-06
    item: "SC04で明神が隠す『何か』の中身。未定義のまま本文化しない（IM-ST-005）"
  - id: OI-07
    item: "虹彩描写の条件（magic_use_constraints.iris_rendering 参照）"

# ==========================================================
# 正典側の追従タスク（本ファイル承認後）
# ==========================================================
canon_followups:
  - "EP03_SC09.yaml：EP04への繰り越し記述から『隼太が自ら魔法を使って人を救う』を削除"
  - "EP03_episode_breakdown_FINAL.md：『EP04へ繰り越された内容』『以降の見通し』に失効注記"
  - "Config v3.1：gov_boss_TBN→日吉拓哉（統括官）、gov_sub_TBN→熊野修造（課長）"
  - "Config v3.1：熊野の speech_style 例『係長』を役職に合わせて修正"
  - "GOVERNMENT_RESPONSE_actII.yaml：boss/subordinate の name を記入"
  - "kannnagi_chara_data.xlsx：『みずは』表記を『みず葉』へ（裁定に合わせる場合）"
  - "proper_noun_registry：日吉拓哉・熊野修造を登録"

# ==========================================================
# 検証
# ==========================================================
validation:
  checklist:
    - "隼太がアクティブ魔法を使っていないか、他人を救っていないか"
    - "前半の『反芻』が目撃とみず葉防衛に限られているか（PREM-01）"
    - "SEED-2の確信が、表層の手がかりだけで論理的に成立しているか"
    - "SC06の怒りが説明でなく体験として書かれているか"
    - "アメダスの説明が説明台詞になっていないか"
    - "諏訪の勧誘がMR-02を犯していないか"
    - "香取の忠誠の向きが示されていないか"
    - "緊張曲線がSC06を頂点に波打ち、SC10で上昇したまま終わっているか"
  tests: []
