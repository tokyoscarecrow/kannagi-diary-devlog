scene:
  id: "EP01_SC01"
  chapter: 1
  seq: 1
  title: "調査報告第1005428（改訂）"
  date: "9月上旬・二学期開始直後"
  setting: "南関東厚生局 特種能力者管理課・事務室"

  characters:
    - name: "明神明"
      role: "魔法者監視担当官"
    - name: "飯綱隼太"
      role: "監視対象の魔法者（間接的登場）"

  goals:
    protagonist: "読者に『魔法者』という存在の社会的位置づけを理解させる"
    antagonist: "魔法という制御不能なリスクそのもの"
    scene_question: "この物語は『魔法を使う話』ではないと理解できるか？"

  conflict: "能力を持つこと自体が社会的リスクであり、使わないことが最善とされる矛盾"

  emotional_phase: "静寂 → 理解 → 微かな不穏"

  tone_continuity:
    establish:
      - "管理社会の冷静さ"
      - "日常の裏にある監視"
      - "静かな不安の芽"
    next_scene_target:
      - "平穏な日常が実は脆いことを示す"

  world_rule_reminder:
    - "魔法者は国家管理対象である"
    - "魔法使用は原則禁止"
    - "発覚時は社会的隔離処分"
    - "未使用状態が最良とされる"

  beats:
    - id: "B1"
      goal: "報告書形式による世界観提示"
      action: "定期監視報告を確認する"
    - id: "B2"
      goal: "魔法者の社会的位置づけを示す"
      action: "管理・隔離・未使用が最善であることを示唆"
    - id: "B3"
      goal: "主人公の特異性のなさを強調"
      action: "『特記事項なし』という評価を示す"
    - id: "B4"
      goal: "今後の不穏を予告する"
      action: "明神の違和感を残して締める"

  overrides:
    style_guide:
      narrative_temperature: "low"
      exposition_density: "medium"
    reveal_policy:
      level: "部分開示"
      notes:
        - "魔法の具体的能力はまだ明かさない"

  output_format: "narrative prose + limited inner monologue"
  target_length: "1200?1500字（冒頭として十分な物語量）"

meta:
  status: "revised"
  notes: "SC01は世界観理解とジャンル予告を最優先。活躍・事件は描かない。"


