scene:
  id: "EP01_SC07"
  episode: "EP01"
  title: "確かめる理由"
  time: "同日 放課後〜夜"
  location: ["校内（放課後の教室・廊下）", "校外（帰路）"]
  pov:
    primary: "氷川真魚"
    secondary: ["飯綱隼太（間接）"]
  tone: "静的・冷却・内圧上昇"

  purpose:
    narrative:
      - "真魚が計画の実行段階に入ったことを確定させる"
      - "隼太の性格的弱点を、住吉を介して示す"
      - "みず葉が囮として成立する理由を明確化する"
    reader_experience:
      - "『隼太は使ってしまう』という納得を与える"
      - "真魚が戻れない地点に立ったことを示す"

  characters:
    active:
      - name: "氷川真魚"
        role: "観測者／計画者"
      - name: "飯綱隼太"
        role: "観測対象（住吉を介した描写）"
      - name: "住吉奨太郎"
        role: "隼太の性格を浮かび上がらせる媒介"
    passive:
      - name: "大神みず葉"
        role: "真魚の視察対象（会話最小）"

  beats:
    - id: "B1"
      label: "日常の強度"
      - description: "放課後、住吉との軽口から隼太の『断れなさ』『守る側に回る性質』を示す"
　　　+ description: "放課後、住吉の打算的な動機を含む会話を通じて、隼太の『断れなさ』『守る側に回る性質』を具体的に示す"


    - id: "B2"
      label: "視察"
     - description: "真魚がみず葉を観察し、隼太との距離感・立ち位置を静かに確認する"
　　 + description: "真魚がみず葉と隼太の身体距離・無意識の配置を観察し、『守る側／守られる側』の関係が完成していると判断する"


    - id: "B3"
      label: "条件確認"
      description: "真魚が隼太の反応を思考上で整理し、『使う人間の条件』を満たしていると判断する"

    - id: "B4"
      label: "父の一行"
      description: "父は魔法を使い、守られなかったという事実のみを提示する（詳細伏せ）"

    - id: "B5"
      label: "自己暗示"
      description: "迷いを抱えたまま『これは正しいはずだ』と自分に言い聞かせ、実行フェーズへ向かう"

  reveal_policy:
    show:
      - "真魚が計画を持っていること"
      - "父と魔法、制度への不信"
    hide:
      - "具体的な罠の内容"
      - "計画の安全装置"
      - "明神の存在"

  emotion_curve:
    start: "日常・軽さ"
    middle: "緊張・観測"
  - end: "自己暗示・不可逆感"
  + end: "自己暗示・不可逆感（決意ではない）"

  notes:
+   - "隼太は住吉との会話を通じて性格を間接描写する"
+   - "住吉は隼太の『断れなさ』『守る側の性質』を引き出す役割"
+   - "みず葉は会話主体にせず、行動と距離感のみで関係性を示す"
+   - "真魚は決意ではなく自己暗示によって行動を正当化している"

