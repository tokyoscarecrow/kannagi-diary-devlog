scene:
  id: "EP01_SC04"
  episode: "EP01"
  order: 4
  date: "9月上旬・二学期初日"
  time: "午前（HR〜1時間目）"
  location: "教室"
  weather: "晴れ"

  title: "転校生"

  viewpoint:
    character: "飯綱隼太"
    mode: "三人称近接"

  purpose:
    narrative:
      - "氷川真魚を正式に物語へ登場させる"
      - "クラス内での距離感・孤立を描写する"
      - "『何か違う』という不穏さを具体描写で印象づける"
    character:
      - "隼太とみずはに違和感を与えるが、直感や超常では説明しない"

  characters:
    present:
      - "飯綱隼太"
      - "大神みずは"
      - "氷川真魚"
      - "住吉奨太郎"
      - "担任教師"
    focus:
      - "氷川真魚"

  core_conflict:
    description: >
      転校生として紹介された真魚は礼儀正しく整っているが、
      その態度や所作が周囲との距離を強く意識させ、教室に微妙な緊張を生む。

  beats:
    - id: "B1"
      description: "担任による転校生紹介。形式的で簡潔。"
    - id: "B2"
      description: >
        真魚の自己紹介。言葉遣い・姿勢・視線などが過剰に整っており、
        クラスの空気と噛み合わない。
    - id: "B3"
      description: >
        クラスの反応（ざわめき・視線・小声）。
        真魚はそれらに一切反応しない。
    - id: "B4"
      description: >
        隼太とみずはが真魚を観察。
        不安や予感ではなく、具体的な所作の違和感として描写する。
    - id: "B5"
      description: >
        真魚が教室の隅の席に着き、孤立した構図でシーンを閉じる。

  tone:
    keywords: ["日常", "静かな違和感", "不穏"]
    intensity: 0.35

  foreshadowing:
    explicit:
      - "真魚の距離感・規律性"
    implicit:
      - "後に隼太へ接近する理由が『偶然ではない』と感じさせる"

  notes:
    - "この段階では真魚の内面・目的は一切明かさない"
    - "直感・虫の知らせ等の表現は禁止"
    - "見た目・言葉尻・所持品など具体描写で不穏さを出す"
