scene:
  id: "EP01_SC05"
  episode: "EP01"
  order: 5
  date: "9月上旬・二学期初日"
  time: "放課後"
  location: "教室"
  weather: "晴れ"

  title: "係"

  viewpoint:
    character: "飯綱隼太"
    mode: "三人称近接"

  purpose:
    narrative:
      - "氷川真魚が隼太に能動的に接近する"
      - "『理由は自然だが、意図は不明』な行動を描く"
      - "みずはを自然に会話へ介入させ、三角関係の種をまく"
    character:
      - "隼太が『選ばれた』感覚を抱くが、説明は与えない"

  characters:
    present:
      - "飯綱隼太"
      - "氷川真魚"
      - "大神みずは"
    focus:
      - "氷川真魚"

  core_conflict:
    description: >
      係決めという日常的な行為を通じて、
      真魚は隼太にだけ話しかけ、選択を誘導する。
      行動は合理的だが、なぜ隼太なのかは説明されない。

  beats:
    - id: "B1"
      description: >
        放課後の教室。係が未決定のまま残っている状況。
    - id: "B2"
      description: >
        真魚が隼太に声をかける。
        確認・提案という形式で距離を保った会話。
    - id: "B3"
      description: >
        真魚が「保健係」を提示。
        隼太がそれを受け入れる。
    - id: "B4"
      description: >
        みずはが自然に割り込み、短いやり取り。
        空気がわずかに変わる。
    - id: "B5"
      description: >
        真魚が理由を述べず立ち去る。
        隼太の中に小さな引っかかりが残る。

  tone:
    keywords: ["静かな緊張", "違和感", "日常に混ざる異物"]
    intensity: 0.45

  location_usage:
    linked_location:
      - "保健室"
    note: "このシーンでは登場しないが、『保健係』設定として接続"

  foreshadowing:
    explicit:
      - "真魚が意図的に隼太を選んだ可能性"
    implicit:
      - "保健室が今後、感情や秘密の受け皿になる"

  notes:
    - "真魚は知識優位に立たない（確認する側に徹する）"
    - "みずはは詮索しないが、違和感は残す"
    - "この段階では魔法・告白・陰謀に触れない"
