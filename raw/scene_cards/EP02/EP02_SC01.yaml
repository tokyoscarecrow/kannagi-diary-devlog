  scene:
    - scene_id: "SC01"
      title: "学園祭準備 ― 日常と水槽"
      time:
        relative: "学園祭前日"
        part_of_day: "放課後"
      location:
        primary: "六ッ川高校・体育館"
        secondary: "旧校舎地下・雨水槽エリア（ホラーハウス最終エリア）"
      participants:
        - "飯縄隼太"
        - "住吉"
        - "大神みずは"
        - "氷川真魚"
        - "藤崎"
        - "クラスメイト複数"
      purpose:
        story_role:
          - "学園祭の賑わいと日常感を提示する"
          - "旧校舎地下の雨水槽エリアを自然に導入する"
          - "ロッカー、流入配管、地下環境を後半の危機の伏線として置く"
          - "隼太の『魔法を使えば早い』誘惑を軽く見せる"
          - "真魚の存在感と距離感を提示する"
        emotional_role:
          - "にぎやかで温かい日常"
          - "その下にあるわずかな冷たさ・違和感"
      beats:
        - order: 1
          summary: "体育館で学園祭準備が進み、住吉が実行委員として張り切っている。"
        - order: 2
          summary: "住吉が『美人の実行委員長に近づきたい』動機で頑張っており、実際に距離が縮まっていることが会話で示される。"
        - order: 3
          summary: "隼太は資材の歪みを見て、一瞬だけ魔法で直せると考えるが、使わず工具で対処する。"
        - order: 4
          summary: "旧校舎地下へ向かうと、普段は立入禁止だが学園祭当日は関係者のみ立入可になっていることが示される。"
        - order: 5
          summary: "地下ではクラスメイトたちがホラーハウス最終エリアの準備をしており、演出担当の藤崎がみずはをロッカー役に配置する。"
        - order: 6
          summary: "巨大な雨水槽内部、古いロッカー、管理用通路の扉、天井の流入配管が自然に描写される。"
        - order: 7
          summary: "ロッカーの蝶番が少し引っかかるが、大した問題とは扱われず、その場は笑いで流される。"
        - order: 8
          summary: "真魚が『地下は少し冷えますね』『湿気もありますし、足元、気をつけてください』と敬語で話し、配管に一瞬だけ視線を向ける。"
        - order: 9
          summary: "住吉に呼ばれた隼太が地下を出て、にぎやかな地上へ戻る。地下の冷たさだけが靴裏に残る。"
      key_information_revealed:
        - "旧校舎地下の雨水槽エリアがホラーハウス最終エリアとして使われている"
        - "みずははロッカーに入る驚かせ役を担当する"
        - "流入配管と古い設備が残っている"
        - "真魚は場の中でわずかに浮いており、配管に注意を向けている"
      withheld_information:
        - "真魚が後にこの設備を利用すること"
        - "ロッカーの外開き構造が生命危機につながること"
        - "老朽化が致命的な誤算を生むこと"
      tension:
        level: "Low"
        score: 20
      tone:
        - "にぎやか"
        - "日常的"
        - "軽い違和感"
      foreshadowing:
        - "立入禁止だった地下が学園祭で特別解放されている"
        - "古い流入配管"
        - "ロッカーの蝶番の引っかかり"
        - "地下の冷たさ"
      character_notes:
        hayata:
          - "魔法を使えば早いと考えるが、使わない"
          - "面倒でも普通のやり方を選ぶ"
        sumiyoshi:
          - "実行委員として積極的"
          - "美人の実行委員長に近づく動機で張り切っている"
        mizuha:
          - "クラスの流れの中で自然にロッカー役を引き受ける"
        mayo:
          - "誰に対しても敬語"
          - "周囲から少し距離がある"
          - "配管へ視線を送るが、まだ不穏さは表に出さない"

