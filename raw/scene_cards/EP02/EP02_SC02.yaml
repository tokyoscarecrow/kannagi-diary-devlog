  scene:
    - scene_id: "SC02"
      title: "監視官と休日の約束"
      time:
        relative: "翌朝〜土曜日の昼休み"
      location:
        primary: "六ッ川高校・校門前"
        secondary: "六ッ川高校・廊下"
      participants:
        - "飯縄隼太"
        - "明神明"
        - "氷川真魚"
        - "大神みずは"
        - "住吉"
      purpose:
        story_role:
          - "明神と隼太の既存関係を提示する"
          - "真魚に対して当局が警戒していることを示す"
          - "真魚の『自分も魔法者』発言を隼太が明神へ打ち明ける"
          - "日曜日の水族館行きの流れを作る"
          - "みずはと真魚の対立を表面化させる"
        emotional_role:
          - "コミカルな監視関係"
          - "軽妙な三角関係的緊張"
      beats:
        - order: 1
          summary: "校門前で隼太が、監視担当官である明神明と顔を合わせる。"
        - order: 2
          summary: "隼太が『下から読んでも明神明』といつもの軽口を叩き、二人の関係が既知でコミカルであることが示される。"
        - order: 3
          summary: "明神は氷川真魚について接触状況を確認し、距離を置くよう助言する。"
        - order: 4
          summary: "隼太は、真魚が『自分も魔法者だ』と告白したことを明神に伝える。"
        - order: 5
          summary: "明神はわずかに反応するが、『特定秘密保護法』を理由に何も答えない。"
        - order: 6
          summary: "昼休み、廊下で真魚が隼太を日曜日に誘う。"
        - order: 7
          summary: "真魚は『少し、確かめてみたいことがあります』とだけ言い、意図を曖昧にしたまま押す。"
        - order: 8
          summary: "みずはが割って入り、『日曜はわたしと約束があるの！』と強く主張する。"
        - order: 9
          summary: "隼太は約束した覚えがないと言い、真魚も『飯縄君も約束した覚えはないと言っています』と引かない。"
        - order: 10
          summary: "住吉が通りかかって茶化し、『本妻と愛人のケンカか？』と煽る。"
        - order: 11
          summary: "みずはも真魚も引かず、このままでは揉めると判断した隼太が収拾策を考える。"
        - order: 12
          summary: "どちらかを選べば必ず拗れると考えた隼太は、『じゃあ四人で行けばいいだろ』と提案する。"
        - order: 13
          summary: "住吉は巻き込まれるが、真魚は了承し、みずはも不満を残しつつ受け入れる。"
        - order: 14
          summary: "こうして四人で日曜日に出かけることが決まる。"
      key_information_revealed:
        - "明神明は隼太の監視担当官であり、定期面接を行う関係"
        - "明神は真魚に警戒感を持っている"
        - "真魚の『自分も魔法者』発言は隼太しか知らなかったが、ここで明神に共有される"
        - "真魚は引かず、みずはも引かないため、隼太が調停役になる"
        - "日曜日の外出が四人で行われることになる"
      withheld_information:
        - "明神が真魚の発言をどう受け取ったかの本音"
        - "真魚が隼太を『確かめる』具体的理由"
        - "真魚がみずはを利用する発想に至ること"
      tension:
        level: "Low-Mid"
        score: 35
      tone:
        - "コミカル"
        - "軽い緊張"
        - "不穏さを含む日常"
      foreshadowing:
        - "明神の助言"
        - "真魚の『確かめてみたいこと』"
        - "みずはと真魚の対立"
      character_notes:
        hayata:
          - "明神には軽口で接する"
          - "面倒を嫌い、対立を収めるために四人行動を提案する"
        myojin:
          - "監視者だが、やり取りは乾いたコミカルさを持つ"
          - "情報は持っているが語らない"
        mayo:
          - "常に敬語"
          - "この段階では強引に押す"
          - "『確かめる』という目的意識を隠しきれていない"
        mizuha:
          - "衝動的に割り込み、強く隼太を確保しようとする"
        sumiyoshi:
          - "茶化して場をかき回す"
          - "結果的に四人行動へ巻き込まれる"
