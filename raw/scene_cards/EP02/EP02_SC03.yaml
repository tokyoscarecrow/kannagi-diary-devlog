  scenes:
    - scene_id: "SC03"
      title: "水族館（前半）"
      time:
        relative: "日曜日"
        part_of_day: "朝〜昼前"
      location:
        primary: "駅前"
        secondary: "電車内"
        tertiary: "水族館・館内前半エリア"
      participants:
        - "飯縄隼太"
        - "大神みずは"
        - "氷川真魚"
        - "住吉"
      purpose:
        story_role:
          - "四人で出かける普通の高校生らしい時間を描く"
          - "隼太・みずは・真魚・住吉の関係性を見せる"
          - "真魚が隼太にとってのみずはの重要性を観察し始める"
          - "『水』をモチーフとして強く印象づける"
          - "真魚が『みずはを利用するべき』という判断に至る入口を作る"
        emotional_role:
          - "明るい休日"
          - "水の美しさの中にある静かな怖さ"
      beats:
        - order: 1
          summary: "日曜の朝、駅前で四人が集合する。隼太は眠そうで、みずははそれを小言まじりに見る。"
        - order: 2
          summary: "住吉が遅れて現れ、軽口の応酬があり、四人の普通の高校生らしい空気が出る。"
        - order: 3
          summary: "真魚が合流し、四人で電車に乗る。"
        - order: 4
          summary: "電車内で隼太とみずはの自然なやり取りがあり、真魚はその距離感を観察する。"
        - order: 5
          summary: "真魚は、隼太を追い詰めるにはみずはの存在を利用すべきだと判断する。ただし、方法まではまだ思いつかない。"
        - order: 6
          summary: "水族館に到着し、四人は館内へ入る。"
        - order: 7
          summary: "青い光と冷えた空気、小さな魚の群れなど、水族館前半の展示が描かれる。"
        - order: 8
          summary: "真魚は魚よりも『水』そのものを見ており、『水がきれいだと思いまして』と答える。"
        - order: 9
          summary: "四人は海底トンネル型の大水槽へ進む。"
        - order: 10
          summary: "みずはが隼太の腕を引き、二人の親しさが自然に描かれる。"
        - order: 11
          summary: "その少し後ろで、真魚は頭上の巨大な水槽を見上げ、『なぜか少しだけ怖い』と感じる。"
      key_information_revealed:
        - "四人の関係はまだ普通の高校生の外出として成立している"
        - "真魚は隼太とみずはの距離の近さを観察している"
        - "真魚は『みずはを利用するべき』という発想に至り始めている"
        - "真魚は魚より水を見ている"
      withheld_information:
        - "真魚が最終的にどんな方法を取るか"
        - "水への注目が後の罠へつながること"
      tension:
        level: "Mid"
        score: 50
      tone:
        - "明るい"
        - "普通の高校生らしい"
        - "静かな不穏"
      foreshadowing:
        - "真魚は隼太の弱点としてみずはを認識する"
        - "水そのものを見る真魚の視線"
        - "巨大水槽に対する『少し怖い』感覚"
      character_notes:
        hayata:
          - "自然体で、みずはとも住吉とも軽口を交わす"
        mizuha:
          - "隼太に自然に近く、無意識に距離が近い"
        mayo:
          - "常に敬語"
          - "表面上は穏やかだが、内面では観察と判断を進めている"
          - "まだ罠の方法までは思いついていない"
        sumiyoshi:
          - "終始にぎやかし役"
          - "場を軽くする役割を担う"