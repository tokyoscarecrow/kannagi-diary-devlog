scene_id: "SC04"
title: "水族館（後半）"
time:
  relative: "日曜日"
  part_of_day: "昼〜夕方 / 夜（みず葉自室）"
location:
  primary: "水族館・後半エリア（ベンチ / クラゲ展示付近）"
  secondary: "大神みず葉自室"
participants:
  - "飯縄隼太"
  - "大神みず葉"
  - "氷川真魚"
  - "住吉"

purpose:
  story_role:
    - "真魚の内面（喪失と断絶）を描く"
    - "みず葉の決意（告白）を生む外的トリガーを発生させる"
    - "四人の関係に微細なズレを発生させる"
  emotional_role:
    - "静かな余韻の中に不安と断絶を混ぜる"
    - "表面は日常、内面は変化という二層構造を作る"

structure:
  phases:
    - phase: "静"
      description: "水族館後半、観客が減り静かな空間。四人でベンチに座る。"
    - phase: "記憶（真魚）"
      description: "家族連れを見て、父との記憶と現在の断絶を想起する。"
    - phase: "出来事（トリガー）"
      description: "みず葉と住吉が先行し、隼太と真魚が一時的に二人になる。"
    - phase: "誤認（みず葉）"
      description: "みず葉が振り返り、近距離で会話する二人を目撃し、違和感と拒否感を覚える。"
    - phase: "余韻"
      description: "四人は何事もなかったように行動を続けるが、みず葉の内面に違和感が残る。"
    - phase: "決意（夜）"
      description: "自室でみず葉が告白を決意する。"

beats:
  - order: 1
    summary: "人の少ない展示エリアで四人がベンチに座り、静かな時間が流れる。"
  - order: 2
    summary: "家族連れ（父・母・子）を見て、真魚が父との記憶を思い出す。"
  - order: 3
    summary: "父が連れ去られ戻らない現実と、母との断絶が示される。"
  - order: 4
    summary: "『あの側には戻れない』という認識が真魚の中で確定する。"
  - order: 5
    summary: "住吉とみず葉が先に進み、隼太と真魚が遅れて二人になる。"
  - order: 6
    summary: "真魚が隼太に『信じていますか』と踏み込んだ問いをする。"
  - order: 7
    summary: "短時間だが距離の近い状態で二人が向き合う。"
  - order: 8
    summary: "みず葉が振り返り、その光景を目撃する。会話は聞こえないが距離だけが見える。"
  - order: 9
    summary: "みず葉が理由の説明できない違和感と拒否感を抱く。"
  - order: 10
    summary: "四人は合流し、そのまま水族館を回り終える（表面上は何も起きていない）。"
  - order: 11
    summary: "夜、みず葉が自室で『取られる』という危機感から告白を決意する。"

key_information_revealed:
  - "真魚は父との記憶を強く保持している"
  - "父は連れ去られ戻らない存在である"
  - "母との関係は断絶している"
  - "みず葉は隼太に対して独占的な感情を持ち始めている"
  - "みず葉の行動（告白）は外的出来事によって引き起こされる"

withheld_information:
  - "真魚がこの後どのような手段を取るか"
  - "この距離イベントが罠の発想にどうつながるか"
  - "明神の意図や介入の範囲"

tension:
  level: "Mid"
  score: 60

tone:
  - "静か"
  - "内省的"
  - "潜在的な不安"
  - "日常の裏の変化"

foreshadowing:
  - "『手を伸ばしても届かない』というガラス越しの隔たり（＝後の閉じ込め構造の象徴）"
  - "真魚の距離の詰め方（無自覚な境界侵犯）"
  - "みず葉の違和感（後の対立の起点）"

character_notes:
  hayata:
    - "フラットな反応を維持"
    - "真魚の問いにも断定せず曖昧に返す"
  mizuha:
    - "視覚情報のみで強く感情が動く"
    - "違和感→危機感→決意の流れが成立"
  mayo:
    - "敬語を維持したまま踏み込む"
    - "内面では喪失と断絶を抱えている"
    - "この段階ではまだ戦略的思考は表に出さない"
  sumiyoshi:
    - "場を動かす役割（先行することで二人の状況を作る）"