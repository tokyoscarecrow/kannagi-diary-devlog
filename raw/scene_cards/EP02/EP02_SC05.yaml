scene_id: "EP02_SC05"
title: "決意"
time:
  relative: "学園祭前日（月曜 放課後）"
location:
  primary: "六ッ川高校 校舎内（廊下）"
  secondary: "旧校舎 地下（ホラーハウス最終エリア／雨水槽）"
participants:
  - "氷川真魚"
  - "クラスメイト（会話のみ・名前なし）"

purpose:
  story_role:
    - "真魚の行動決定（決意）を明確にする"
    - "罠の構造（ロッカー＋水）を読者に理解させる"
    - "文化祭環境を利用した犯行成立条件を提示する"
  emotional_role:
    - "観察者から実行者への転換点"
    - "静かな決意と冷たい合理性の提示"

structure:
  phases:
    - phase: "外部刺激"
      description: "クラスメイトの会話（ロッカー・地下）をきっかけに思考が起動する"
    - phase: "接続"
      description: "水族館の水の記憶と、地下設備（ロッカー・配管）が結びつく"
    - phase: "構造理解"
      description: "閉じ込め＋水流入で逃げ場を奪う構造を把握する"
    - phase: "対象選定"
      description: "みずはを利用対象として確定する"
    - phase: "決意"
      description: "手段を選ばず実行する意思を固める"
    - phase: "準備"
      description: "地下でロッカーと配管を確認し、実行可能性を検証する"

beats:
  - order: 1
    summary: "放課後、学園祭準備中の廊下で『ロッカー』『地下』に関する会話を耳にする"
  - order: 2
    summary: "旧校舎地下の構造（外開きロッカー、配管）を想起する"
  - order: 3
    summary: "水族館での体験（水・閉鎖空間）が地下環境と結びつく"
  - order: 4
    summary: "ロッカーに閉じ込め、水を流入させることで逃げ場を奪う構造を理解する"
  - order: 5
    summary: "みずはなら必ず強く反応し、隼太を動かせると判断する"
  - order: 6
    summary: "隼太はみずはのためなら行動するという確信に至る"
  - order: 7
    summary: "実行を決意する（躊躇の排除）"
  - order: 8
    summary: "旧校舎地下に移動し、ロッカーの構造（閉じると開かない）を確認する"
  - order: 9
    summary: "配管・バルブ位置を視認し、操作可能性を把握する"
  - order: 10
    summary: "文化祭当日の管理の甘さを前提に、誘導・実行が可能であると判断する"
  - order: 11
    summary: "準備完了としてその場を離れる"

key_information_revealed:
  - "ホラーハウス最終エリアのロッカーは外開きで内側から開けられない"
  - "地下には水を流入させる配管とバルブが存在する"
  - "文化祭当日は管理が緩くなり、設備操作や誘導が可能になる"
  - "真魚はみずはをトリガーとして隼太を動かす計画を立てる"

withheld_information:
  - "具体的な誘導方法（どのようにみずはを呼び出すか）"
  - "水量・タイミングなどの詳細な実行手順"
  - "明神の介入可能性"

tension:
  level: "Mid-High"
  score: 70

tone:
  - "静的"
  - "冷徹"
  - "決定的転換"

foreshadowing:
  - "閉鎖空間（ロッカー）による拘束"
  - "水の流入による生命危機"
  - "みずはを媒介に隼太を動かす構造"

character_notes:
  mayo:
    - "敬語キャラクターだが内面では一切の迷いを排除"
    - "感情ではなく合理で行動を選択"
    - "このシーンで観察者から実行者へ転換"