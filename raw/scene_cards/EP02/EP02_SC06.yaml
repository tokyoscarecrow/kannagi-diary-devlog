scene_id: "EP02_SC06"
title: "発動"
time:
  relative: "学園祭当日（昼）"
location:
  primary: "旧校舎（ミステリーハウス）"
  secondary: "地下 最終エリア（ロッカー設置区画）"
participants:
  - "氷川真魚"
  - "大神みず葉"
  - "来客・クラスメイト（群衆）"

purpose:
  story_role:
    - "真魚の計画の実行（罠の発動）"
    - "文化祭環境を利用した犯行の成立"
    - "SC07への危機状態の生成"
  emotional_role:
    - "日常空間から異常空間への転換"
    - "閉鎖・恐怖の発生"

structure:
  phases:
    - phase: "日常（文化祭）"
      description: "ミステリーハウスの賑わいと運営の様子"
    - phase: "誘導"
      description: "真魚が自然な理由でみず葉を最終エリアへ連れ出す"
    - phase: "空間変化"
      description: "旧校舎地下の不気味さ・隔絶された空気の強調"
    - phase: "拘束"
      description: "ロッカーにみず葉を閉じ込める"
    - phase: "発動"
      description: "配管操作により水が流入し始める"
    - phase: "確信"
      description: "真魚が計画成功を確信する"

beats:
  - order: 1
    summary: "学園祭でミステリーハウスが盛況であることを描写"
  - order: 2
    summary: "真魚が最終エリア確認を理由にみず葉を呼び出す"
  - order: 3
    summary: "二人が旧校舎地下へ移動する"
  - order: 4
    summary: "地下の不気味な雰囲気と場所の特性を提示"
  - order: 5
    summary: "ロッカーの構造確認を名目にみず葉を中に入れる"
  - order: 6
    summary: "扉を閉じ、みず葉を閉じ込める"
  - order: 7
    summary: "配管バルブを操作し、水の流入を開始する"
  - order: 8
    summary: "水が徐々に増え、閉鎖空間の恐怖を強調"
  - order: 9
    summary: "真魚は状況を静かに観察し、計画の成立を確認する"

key_information_revealed:
  - "ロッカーは外開きで内側から開けられない構造"
  - "地下配管から水を流入させることが可能"
  - "水は校内貯水槽由来であり致死量にはならない設計（安全装置）"
  - "文化祭により管理が緩く、犯行が成立する環境"

withheld_information:
  - "隼太がどのように対応するか"
  - "明神の介入タイミング"
  - "真魚の最終目的の全体像"

tension:
  level: "High"
  score: 80

tone:
  - "日常と非日常の混在"
  - "閉鎖"
  - "静かな恐怖"

foreshadowing:
  - "水の流入による危機"
  - "みず葉の反発と突破"
  - "隼太の選択（魔法使用の可能性）"

character_notes:
  mayo:
    - "冷静に計画を実行"
    - "安全装置を組み込む合理性"
    - "隼太を動かすための手段としてみず葉を利用"
  mizuha:
    - "状況を完全には理解しないまま閉じ込められる"
    - "恐怖と怒りが蓄積される"