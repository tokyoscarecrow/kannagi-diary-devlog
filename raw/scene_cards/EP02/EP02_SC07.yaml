scene_id: "EP02_SC07"
title: "選択"
time:
  relative: "学園祭当日（直後）"
location:
  primary: "旧校舎地下 最終エリア"
participants:
  - "飯綱隼太"
  - "大神みずは"
  - "氷川真魚（不在／逃走）"
  - "明神明"
  - "来客・クラスメイト（群衆）"

purpose:
  story_role:
    - "隼太の選択（魔法使用の是非）を提示"
    - "明神の介入と情報提示（真魚の父）"
    - "みずはの自力突破"
    - "真魚の逃走と次シーンへの接続"
  emotional_role:
    - "極限状況の緊張"
    - "緊張の解放（コメディ転換）"
    - "違和感（安全装置の存在）"

structure:
  phases:
    - phase: "異変認識"
      description: "隼太がみずはの不在と状況の異常を把握する"
    - phase: "現場到達"
      description: "地下で閉じ込めと水流入の状況を確認"
    - phase: "極限"
      description: "溺死の危険があると全員が認識"
    - phase: "葛藤"
      description: "隼太が魔法使用を選ぶかどうかの限界に到達"
    - phase: "介入"
      description: "明神が魔法使用を止める"
    - phase: "理解"
      description: "みずはが真魚の意図を見抜く"
    - phase: "突破"
      description: "みずはが物理的にロッカーを破壊"
    - phase: "解放"
      description: "水が流れ出し、危機が回避される"
    - phase: "違和感"
      description: "水位が想定より低く止まり、仕掛けの異常に気づく"
    - phase: "追跡"
      description: "みずはが真魚を追い、隼太たちが続く"

beats:
  - order: 1
    summary: "隼太がクラスメイトからみずはと真魚の行動を聞く"
  - order: 2
    summary: "地下へ向かい、異常（音・人だかり）を確認"
  - order: 3
    summary: "ロッカー内に閉じ込められたみずはと水流入を認識"
  - order: 4
    summary: "周囲の人々が危機を認識し、混乱が広がる"
  - order: 5
    summary: "隼太が魔法使用を決断しかける"
  - order: 6
    summary: "明神が魔法使用を制止し、リスクを示す"
  - order: 7
    summary: "みずはが真魚の意図（魔法使用誘導）を看破する"
  - order: 8
    summary: "みずはが怒りによりロッカーを蹴破る"
  - order: 9
    summary: "水が流出し、みずはが脱出"
  - order: 10
    summary: "水位が低く止まり、安全装置の存在が示唆される"
  - order: 11
    summary: "みずはが真魚を追い、隼太と明神が続く"

key_information_revealed:
  - "真魚の目的は隼太に魔法を使わせること"
  - "みずはは状況を理解し、自力で突破できる"
  - "水は致死量ではなく制御されている可能性"
  - "明神は魔法使用を監視・制御する立場"

withheld_information:
  - "真魚の父の詳細な状況"
  - "真魚の最終目的の全体像"
  - "今後の明神の介入範囲"

tension:
  level: "Peak → Release"
  score: 90

tone:
  - "緊張"
  - "群衆圧"
  - "急激な転調（コメディ）"
  - "違和感"

foreshadowing:
  - "隼太の魔法使用問題の継続"
  - "真魚の計画の段階性"
  - "みずはの行動力（今後の対立強化）"

character_notes:
  hayata:
    - "魔法使用寸前まで追い込まれる"
    - "しかし使用せず踏みとどまる"
  mizuha:
    - "被害者から即座に能動者へ転換"
    - "怒りによる物理突破"
  mayo:
    - "現場にはいないが計画の意図が明確になる"
  myojin:
    - "魔法使用を制止する役割"
    - "状況を冷静に観察し続ける"