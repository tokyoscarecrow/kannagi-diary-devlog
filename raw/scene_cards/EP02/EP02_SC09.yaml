scene_id: "EP02_SC09"
title: "保健室"
time:
  relative: "学園祭当日（午後・直後）"
location:
  primary: "保健室"
participants:
  - "飯綱隼太"
  - "大神みずは"
  - "氷川真魚"

purpose:
  story_role:
    - "事件の意味の確定（真魚の動機の開示）"
    - "三者の価値観の衝突"
    - "真魚の離脱（学校を去る決断）"
    - "SC10への余韻形成"
  emotional_role:
    - "緊張の収束と再燃"
    - "理解と拒絶の同時成立"
    - "未解決の感情の残存"

structure:
  phases:
    - phase: "覚醒"
      description: "保健室で真魚が目を覚まし、静かな空間が提示される"
    - phase: "対話（静）"
      description: "隼太と真魚の一対一の会話"
    - phase: "動機開示"
      description: "真魚が父の件と目的を簡潔に語る"
    - phase: "理解と否定"
      description: "隼太が動機を理解しつつ行動を否定する"
    - phase: "介入"
      description: "みずはが乱入し、感情的に対峙する"
    - phase: "対立"
      description: "みずはが真魚の行動を強く批判"
    - phase: "カウンター"
      description: "みずは自身の過去（魔法による影響）を提示"
    - phase: "受容"
      description: "真魚が反論せず、謝罪を受け入れる"
    - phase: "意思表明"
      description: "真魚が父を諦めないことと退学を宣言"
    - phase: "停滞"
      description: "隼太が判断できず動けない状態になる"
    - phase: "離脱"
      description: "真魚が場を去る"

beats:
  - order: 1
