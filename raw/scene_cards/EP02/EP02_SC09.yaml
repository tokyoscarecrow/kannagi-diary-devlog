  - order: 5
    summary: "みずはが乱入し、真魚を激しく非難する"
  - order: 6
    summary: "みずはが自身の過去と現在の状況を明かす"
  - order: 7
    summary: "真魚が謝罪しつつ、目的を諦めないと明言する"
  - order: 8
    summary: "真魚が退学を宣言する"
  - order: 9
    summary: "隼太が止めるか理解するか判断できず動けない"
  - order: 10
