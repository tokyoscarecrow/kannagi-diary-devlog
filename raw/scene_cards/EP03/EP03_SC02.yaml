scene_id: "EP03_SC02"
title: "主敵との邂逅"

time:
  relative: "SC02の後日"
  part_of_day: "日中（本編）／夜（クリフハンガー）"
location:
  primary: "地域でボランティア活動を行う True North の現場（街区・公園など。※大学キャンパスではない）"
  secondary: "その夜・別のどこかの現場（魔法者A連れ去り）"
  note: >
    【canon不整合・要修正】ep03_structure.yaml の EP03-LOC-01（正統館大学キャンパス）は
    used_in に SC03 を含むが、正典FINALおよび本カードでは SC03 は地域の現場。
    構造ファイルの used_in / LOC を更新すること（キャンパスは SC01・SC02 のみ）。

participants:
  - "飯綱隼太"
  - "香取アンネ＝マリー"
  - "諏訪公命（初登場）"
  - "氷川真魚（観察のみ・台詞なし）"
  - "魔法者A（クリフハンガーのみ・名もなき犠牲者）"
notes_participants: "みずは不在（前話の反復回避のため明示）"

purpose:
  story_role:
    - "主人公と主敵・諏訪公命の初対面。魅力と理想の提示"
    - "直後に諏訪の『裏の顔』（連れ去り）を読者だけに見せ、情報優位で不安を作る"
    - "真魚の尾行が継続していることを示す（SC04の2ライン起動への布石）"
  emotional_role:
    - "善意と理想への感心。だが隼太は動かない"
    - "隼太が抱く、名指しできない不穏な感じ（後にクリフハンガーで裏付けられる）"

structure:
  phases:
    - phase: "邂逅"
      description: "隼太が単独で現場を通りかかる。香取が見つけ、積極的に接触・売り込み"
    - phase: "初対面"
      description: "香取が諏訪を紹介。初対面と会話。理想を聞き感心するが、隼太は何か不穏な感じを受ける"
    - phase: "転調（クリフハンガー）"
      description: "その夜・別現場。魔法者Aが諏訪らしき男に連れ去られる。諏訪の説得（言葉のみ）"

beats:
  - order: 1
    summary: "隼太が一人で出歩いているとき、地域でボランティア活動中の True North の現場を通りかかる（みずはは不在）"
  - order: 2
    summary: "香取が隼太を見つけ、再び接触。サークルを熱心に売り込む"
  - order: 3
    summary: "香取がリーダー・諏訪公命を紹介。主人公と主敵の初対面"
  - order: 4
    summary: "諏訪との会話。理想を聞く。諏訪は穏やか・聡明・魅力的。隼太は感心するが、同時に名指しできない不穏な感じを受ける（＝魔法者と識別はしない）"
  - order: 5
    summary: "少し離れた物陰から真魚が観察している。香取がそれに気づき、真魚は立ち去る（台詞なし）"
  - order: 6
    summary: "【クリフハンガー】その夜、別の現場。魔法者Aが諏訪らしき男に連れ去られる。諏訪の説得——『あなたの素晴らしい能力は社会のために使わなくてはならない。それが選ばれた者の使命。私たちは選ばれた者なのだ』"

cliffhanger:
  hook: "穏やかな理想家だった諏訪が、その夜、魔法者を連れ去る。読者だけがその裏の顔を知る"
  type: "情報優位による不穏（裏の顔）"

key_information_revealed:
  - "諏訪公命という魅力的なリーダーの存在（主敵の初対面）"
  - "諏訪（らしき男）が裏で魔法者を連れ去っていること（読者のみ）"
  - "真魚の尾行が続いていること（読者へ）"
withheld_information:
  - "諏訪自身が魔法者であること（SC10で公然たる魔法使用として初開示。本SCでは伏せる）"
  - "連れ去りの目的・全体像（詳細はSC06の明神来訪で説明）"
  - "諏訪が隼太を後継者候補として狙う理由（SC07で確定）"
  - "True North の内円（魔法者結社）の実態／諏訪の変質（神との再接続）"

tension:
  level: "Mid → High"
  score_start: 45
  score_end: 70

tone:
  - "穏やか・理想的（本編）"
  - "その裏の冷たい作為（クリフハンガー）"
  - "名指しできない不穏"

foreshadowing:
  - "諏訪の穏やかさと裏の顔の落差（以後の中心的緊張）"
  - "隼太の『不穏な感じ』（諏訪の正体への布石。ただし本SCでは正体を明かさない）"
  - "真魚の尾行継続（SC04の2ライン起動）"

magic_and_rules:
  passive_sign_ruling:
    statement: "虹彩の明滅は『魔法使用時のみ』発現する（作者裁定A）"
    application:
      - "本SCでは誰も能動魔法を使わない → 虹彩の明滅は描写しない"
      - "隼太は諏訪を『魔法者だ』と識別しない。あくまで『何か不穏な感じ』止まり"
      - "その不穏の正体は、魔法者が場に残す微細な違和感（MAGOSHA_COMMON_RULES.presence）として地の文で処理してよい。ただし読者にも『諏訪＝魔法者』とは明示しない"
  mr02_compliance:
    statement: "諏訪の勧誘・説得はすべて言葉と承認のみ。魔法による心理操作は描かない（MR-02）"
    application:
      - "本編の会話も、クリフハンガーの連れ去りも、諏訪は言葉と状況だけで動かす"
      - "連れ去りでも魔法は使わない → 虹彩なし（A裁定と一貫）"

character_notes:
  izuna_shunta:
    - "諏訪の理想に感心する。だが動かない（この『動かなさ』がSC09-10の『動いてしまう』との落差を作る）"
    - "名指しできない不穏を覚えるが、深く追わずやり過ごす"
  katori_anne_marie:
    - "積極的な売り込み。健全さを演じきる。本心・忠誠の向きは明示しない（Config forbidden 準拠）"
    - "真魚の観察に気づく鋭さを見せる"
  suwa_komei:
    - "穏やか・聡明・確信に満ちる。声を荒げない。幼稚な悪役言動なし（Config forbidden 準拠）"
    - "隼太には終始『飯綱くん』と丁寧な距離を保つ（香取の親密さとの対比）"
    - "クリフハンガーでの説得も、あくまで確信に満ちた穏やかさで行う"
  hikawa_mao:
    - "観察のみ・台詞なし。香取に気づかれて立ち去る。SC01の反復にせず『尾行の継続』として軽く置く"
  magosha_A:
    - "名もなき犠牲者。連れ去られる側。短く映像的に処理する"

addressing:
  shunta_to_suwa: "諏訪さん"  # 作者修正：高校生↔大学生で学校の先輩後輩関係ではないため（先輩→さん）
  suwa_to_shunta: "飯綱くん"
  katori_to_suwa: "諏訪様"
  katori_to_shunta: "隼太くん"
  katori_to_mao: "真魚ちゃん（気づいた際に用いる場合）"
  suwa_to_katori: "アンネ＝マリー"

prose_length:
  target_chars: 2000
  tolerance: "±200（生成時判断で前後可）"
  note: "本SCはクライマックスではないため通常基準。ただし二部構成（本編＋夜の連れ去り）のため、連れ去りは『現場だけを短く』"

meta:
  source: "EP03_episode_breakdown_FINAL.md（正典）の『主敵との邂逅』の内容。本作構成では SC02（SC01の続き）として配置"
  numbering_note: "本カードは当初SC03として誤作成されたが、正しくはSC02。『旧SC02（キャンパスでのTrue North勧誘）』は誤って生成された不要物で、存在しない扱い（削除済み）"
  author_rulings:
    - "A：虹彩明滅は魔法使用時のみ。初対面では『不穏な感じ』止まり"
    - "B：真魚は観察のみ→香取に気づかれて立ち去る（台詞なし）"
    - "C：諏訪と実際に会う（紹介・初対面・会話）"
    - "D：クリフハンガーは魔法者A連れ去り＋諏訪の説得（言葉のみ・MR-02厳守）"
  open_items:
    - "E：ep03_structure.yaml の LOC-01 used_in から SC03 を外し、地域現場のLOCを追加する（構造ファイル側の修正が必要）"
    - "G：addressing_rules.yaml の izuna_shunta.to_suwa を『諏訪先輩』→『諏訪さん』に更新する（正典側の修正が必要）"
  depends_on:
    - "WORLD_AND_RULE_CONFIG@1.0.0"
    - "Config@3.1"
    - "addressing_rules@1.0"
    - "ep03_structure@1.0"
  review_status: "draft"
  schema_version: "1.1.0"
