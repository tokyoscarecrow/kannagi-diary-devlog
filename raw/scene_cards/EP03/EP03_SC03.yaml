scene_id: "EP03_SC03"
title: "主敵との邂逅"

time:
  relative: "後日 / その夜"
  part_of_day: "日中 → 夜"
location:
  primary: "トゥルーノースの地域ボランティア活動の現場"
  secondary: "どこか（夜・魔法者Aが連れ去られる場所）"

participants:
  - "飯綱隼太"
  - "諏訪公命"
  - "香取アンネ＝マリー"
  - "魔法者A（クリフハンガー部・名もなき犠牲者）"

purpose:
  story_role:
    - "主人公と主敵・諏訪公命の初対面"
    - "諏訪の魅力と思想を提示する。ただし隼太は動かない（ピンとこない）"
    - "ラストで諏訪の『裏の顔』を読者だけに見せる（勧誘の実態）"
  emotional_role:
    - "諏訪の穏やかさ・聡明さ・カリスマ"
    - "その直後の落差（あの理想家が、夜に人を連れ去る）"

structure:
  phases:
    - phase: "邂逅"
      description: "ボランティア現場。香取が隼太を見つけ、諏訪を紹介する"
    - phase: "対話"
      description: "諏訪が理想を語る。隼太は感心するが、ピンとこない"
    - phase: "裏の顔（クリフハンガー）"
      description: "その夜、魔法者Aが諏訪らしき男に連れ去られ、目覚めさせられる"

beats:
  - order: 1
    summary: "地域ボランティアの現場。香取が通りかかった隼太を見つける"
  - order: 2
    summary: "香取がリーダー・諏訪公命を紹介する。主人公と主敵の初対面"
  - order: 3
    summary: "諏訪は穏やかで聡明。その理想を語る"
  - order: 4
    summary: "隼太は感心する。だが、ピンとはこない（自分ごとにならない）"
  - order: 5
    summary: "【転換・その夜】どこかで、魔法者Aが諏訪らしき男に連れ去られる"
  - order: 6
    summary: "諏訪が魔法者Aを説得し、希望を与えて目覚めさせる"

cliffhanger:
  hook: "諏訪の言葉——「あなたの素晴らしい能力は社会のために使わなくてはならない。それが選ばれた者の使命。私たちは選ばれた者なのだ」。あの穏やかな理想家の、もう一つの顔を読者だけが知る"
  type: "情報の暴露（読者のみ）"

key_information_revealed:
  - "諏訪公命は穏やかで聡明、魅力的なカリスマである"
  - "諏訪は魔法者を密かに連れ去り、勧誘（覚醒）させている"
  - "諏訪の勧誘は言葉と承認だけで行われる（魔法による操作ではない）"
withheld_information:
  - "諏訪が魔法者であること"
  - "『神との再接続』の危険性・変質"
  - "組織の最終目的（収容施設の解放・公開）"
  - "隼太が後継者候補として狙われていること"

tension:
  level: "Mid → High"
  score_start: 45
  score_end: 70

tone:
  - "諏訪の魅力（穏やか・聡明）"
  - "直後の落差（静かな恐怖）"
  - "読者だけが知る優位からくる不安"

foreshadowing:
  - "諏訪の理想に、隼太は今は動かない（後の崖災害での『動いてしまう』との落差）"
  - "魔法者失踪の実態（次のSC04で明神が追う『失踪事件』の正体）"

reincarnation_seeds:
  - id: ""
    name: ""
    surface_read: ""
    rewatch_read: ""
    rule: ""
  # ※SC03には周回の種は配置しない（空。種はSC08・SC09）

character_notes:
  izuna_shunta:
    - "諏訪に感心するが、自分ごとにならない。受動性ゆえの距離"
  suwa_komei:
    - "穏やか・聡明・確信に満ちる。声を荒げない。魅力的なカリスマとして"
    - "魔法者Aへの勧誘は、承認と使命の付与（言葉のみ・MR-02遵守）"
  katori_anne_marie:
    - "諏訪を『諏訪様』と呼ぶ。隼太と諏訪を繋ぐ役"

meta:
  depends_on:
    - "WORLD_AND_RULE_CONFIG@1.0.0"
    - "Config@3.0"
    - "addressing_rules@1.0"
    - "ep03_structure@1.0"
  review_status: "draft"
  schema_version: "1.1.0"
  note: >
    元構成のSC04（魔法者A連れ去り）を本SC03のクリフハンガーに吸収した。
    連れ去りは現場だけを短く見せる。詳細説明は後のSC（明神の来訪）に回す。
    視点：隼太のいない夜の場面を短く挿入する（EP03初の主人公不在シーン）。
