scene_id: "EP03_SC03"
title: "二つの追跡"

time:
  relative: "SC02の後日〜数日（尾行が続く日々）"
  part_of_day: "日中（放課後・通学路など）"
location:
  primary: "六ッ川高校およびその周辺・通学路（ライン1＝尾行の舞台）"
  secondary: "隼太の自宅前、または面接的な場（ライン2＝明神の聞き込み）"
  note: >
    ep03_structure.yaml の EP03-LOC-02（六ッ川高校およびその周辺）に対応。
    ※圧縮に伴い used_in の番号は要更新（旧SC04→新SC03）。

participants:
  - "氷川真魚（ライン1）"
  - "大神みず葉（ライン1）"
  - "明神明（ライン2）"
  - "飯綱隼太（ライン2）"
notes_participants: >
  2ラインで登場人物が分かれる。ライン1に隼太は出さない／ライン2にみず葉・真魚は出さない
  （交互進行の独立性を保つ）。

purpose:
  story_role:
    - "2ライン交互進行の起動（SC03〜SC06、SC06で収束）"
    - "ライン1：真魚の尾行が、みず葉に発覚する（真魚×みず葉接触の起点）"
    - "ライン2：魔法者失踪事件の提示 → 明神の聞き込み → 体制の綻び"
    - "『失踪＝連れ去り』を読者だけが知る情報優位を確立する（隼太は知らない）"
  emotional_role:
    - "日常の中にしのび込む不穏"
    - "真魚の孤独な執念／みず葉の直情的な警戒"
    - "明神の事務的な、しかし拭えない危機感"
    - "隼太の名指しできない予感"
    - "読者の不安（真相を知るのは読者だけ）"

structure:
  phases:
    - phase: "ライン1・尾行"
      description: "手段を失った真魚が隼太を尾行する日々。物陰からの監視"
    - phase: "ライン1・発覚"
      description: "背後にみず葉が立つ。『あんた、今度はなにたくらんでるの？』"
    - phase: "ライン2・聞き込み"
      description: "魔法者失踪事件を背景に、明神が隼太へ聞き込みに来る"
    - phase: "ライン2・予感（クリフハンガー）"
      description: "明神の去り際の一言、または隼太の嫌な予感"

dual_line:
  line1:
    label: "真魚 × みず葉"
    beats: [1, 2, 3]
  line2:
    label: "明神 × 隼太"
    beats: [4, 5, 6, 7]
  interplay: >
    読者だけが『失踪＝諏訪たちの連れ去り』（SC02クリフハンガー）を知っている。
    ライン1・2のいずれの登場人物も真相に届いておらず、その認識のズレ（NE-001）が
    両ラインに通底する緊張を生む。ライン1は『探す者（真魚）』、ライン2は
    『気づきかける制度（明神）』を対置し、SC06の収束（探す者たちの物語が
    “探される隼太”に収束）への布石とする。

beats:
  - order: 1
    summary: "EP02の顛末で手段を失った真魚。魔法の情報を求めるが、公開情報は皆無。行き詰まる"
  - order: 2
    summary: "真魚は隼太の尾行に出る。学校でも、行き帰りでも、物陰から監視する日々が続く"
  - order: 3
    summary: >
      ある日、ふと気づくと背後にみず葉が睨んで立っている。『あんた、今度はなにたくらんでるの？』
      短い応酬のあと、みず葉が一歩詰め寄るところで切る（＝未決着。対話の決着はSC04で行う）
  - order: 4
    summary: "魔法者の失踪事件が相次いでいる（作中の認識として提示）"
  - order: 5
    summary: "異変がないか、明神が隼太に聞き込みに来る"
  - order: 6
    summary: "明神は、魔法者の所在情報が内部から漏洩しているのではと危機感を抱いている"
  - order: 7
    summary: "隼太に異常はない。だが、その話を聞いて嫌な予感を抱く（＝クリフハンガー）"

cliffhanger:
  hook: >
    明神が去り際に残す一言、あるいは隼太の予感の描写。読者は『失踪』の正体
    （＝SC02で見た連れ去り）を知っているため、隼太だけが真相に届いていない
    その一点が、静かな不安として残る。
  type: "情報優位による不穏（読者だけが真相を知る）"
  secondary_hook: >
    ライン1末尾は『みず葉が一歩詰め寄る』ところで切る（未決着）。次話SC04冒頭で
    真魚が逃げ出し、みず葉が追う——という動作に直結させる。
    【接続ルール】SC03のライン1で対話を決着させないこと。
    具体的には、真魚に目的を語らせない／みず葉に『もう近づくな』等の言い渡しをさせない／
    どちらかがその場を立ち去る描写を書かない。決着はすべてSC04で行う。

key_information_revealed:
  - "魔法者の失踪事件が相次いでいること（作中人物の認識）"
  - "真魚が隼太を執拗に尾行していること"
  - "みず葉が真魚の尾行に気づき、対峙すること"
  - "明神が『所在情報の漏洩（内部から）』を疑っていること＝体制の綻び"
withheld_information:
  - "『失踪』の正体＝諏訪たちの連れ去り（読者は知るが、作中の誰も知らない）"
  - "真魚の真の目的＝父の手がかりとしての魔法情報（次話『二人の父』で開示）"
  - "漏洩の出所（香取の潜入・ファイル窃取は後のSC）"
  - "諏訪＝魔法者、内円（結社）の実態"

tension:
  level: "Mid-High"
  score_start: 55
  score_end: 58
  note: >
    SC02クリフハンガー（連れ去り＝70）の衝撃のあと、いったん探索・捜査の
    静かな不穏へ落として持続させる（恐怖でなく“真相を知る読者”の不安）。
    EP全体では以後さらに上昇していく途中の踊り場。

tone:
  - "日常の中の不穏"
  - "尾行の執念（真魚）／直情の警戒（みず葉）"
  - "事務的だが拭えない危機感（明神）"
  - "読者の情報優位による静かな不安"

foreshadowing:
  - "『失踪＝連れ去り』の情報優位（以後の中心的緊張）"
  - "明神の漏洩への危機感 → 体制の綻び／サブストーリー（明神×上長）／TH-03（消去法再発見）への布石"
  - "真魚×みず葉の接触 → 方向2（信頼）の起点"
  - "隼太の予感（自分が“探される側”になりつつあることの、無自覚な予兆）"

reincarnation_seeds: []   # SEED-1（虹彩）/SEED-3（真魚の予感）は後SC担当。本SCでは置かない

magic_and_rules:
  passive_sign_ruling:
    statement: "虹彩の明滅は『魔法使用時のみ』（作者裁定A）"
    application:
      - "本SCでは誰も能動魔法を使わない → 虹彩の明滅は描写しない"
      - "明神の魔法者性は未確定。いずれにせよ本SCで魔法・感知は描かない"
  mao_clue_ruling:
    statement: >
      【正】真魚が握る唯一の手がかりは『隼太の虹彩が一瞬ウグイス色に明滅するのを
      目撃したこと』である。真魚は隼太が魔法を使う場面（みず葉を救った件等）を
      目撃していない。
    rationale: >
      一般人は虹彩の明滅にほとんど気づけないが、真魚は幼少期に父が魔法を使う場に
      居合わせ、同じ光を父の目に見ている。ゆえに彼女だけがその意味を知る。
      Config CHARACTER_LAYER hikawa_mao.magic.note（父の虹彩を見て隼太を魔法者と
      見抜いた／一般人には気づけないはず＝伏線）および
      WORLD_AND_RULE_CONFIG passive_visual_sign と整合。
    application:
      - "真魚の尾行動機は『あの光がもう一度現れること』を待つ行為として書く"
      - "真魚に『隼太が魔法を使うのを見た』と認識させない・書かない"
      - "この事実は真魚の内面としてのみ提示し、他者へは明かさない（本SCでは非開示）"
    canon_dependency: >
      【要対応】EP01に『真魚が隼太の虹彩の明滅を一瞬だけ目撃する』描写の追加が必要
      （別チャットで作者確定済み）。本カードの記述を正とし、EP01側を後日これに合わせる。
  mr02_compliance:
    statement: "本SCに説得・操作の場面はなく、MR-02は直接関与しない"

character_notes:
  hikawa_mao:
    - "常に敬語・感情抑制・一歩距離を置く。尾行は静かだが執念深い"
    - "手がかりは『隼太の虹彩の明滅を目撃したこと』のみ（魔法の行使は見ていない）。※mao_clue_ruling 参照"
    - "みず葉に捕まっても取り乱さない。目的（父の手がかり）はまだ明かさない"
    - "呼称：みず葉＝『大神さん』"
  omiwa_mizuha:
    - "直情・断定・勢い。真魚への対抗意識と警戒がそのまま出る"
    - "『あんた、今度はなにたくらんでるの？』——問い詰めるが、まだ話は聞いていない"
    - "呼称：真魚＝『氷川さん』"
  myojin_akira:
    - "事務的・丁寧語・抑揚が少ない・規則優先。感情は出さない"
    - "だが漏洩への危機感は、定型的な物言いの端ににじむ"
    - "呼称：隼太＝『飯綱くん』"
  izuna_shunta:
    - "短文・反応主体。異常はないと答える。だが話を聞いて嫌な予感を抱く"
    - "読者と違い、失踪の正体（連れ去り）を知らない。その“知らなさ”が不安の源"
    - "呼称：明神＝『明神さん』"

addressing:
  mizuha_to_mao: "氷川さん"
  mao_to_mizuha: "大神さん"
  myojin_to_shunta: "飯綱くん"
  shunta_to_myojin: "明神さん"

prose_length:
  target_chars: 2000
  tolerance: "±200"
  note: "2ライン交互のため配分に注意（ライン1・2それぞれに緊張の起伏と引きを持たせる）"

meta:
  source: "EP03_episode_breakdown_FINAL.md の『二つの追跡』（旧FINAL SC04）。章の圧縮により新SC03"
  numbering_note: >
    章を1話圧縮（FINAL SC02を削除）した結果、本シーン以降は
    『新SC番号 = FINAL番号 − 1』。全9話。
  open_items:
    - "canon（ep03_structure.yaml / episode_breakdown）側の番号繰り上げ：
       dual_line span（旧SC04〜07→新SC03〜06）、convergence（旧SC07→新SC06）、
       tension_curve、LOC used_in を要更新"
    - "EP01に『真魚が隼太の虹彩の明滅を一瞬だけ目撃する』描写を追加する
       （mao_clue_ruling を正とし、EP01側を後日これに合わせる）"
  depends_on:
    - "WORLD_AND_RULE_CONFIG@1.0.0"
    - "Config@3.1"
    - "addressing_rules@1.0"
    - "ep03_structure@1.0"
  review_status: "draft"
  schema_version: "1.1.0"
