scene_id: "EP03_SC05"
title: "香取桃子"

time:
  relative: "SC04の直後〜数日（真魚パートはSC04の当夜〜翌日、以降は並行して進む）"
  part_of_day: "夜（真魚）／日中（明神・桃子）／夜（諏訪）"
location:
  primary: "地方厚生局オフィス（桃子の窃盗）"
  secondary: "真魚の自室（短く）／明神の職場または隼太への接触の場／諏訪のいる場所（夜・短く）"
  note: >
    ep03_structure.yaml の EP03-LOC-03（地方厚生局オフィス／魔法者ファイルの保管場所）に対応。
    ※圧縮に伴い used_in の番号は要更新。オフィスは「情報提示が目的。短く映像的に処理する」。

participants:
  - "氷川真魚（単独・短く）"
  - "明神明"
  - "飯綱隼太（明神パートに登場可。ただし主眼は明神）"
  - "香取アンネ＝マリー（通名：香取桃子）"
  - "諏訪公命（クリフハンガー）"
notes_participants: >
  【重要】みず葉と真魚の対話シーンは描かない。SC04で完結させた。
  真魚はSC05では単独で扱い、みず葉から得た言葉は内面の反芻としてのみ示す。

continuity_from_sc04:
  statement: >
    時間的にはSC04の直後だが、対話場面を再現しない（作者裁定(a)）。
  application:
    - "みず葉の語り（幼稚園の『再教育』の話、行き先のビデオ）を場面として書き直さない"
    - "真魚が『古い団地のような場所』という言葉を得た、という結果だけを内面で示す"
    - "回収は『真魚が動き出したこと』で果たす。対話の続きとしては書かない"

purpose:
  story_role:
    - "前話クリフハンガーの回収：真魚が手がかりを得て動き出す（短く）"
    - "明神が『内部漏洩の疑い濃厚』という確信に至る"
    - "香取桃子が魔法者ファイルを盗んでいることを、読者に明確に見せる"
    - "【収束】盗まれた情報の中に、諏訪が隼太の名を見つける"
  emotional_role:
    - "静かな加速。三つの動きが、それぞれ別の場所で同時に進む"
    - "読者だけが全体像を見られることによる緊張"
    - "『探す者たちの物語』が『探される隼太の物語』へ転回する瞬間"

structure:
  phases:
    - phase: "真魚（短く）"
      description: "得た言葉を反芻し、検索を始める。夜。単独。数行〜短い一段落"
    - phase: "明神"
      description: "失踪者の記録を洗い、外部からでは説明がつかないと確信する。上司の存在は示すが登場させない"
    - phase: "桃子"
      description: "地方厚生局のオフィス。誰にも気に留められない事務員が、魔法者のファイルを盗む"
    - phase: "諏訪（クリフハンガー）"
      description: "盗まれた資料を見る諏訪。隼太の名と記録に目を留める"

beats:
  - order: 1
    summary: "真魚が『古い団地のような場所』という言葉を手に、検索を始める（短く。前話クリフハンガーの回収）"
  - order: 2
    summary: "明神が失踪者の記録を洗い直す。所在情報は限られた者しか知り得ない。外部からの漏洩では説明がつかない"
  - order: 3
    summary: "明神が『内部からの漏洩』の疑いを濃厚と判断する。ただし確証はなく、動けない"
  - order: 4
    summary: "上司の存在が示される（決裁を仰ぐ相手／前例主義の壁として気配のみ。登場も台詞もなし）"
  - order: 5
    summary: "地方厚生局のオフィス。地味なメガネの事務員・香取桃子。誰も彼女を気に留めない"
  - order: 6
    summary: "桃子が魔法者のファイルを盗む。手際は完璧で、迷いがない（読者に明確に見せる）"
  - order: 7
    summary: "【クリフハンガー】盗まれた資料を見る諏訪。その中に飯綱隼太の名を見つけ、目を留める"

cliffhanger:
  hook: >
    諏訪が、盗まれた記録の中に隼太の名を見つける。読者は、彼が誰かを知っている。
    探していた者たちの物語が、探される者の物語へ変わる。
  type: "情報の収束 / 標的の確定"
  note: >
    諏訪の内心（後継者候補として狙いを定める）は、台詞や地の文で言い切らない。
    目を留める・指が止まる等の動作で示し、読者に予感させるに留める。

key_information_revealed:
  - "真魚が手がかりを得て、探索を開始したこと"
  - "明神が『内部からの漏洩』を濃厚と見ていること"
  - "香取桃子＝地方厚生局に潜入している事務員であること"
  - "桃子が魔法者ファイルを盗んでいること（読者に明確に）"
  - "諏訪が隼太の記録を手に入れたこと"
withheld_information:
  - "桃子＝香取アンネ＝マリーであること（読者が結びつけられるかは演出判断。作中の誰も知らない）"
  - "香取の二重スパイとしての忠誠の向き（物語上の最大の謎・保留）"
  - "諏訪が隼太をどう扱うつもりか（後継者候補としての意図は明示しない）"
  - "隔離施設の所在（真魚の探索はまだ始まったばかり）"
  - "諏訪＝魔法者であること（SC後半の災害パートまで伏せる）"

tension:
  level: "High"
  score_start: 60
  score_end: 70

tone:
  - "静かな加速"
  - "事務的な冷たさ（オフィス・記録・手続き）"
  - "読者だけが全体を見ている不安"

foreshadowing:
  - "『完璧な美女』と『地味な事務員』の二面性 → 香取の二重性を外見レベルで予告"
  - "明神が動けないこと → 体制の構造的な鈍さ（後の単独行動への布石）"
  - "真魚の探索 → 隔離施設の特定（EP04で本格化）"
  - "諏訪が隼太の名を見つけたこと → 以降の接触の根拠"

reincarnation_seeds: []

magic_and_rules:
  passive_sign_ruling:
    statement: "本SCで能動魔法は使用されない → 虹彩の明滅は描写しない"
    note: "諏訪が登場するが、魔法は使わない。彼の魔法者性は引き続き伏せる"
  mr02_compliance:
    statement: "説得・操作の場面なし。桃子の窃盗は純粋な工作技能によるもの（魔法ではない）"
  katori_ability_note:
    statement: >
      香取は magic_user: false。武器は4か国語・社交・工作技能・忠誠。
      窃盗は魔法ではなく、潜入と手際によって成立させる（Config準拠）。

character_notes:
  hikawa_mao:
    - "単独。台詞は最小限、あるいはなし。行動だけを短く見せる"
    - "みず葉との対話は再現しない。得た言葉の反芻に留める"
    - "感情を昂らせない。静かに、確信を持って動き出す"
  myojin_akira:
    - "事務的・丁寧語・抑揚が少ない。感情を出さない"
    - "確信に至るが、確証がないため動けない。その手詰まりを、感情でなく手続きの描写で示す"
    - "上司には決裁を仰ぐ立場。壁は『気配』として示し、上司を登場させない"
    - "呼称：隼太＝『飯綱くん』"
  katori_anne_marie:
    - "通名『香取桃子』。地味なメガネ姿。完璧に『いない人』として振る舞う"
    - "誰にも気に留められない存在感の薄さが、そのまま有能さである"
    - "窃盗の手際に迷いがない。だが本心・忠誠の向きは一切見せない（Config forbidden 準拠）"
    - "内面描写を与えない。外から見た動作のみで処理する"
  suwa_komei:
    - "穏やか。声を荒げない。感情の起伏を見せない"
    - "隼太の名を見つけたときも、大げさな反応をしない。ただ、指が止まる"
    - "内心を地の文で説明しない（狙いを定めた、等と書かない）"
    - "呼称：香取＝『アンネ＝マリー』"

addressing:
  myojin_to_shunta: "飯綱くん"
  shunta_to_myojin: "明神さん"
  suwa_to_katori: "アンネ＝マリー"
  katori_to_suwa: "諏訪様"

prose_length:
  target_chars: 2000
  tolerance: "±200"
  note: >
    四つの局面を扱うため、配分に注意。真魚は最短（数行）、オフィスは短く映像的に、
    諏訪は最後の一撃として簡潔に。明神パートに最も字数を割く。
  texture_reference:
    narration_sentence_median: 20
    narration_sentence_max: 45
    narration_ratio: 0.65

meta:
  source: >
    EP03_episode_breakdown_FINAL.md の『古い団地のような場所』ライン2および
    『香取桃子』（旧FINAL SC06・SC07）を統合・再構成。作者指示により収束を前倒し。
  numbering_note: >
    話数は固定しない。第二幕は短縮ではなく、以降（豪雨の救出劇まで）の物語量増大が
    見込まれるため、柔軟に配分する（作者方針）。
  structural_note: >
    本SCは『探す者たちの物語』が『探される隼太の物語』へ転回する収束点。
    三つの動き（真魚・明神・桃子）が別々に進み、諏訪の一点へ集まる構成。
  open_items:
    - "canon側の番号・構成の更新（dual_line span / convergence / LOC used_in）"
    - "EP01への虹彩目撃の追加（mao_clue_ruling を正とする）"
    - "gov_boss_TBN は本SCでは登場させないため命名不要。登場時に要命名"
  depends_on:
    - "WORLD_AND_RULE_CONFIG@1.0.0"
    - "Config@3.1"
    - "addressing_rules@1.0"
    - "ep03_structure@1.0"
    - "EP03_SC04（時間的接続。ただし対話場面は再現しない）"
  review_status: "draft"
  schema_version: "1.1.0"
