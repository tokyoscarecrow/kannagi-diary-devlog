scene_id: "EP03_SC06"
title: "台風"

time:
  relative: "SC05から数日〜十数日後。その年最後の大型台風が関東を直撃する日"
  part_of_day: "午前（休校決定）→ 昼（下校）→ 夕方〜夜（帰宅後・警報）"
location:
  primary: "六ッ川高校およびその周辺・通学路（横浜市想定）"
  secondary: "飯綱家（帰宅後）"
  note: >
    ep03_structure.yaml の EP03-LOC-02 に対応。
    崖・老人ホームは【話題としてのみ】登場させ、現地は描かない（次SC以降の舞台）。

participants:
  - "飯綱隼太"
  - "大神みず葉"
  - "氷川真魚"
  - "住吉奨太郎"
  - "隼太の家族（母。帰宅後パート）"

purpose:
  story_role:
    - "台風の直撃と休校。災害の入口を、日常の側から描く"
    - "土砂災害の危険を『土地柄として誰もが知る一般常識』として提示する（予知ではない）"
    - "みず葉の祖母が老人ホームにいることを説明し、後の行動の動機を事前に読者へ渡す"
    - "隼太の『人任せ』の癖を、能力への諦めとして描く"
    - "真魚が問いを飲み込む（探索は継続しているが、今日は状況が許さない）"
  emotional_role:
    - "非常時特有の、ざわついた高揚と気の緩み"
    - "四人の日常的な空気（住吉のコメディが緩衝材になる）"
    - "その裏で進む、静かな不安"
    - "帰宅後の弛緩から、警報による緊張への落差"

structure:
  phases:
    - phase: "休校"
      description: "二時間目で休校が決まる。強い雨。教室のざわつき"
    - phase: "下校"
      description: "四人で帰る。土砂災害の話題。避難場所の話。みず葉が祖母のホームを心配する"
    - phase: "飲み込まれた問い"
      description: "真魚が隼太に訊こうとして、やめる（今日はそれどころではない）"
    - phase: "一瞬の想像"
      description: "隼太が『もし魔法が使えたら、みんなを助けられるのに』と思い浮かべ、即座に自分で否定する"
    - phase: "帰宅・警報（クリフハンガー）"
      description: "家族とぼんやり過ごす。スマホの災害警報が鳴りはじめ、みず葉から連絡が来る"

beats:
  - order: 1
    summary: "台風の直撃により、二時間目で休校が決まる。強い雨の中、生徒たちが下校する"
  - order: 2
    summary: "隼太・みず葉・真魚・住吉の四人で帰る。住吉が場を明るくする"
  - order: 3
    summary: "土砂災害の話題が出る。この土地では豪雨のたびに誰もが思い浮かべる危険で、避難場所も決まっている（＝一般常識。隼太は何も感知しない）"
  - order: 4
    summary: "みず葉が、崖下の老人ホームに祖母が入居していることを話し、心配する（設定の提示）"
  - order: 5
    summary: "真魚が隼太に何かを訊こうとして、やめる。今日はそれどころではないと判断する"
  - order: 6
    summary: "隼太が『もし魔法が使えたら、みんなを助けられるのに』と一瞬思い浮かべ、すぐに自分で否定する"
  - order: 7
    summary: "帰宅。家族とぼんやり過ごす。雨音だけが強くなっていく"
  - order: 8
    summary: "【クリフハンガー】スマホの災害警報が鳴りはじめる。続いて、みず葉から連絡が来る"

cliffhanger:
  hook: >
    弛緩した家の中に、警報が鳴り響く。そこへみず葉からの連絡。
    何が起きたかは書かず、鳴った・届いた、というところで切る。
  type: "危機の発生"
  note: >
    みず葉の連絡の内容は書き切らない（電話が鳴った／通知が来た、で止める）か、
    ごく短く一言だけにする。詳細はSC07冒頭で開く。

key_information_revealed:
  - "大型台風の直撃。休校。強い雨"
  - "この土地では豪雨時の土砂災害が一般に知られた危険であること（避難場所も周知されている）"
  - "みず葉の祖母が、崖下の老人ホームに入居していること"
  - "隼太が『魔法で人を助ける』という想像を、自分で否定すること"
  - "真魚の探索が継続していること（問いを飲み込む形で示唆）"
withheld_information:
  - "実際に崩落が起きるかどうか（本SCでは起きない）"
  - "諏訪たちが災害時にどう動くか（SC後半まで伏せる）"
  - "みず葉の連絡の内容（次SC冒頭で開く）"
  - "真魚が訊きたかったことの中身（＝隔離施設の記憶。明かさない）"

tension:
  level: "Mid → High"
  score_start: 45
  score_end: 75

tone:
  - "非常時のざわつき"
  - "日常的な軽さ（住吉）"
  - "静かに積もる不安"
  - "ラストの警報による断絶"

foreshadowing:
  - "土砂災害の危険（土地柄としての一般常識）→ 実際の崩落へ"
  - "みず葉の祖母のホーム → SC以降の行動の動機"
  - "隼太の『助けられるのに』の否定 → 諏訪たちが公然と人を救うのを見たときの痛烈な反転"
  - "真魚の飲み込まれた問い → 探索の継続"

reincarnation_seeds:
  - id: "SEED-3"
    name: "真魚の予感（種3）"
    placement: "本SC。下校の道中、崖の近くを通る場面"
    description: >
      真魚が、崖の法面の排水路から流れ出る水を眺めている。それだけを書く。
    surface_read: "ただの情景。雨の日に水を見ている、以上の意味を読者は受け取らない"
    rewatch_read: "彼女もまた、何かを感じ取っていた（潜在能力の予兆）"
    rule: >
      【厳守】以下を絶対に書かない。
      ・『なぜか』『胸騒ぎ』『予感』『気になった』等、内面や理由を示す語
      ・真魚が何かを感じ取ったことを示唆する地の文
      ・彼女が立ち止まった理由の説明
      ・他の人物が真魚の様子を訝しむ描写
      書けるのは行為のみ。『真魚は排水路から流れ出る水を見ていた』程度に留める。
      一周目の読者に、これが伏線であると気づかせてはならない。
      『もしかして真魚も潜在能力者か』と思わせた時点で失敗。
    integration_note: >
      会話の流れの中に埋める。誰かが話しかけて真魚が応じ、場面が次へ流れる、
      という形で通過させる。この行為に読者の注意を集めない。

magic_and_rules:
  passive_sign_ruling:
    statement: "本SCで隼太は何も感知しない。虹彩の明滅も描写しない"
    rationale: >
      パッシブ感知は『現に起きている物理的異変』の検知であり、未来の予測（予知）ではない。
      下校時点では崩落の兆候は生じておらず、感知させると予知能力に見えてしまう。
      危険は『土地柄として誰もが知る一般常識』として提示し、隼太固有の情報優位を作らない。
    application:
      - "隼太に崖の異変を感じ取らせない"
      - "土砂災害の危険は、生徒たちの会話・行政の周知・避難場所の存在として提示する"
  shunta_passivity:
    statement: >
      隼太の『人任せ』は、危険を察知しながら動かないことではなく、
      『自分の力で人を助ける』という想像そのものを即座に否定することとして描く。
    application:
      - "一瞬だけ思い浮かべる。そして自分で打ち消す。逡巡を長く書かない"
      - "打ち消す理由を理屈で説明しすぎない（習い性としての反射に近い）"
      - "この一瞬が、後に諏訪たちが公然と人を救うのを目撃したとき反転する"
  mr02_compliance:
    statement: "本SCに説得・操作の場面はなし"

character_notes:
  izuna_shunta:
    - "短文・反応主体。非常時でも取り乱さない"
    - "『もし魔法が使えたら』を一瞬思い、すぐ否定する。この否定を淡々と書く"
    - "呼称：みず葉＝『みず葉』／真魚＝『氷川さん』／住吉＝『奨太郎』"
  omiwa_mizuha:
    - "感情が先に出る。祖母の心配を口に出す"
    - "深刻ぶらず、しかし本気で気にしている、という温度"
    - "呼称：隼太＝『隼太』／真魚＝『氷川さん』／住吉＝『住吉』"
  hikawa_mao:
    - "常に敬語・感情抑制。四人の中では発言が少ない"
    - "隼太に訊こうとして、やめる。その逡巡を短く見せる"
    - "【SEED-3】崖の法面の排水路から流れ出る水を見ている。理由も内面も書かない（reincarnation_seeds の rule を厳守）"
    - "呼称：隼太＝『飯綱くん』／みず葉＝『大神さん』／住吉＝『住吉くん』"
  sumiyoshi_shotaro:
    - "砕けた口調・軽口・テンション高め。非常時をむしろ楽しんでいる"
    - "場を緩める緩衝材。真面目な長台詞は禁止（Config forbidden 準拠）"
    - "呼称：隼太＝『隼太』／みず葉＝『みず葉』／真魚＝『氷川さん』"
  shunta_family:
    - "母。日常の温度を担う。台風を特別視しすぎない生活者の反応"
    - "深く description しない。家庭の空気だけ示す"

addressing:
  shunta_to_mizuha: "みず葉"
  shunta_to_mao: "氷川さん"
  shunta_to_sumiyoshi: "奨太郎"
  mizuha_to_shunta: "隼太"
  mizuha_to_mao: "氷川さん"
  mao_to_shunta: "飯綱くん"
  mao_to_mizuha: "大神さん"
  sumiyoshi_to_shunta: "隼太"
  sumiyoshi_to_mizuha: "みず葉"

prose_length:
  target_chars: 2600
  tolerance: "±400（2200〜3000）"
  note: >
    SC05の反省を反映し、台詞主体で構成する。四人の会話が中心となるため
    台詞比率は高めでよい（30〜40%目安）。地の文の説明過多を避ける。
  texture_reference:
    narration_sentence_median: 18
    narration_sentence_max: 45
    narration_ratio: 0.65

meta:
  source: "EP03_episode_breakdown_FINAL.md の『台風』（旧FINAL SC08）を作者指示により再設計"
  design_change_note: >
    【重要な設計変更】旧FINALでは隼太が崖面の異変を感知する（虹彩が光る）予定だったが、
    作者裁定により削除。理由：感知と予知は異なり、下校時点で崩落を感じ取らせると
    予知能力に見え、能力設定と齟齬をきたすため。危険は土地柄の一般常識として提示し、
    隼太の受動性は『助けるという想像の即時否定』として描く。
  numbering_note: "話数は固定しない。EP03はSC09前後までを想定（作者方針）"
  open_items:
    - "canon側の番号・構成の更新"
    - "EP01への虹彩目撃の追加（mao_clue_ruling を正とする）"
  depends_on:
    - "WORLD_AND_RULE_CONFIG@1.0.0"
    - "Config@3.1"
    - "addressing_rules@1.0"
    - "ep03_structure@1.0"
  review_status: "draft"
  schema_version: "1.1.0"
