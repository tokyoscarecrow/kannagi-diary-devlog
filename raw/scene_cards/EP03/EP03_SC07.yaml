scene_id: "EP03_SC07"
title: "崩落"

time:
  relative: "SC06の直後。同日午後三時過ぎ〜夕方"
  part_of_day: "午後〜夕方（台風の最接近前。雨風は最も激しい時間帯へ向かう）"
location:
  primary: "崖沿いの道（土砂で寸断された経路）"
  secondary: "飯綱家（冒頭・ごく短く）／崖下の高齢者介護施設の前（クリフハンガー）"
  note: >
    ep03_structure.yaml の EP03-LOC-04（崖・高齢者介護施設周辺）に対応。
    SC06で四人が通った同じ道を、今度は崩れた状態で通る（読者に位置関係が既知である利点を使う）。

participants:
  - "飯綱隼太"
  - "大神みず葉"
  - "諏訪公命（クリフハンガーのみ・姿を見せる）"
  - "True North の面々（クリフハンガーのみ・遠景）"
notes_participants: >
  【確定】真魚はSC07・SC08とも登場しない。
  住吉も登場しない。隼太とみず葉の二人だけで道中を構成する。

purpose:
  story_role:
    - "崖の崩落が現実に起きる。危険が抽象から具体へ変わる"
    - "みず葉が祖母のもとへ向かう。SC06で置いた動機の回収"
    - "二次崩落。隼太が『大事なものを守る』ためだけに魔法を使う（SEED-1の配置）"
    - "施設に到着し、そこにトゥルーノースがいることを見せる（次話への引き）"
  emotional_role:
    - "警報から一転しての緊迫。日常が断ち切られる"
    - "みず葉の直情（止められない）と、隼太の追随"
    - "魔法使用の後ろめたさと安堵が同居する"
    - "ラストの不意打ち（なぜ彼らがここに）"

structure:
  phases:
    - phase: "連絡"
      description: "みず葉からの電話。崖が崩れた、祖母の施設が危ない。彼女はもう家を出ている"
    - phase: "追走"
      description: "隼太が追う。雨風の中の移動。普段の道が普段でなくなっている"
    - phase: "寸断"
      description: "土砂が道を埋めている。迂回路はない。みず葉が乗り越えようとする"
    - phase: "二次崩落"
      description: "斜面が再び崩れる。隼太がとっさに魔法を使い、みず葉を守る（SEED-1）"
    - phase: "到着（クリフハンガー）"
      description: "施設にたどり着く。そこに見覚えのある人影——トゥルーノースの面々、そして諏訪"

beats:
  - order: 1
    summary: "みず葉からの電話。崖が崩れた、祖母の施設のほうが危ない、と告げる。彼女はもう家を出ようとしている"
  - order: 2
    summary: "隼太が止めようとするが、みず葉は聞かない。隼太も家を出て、後を追う"
  - order: 3
    summary: "雨風の中を進む。SC06で歩いた道が、まったく別の場所のようになっている"
  - order: 4
    summary: "崖沿いの道が土砂で埋まっている。施設へ回る道は、ほかにない"
  - order: 5
    summary: "みず葉が土砂を乗り越えようとする。隼太が止めるが、間に合わない"
  - order: 6
    summary: "斜面が再び崩れる。隼太がとっさに魔法を使い、落下してくるものの動きを止めて、みず葉を守る【SEED-1：虹彩の明滅】"
  - order: 7
    summary: "二人とも無事。みず葉は礼も驚きも言わない（彼女は既に知っている）。隼太は使ってしまったことに動揺する"
  - order: 8
    summary: "【クリフハンガー】施設の前にたどり着く。そこに見覚えのある人影がいる。トゥルーノースの面々、そして諏訪"

cliffhanger:
  hook: >
    たどり着いた先に、いるはずのない人々がいる。読者は彼らが何者かを知っているが、
    なぜここにいるのかは分からない。隼太も同じ位置に立たされる。
  type: "不意打ち / 問いの提示"
  note: >
    この時点で彼らが何をしているか（救援活動）は書き切らない。
    姿を認めたところで切る。魔法を使う場面はSC08まで見せない。

key_information_revealed:
  - "崖が実際に崩落したこと"
  - "施設への経路が土砂で寸断されていること"
  - "隼太が『大事なものを守る』ときだけ魔法を使うこと（行動として提示）"
  - "トゥルーノースが災害現場に来ていること（理由は不明のまま）"
withheld_information:
  - "諏訪たちがなぜここにいるのか／何をしているのか（SC08で開示）"
  - "諏訪が魔法者であること（SC08の公然たる使用まで伏せる）"
  - "施設の避難状況・祖母の安否（SC08冒頭で開く）"
  - "諏訪が隼太の資料を見ていること（読者は知るが、隼太は知らない）"

tension:
  level: "High"
  score_start: 75
  score_end: 85

tone:
  - "緊迫"
  - "雨と土と風の物理的な重さ"
  - "魔法使用後の後ろめたさ"
  - "ラストの静かな異物感"

reincarnation_seeds:
  - id: "SEED-1"
    name: "虹彩の明滅（種1）"
    placement: "本SC。二次崩落からみず葉を守る瞬間"
    description: >
      隼太が魔法を使う。その瞬間、濃い茶色の虹彩が暗い緑に染まって明滅する。
    surface_read: "隼太が魔法を使ったサイン。読者は既にこの意味を知っている"
    rewatch_read: >
      真魚が父に見たのと同じ光であり、真魚がそれに気づけたこと自体が伏線。
      （※本SCに真魚は不在。ここでは光を『見せる』だけ）
    rule: >
      説明は一切書かない。読者に見せるだけ。
      虹彩について地の文で意味づけをしない（『魔法者の証である』等と書かない）。
      みず葉に驚かせない・言及させない（彼女は既に知っている）。

magic_and_rules:
  passive_sign_ruling:
    statement: "虹彩の明滅は魔法使用時のみ（裁定A）。本SCでは隼太の使用時にのみ描写する"
  shunta_magic_usage:
    statement: >
      隼太が魔法を使うのは『大事なものを守る』時のみ（ep03_structure rescue_constraints）。
    application:
      - "対象はみず葉ただ一人。他の誰かを救うために使わせない"
      - "能力は『質量を持つ物体の運動状態への干渉』。落下・崩落してくるものを止める／逸らす"
      - "無から何かを生み出さない（MR-01）。既にある運動に干渉するのみ"
      - "規模を大きくしない。崖全体を止めるような描写は禁止（能力の限界を守る）"
      - "使用後、隼太は安堵より先に『使ってしまった』という動揺を覚える"
  witness_control:
    statement: "この場を見ているのはみず葉のみ。第三者の目撃を作らない"
    rationale: "公的な発覚は隔離条件に触れる。みず葉は既に知る者であり、条件を満たさない"
  suwa_magic:
    statement: "諏訪たちは本SCでは魔法を使わない。姿を見せるのみ"

character_notes:
  izuna_shunta:
    - "短文・反応主体。危機下でも取り乱さない"
    - "止めようとするが、みず葉を止めきれない。追う以外の選択肢を持たない"
    - "魔法使用は反射的。考えて決断するのではなく、体が動く"
    - "使用後、周囲を見回す。誰かに見られていなかったかを確かめる仕草"
    - "呼称：みず葉＝『みず葉』"
  omiwa_mizuha:
    - "感情が先に出る。行動が先に出る。止まらない"
    - "祖母のこと以外、頭にない。隼太への配慮も一時的に消える"
    - "魔法で守られても驚かない・礼を言わない（既に知っている／それどころではない）"
    - "ただし後で、我に返って隼太を気遣う一瞬があってよい"
    - "呼称：隼太＝『隼太』"
  suwa_komei:
    - "クリフハンガーでの登場。姿を認めるだけ。台詞は不要、あっても最小限"
    - "この時点では何をしているか書き切らない"

addressing:
  shunta_to_mizuha: "みず葉"
  mizuha_to_shunta: "隼太"

prose_length:
  target_chars: 2600
  tolerance: "±400（2200〜3000）"
  note: >
    台詞主体を維持する。ただし追走・崩落の場面は動作描写が増えるため、
    地の文比率は70%前後まで許容する。緊迫感は短文の積み重ねで作る。
  texture_reference:
    narration_sentence_median: 16
    narration_sentence_max: 40
    narration_ratio: 0.70

meta:
  source: "EP03_episode_breakdown_FINAL.md の『崩落』（旧FINAL SC09）"
  structural_note: >
    本SCと次SCは前後編。SC07のクライマックスは『隼太が魔法を使う』
    （守るために・隠れて・一人で）、SC08のクライマックスは『諏訪たちが魔法を使う』
    （救うために・公然と・集団で）。同じ行為の対極的な二つの形を対置する構造。
    この対比を成立させるため、SC07で隼太に人助けをさせない。
  numbering_note: "話数は固定しない。EP03はSC08で完結予定（作者方針により変動可）"
  open_items:
    - "canon側の番号・構成の更新"
    - "EP01への虹彩目撃の追加（mao_clue_ruling を正とする）"
  depends_on:
    - "WORLD_AND_RULE_CONFIG@1.0.0"
    - "Config@3.1"
    - "addressing_rules@1.0"
    - "ep03_structure@1.0"
    - "EP03_SC06（警報とみず葉の連絡から直結）"
  review_status: "draft"
  schema_version: "1.1.0"
