scene_id: "EP03_SC08"
title: "善意の人たち"

time:
  relative: "SC07の直後。連続した時間"
  part_of_day: "夕方（日没が近い。暗くなりはじめる）"
location:
  primary: "崖下の高齢者介護施設およびその前庭・駐車場"
  secondary: "施設から避難所へ向かう経路の入口"

participants:
  - "飯綱隼太"
  - "大神みず葉"
  - "みず葉の祖母"
  - "諏訪公命"
  - "香取アンネ＝マリー"
  - "True North の面々"
  - "施設の職員・入居者（複数）"

purpose:
  story_role:
    - "トゥルーノースが『何をしているのか』の表層を明かす（救援活動をしている）"
    - "祖母との再会。みず葉が避難行に加わる理由を作る"
    - "諏訪の人間的な魅力を、行動によってもう一度提示する"
    - "避難路が塞がれ、行き詰まる（SC09の魔法披露の前提条件を作る）"
  emotional_role:
    - "安堵と困惑が同時に来る"
    - "読者だけが抱える不安（SC02の夜を知っている）"
    - "隼太の居心地の悪さ——彼らは善いことをしている。自分は何もしていない"
    - "ラストの絶望的な行き詰まり"

structure:
  phases:
    - phase: "再会"
      description: "施設内で祖母と再会。無事だが、避難は始まっている"
    - phase: "善意"
      description: "トゥルーノースが手際よく救援している。なぜここに、の答えが表層だけ明かされる"
    - phase: "同行"
      description: "みず葉が祖母に付き添い、避難行に加わる。隼太も行きがかりで手伝う側に立つ"
    - phase: "行き詰まり（クリフハンガー）"
      description: "避難路が塞がれている。倒木、土砂、増水した川、危険な橋。進めない"

beats:
  - order: 1
    summary: "駐車場でトゥルーノースの一人（香取）が隼太に気づく。中へ通される"
  - order: 2
    summary: "施設内。みず葉が祖母と再会する。祖母は無事。だが施設は浸水と停電の危険があり、避難が決まっている"
  - order: 3
    summary: "トゥルーノースがなぜここにいるのか、その表層が明かされる（避難の要請を受けて駆けつけた／近隣の活動の一環 等。魔法には一切触れない）"
  - order: 4
    summary: >
      避難の指揮を執っているのは施設の職員であり、トゥルーノースはその指示のもとで動いている。
      諏訪は仕切らない。だが手際がよく、判断が的確なため、職員が自然と彼を頼りはじめている
  - order: 5
    summary: "諏訪が隼太に短く声をかける。勧誘はしない。『手を貸してもらえますか』程度の実務的な言葉"
  - order: 6
    summary: "みず葉が祖母の車椅子に付き添い、避難行に加わる。隼太も流れで荷物を持つ側に立つ"
  - order: 7
    summary: "避難行が始まる。だが数百メートル進んだところで、行く手が塞がれている"
  - order: 8
    summary: "倒木が道をふさぎ、迂回先の川は増水し、橋は危険な状態。高齢者を連れて越えられる状況ではない。誰もが立ち尽くす"
  - order: 9
    summary: >
      【クリフハンガー】列の前方で誰かが動く。流木が橋を避けて逸れ、橋の周りの水位だけが
      押し下げられる。避難民が渡りはじめる。隼太とみず葉だけが愕然として動けない。
      事情を知らない祖母が『近ごろの橋はよくできてる』と呑気に言う

cliffhanger:
  hook: >
    避難路が塞がれた直後、明らかに人為ではない形で障害が取り除かれる。
    流木が逸れ、橋の周りの水位だけが押し下げられる。
    誰がやったのかは見せない。隼太とみず葉が愕然とするところで終わる。
  type: "危機の発生 → 異常の顕現"
  note: >
    【重要】実行者を特定させない。列の前方で誰かが動いた気配だけを示し、背中しか見せない。
    諏訪だと断定しない（SC09で明かす）。
    魔法という語も使わない。起きた現象だけを描写する。
    虹彩の明滅も描写しない（隼太の位置からは見えない）。
    結びは、状況を理解していない祖母の呑気な一言で落差を作る。
    緊張の只中に日常の声が入ることで、二人の沈黙が際立つ。

key_information_revealed:
  - "トゥルーノースが救援のためにここに来ていること（表層の理由のみ）"
  - "みず葉の祖母が無事であること"
  - "施設が避難を開始していること"
  - "諏訪が現場で信頼を得ていること"
  - "避難路が塞がれ、高齢者を連れて進めない状況にあること"
withheld_information:
  - "彼らが魔法者であること（SC09で公然たる使用として開示）"
  - "諏訪が隼太の資料を見ていること（読者は知るが隼太は知らない）"
  - "彼らが災害時に動く本当の理由・戦略的意図"
  - "諏訪が隼太を『こちら側』と見ていること（SC09のラストまで温存）"

tension:
  level: "High"
  score_start: 80
  score_end: 88

tone:
  - "安堵と不穏の同居"
  - "善意の手触り（そこに嘘がないこと）"
  - "隼太の居心地の悪さ"
  - "ラストの絶望"

magic_and_rules:
  passive_sign_ruling:
    statement: >
      本SCの大部分で魔法は使用されない。ラストのクリフハンガーでのみ、
      現象としての結果（流木が逸れる／水位が下がる）を見せる。
    rationale: "SC09の公然たる使用の衝撃を保つため、本編では徹底して『普通の善意の人々』として描く"
    application:
      - "本編中は魔法の気配を一切出さない"
      - "ラストでも実行者を特定させない／虹彩を描写しない／『魔法』の語を使わない"
      - "起きた現象だけを、隼太の視点から見えるとおりに書く"
  suwa_restraint:
    statement: "諏訪は勧誘しない。思想も語らない。実務的な言葉だけを話す"
    rationale: >
      正典指定『一人も説得していない。一言も勧誘していない。ただ目の前で正しいことを
      やってみせただけ』を厳守する。SC02で既に思想は語らせているため、ここでは反復しない。
    application:
      - "隼太への声かけは実務に限る（手を貸してほしい、こちらへ、等）"
      - "『こちら側』『選ばれた者』等の語を使わせない"
      - "隼太を特別扱いする素振りを見せない（資料を見たことを悟らせない）"
  shunta_participation:
    statement: >
      隼太は荷物を持つ・扉を押さえる程度の手伝いに留める。
      魔法は使わせない。人を救う主体にしない（EP03-INV-01『目撃のみ』）。
    rationale: "SC09で『諏訪たちが救い、隼太は見ているだけ』という構図を成立させるため"

character_notes:
  izuna_shunta:
    - "短文・反応主体。場に馴染めないまま、流れで手を動かしている"
    - "善いことをしている人々の中にいる居心地の悪さ。SC02の感覚の再来"
    - "だが今回は、その人々が実際に人を助けている。否定できない"
    - "呼称：みず葉＝『みず葉』／諏訪＝『諏訪さん』／香取＝『香取さん』"
  omiwa_mizuha:
    - "祖母との再会で一度感情が噴き出す。だがすぐに現実的な行動へ切り替わる"
    - "祖母の前では気丈に振る舞う"
    - "トゥルーノースへの警戒は、この状況では出しようがない（助けられている側）"
  mizuha_grandmother:
    - "口は達者。深刻ぶらない。孫を心配させまいとする"
    - "膝が悪く車椅子。自力で歩けない＝避難の困難の具体"
    - "悲劇的に描かない。生活者としての強さを持たせる"
  facility_staff:
    - "【重要】避難の責任者は職員である。ボランティアに指揮を明け渡さない"
    - "避難計画に沿って動いている。点呼、記録、誰がどこにいるかの把握"
    - "人手が足りず疲弊しているが、職業人としての判断は保っている"
    - "入居者一人ひとりの状態（持病・服薬・車椅子の要否）を把握している"
    - "トゥルーノースには感謝しつつ、任せきりにはしない"
    - "背景として処理しない。少なくとも一人は名前のある個人として描く（主任・介護福祉士など）"
  suwa_komei:
    - "仕切らない。職員の指示のもとで動く。それでいて誰よりも的確"
    - "指示は簡潔。声を荒げない"
    - "職員にも入居者にも敬意をもって接する。年配者への態度が特に丁寧"
    - "権威を奪わずに信頼だけを得ていく。その不気味さを、称賛せずに書く"
    - "隼太への態度は他の誰とも変わらない（＝特別扱いしない）"
  katori_anne_marie:
    - "現場では有能に動く。いつもの軽さは抑えめ"
    - "隼太に気づき、中へ通す役割。ただし絡みすぎない"
    - "呼称：隼太＝『隼太くん』／諏訪＝『諏訪様』"

addressing:
  shunta_to_suwa: "諏訪さん"
  suwa_to_shunta: "飯綱くん"
  katori_to_shunta: "隼太くん"
  katori_to_suwa: "諏訪様"
  shunta_to_mizuha: "みず葉"
  mizuha_to_shunta: "隼太"

prose_length:
  target_chars: 2600
  tolerance: "±400"
  note: "対話が成立する場面が多いため、台詞比率を30%前後まで戻す"

meta:
  source: "EP03_episode_breakdown_FINAL.md の『確信』（旧FINAL SC10）前半を分割"
  structural_note: >
    SC08とSC09は連続した一つのクライマックスを二分割したもの。
    SC08＝『善意の人々』の表層／SC09＝『魔法者たち』への反転。
    読者はSC02の夜（連れ去り）を知っているため、善行を見ながら不安を抱える。
    この宙吊りがSC08の緊張源。
  depends_on:
    - "WORLD_AND_RULE_CONFIG@1.0.0"
    - "Config@3.1"
    - "addressing_rules@1.0"
    - "ep03_structure@1.0"
    - "EP03_SC07（施設到着から直結）"
  review_status: "draft"
  schema_version: "1.1.0"
