scene_id: "EP03_SC09"
title: "確信"

time:
  relative: "SC08から連続。行き詰まった直後"
  part_of_day: "夕方〜日没（暗くなっていく。時間が敵になる）"
location:
  primary: "避難経路上（倒木・土砂・増水した川と橋）"
  secondary: "避難所の手前"

participants:
  - "飯綱隼太"
  - "大神みず葉"
  - "みず葉の祖母"
  - "諏訪公命"
  - "香取アンネ＝マリー"
  - "True North の面々（複数の魔法者を含む）"
  - "施設の職員・入居者（複数）"

purpose:
  story_role:
    - "諏訪たちが公然と魔法を使い、人々を救う。EP03のクライマックス"
    - "隼太の世界観を破壊する（隠すべきものを、彼らは堂々と使っている）"
    - "諏訪の完全勝利で章を閉じる。彼は誰も説得していない"
    - "答えを出さず、問いだけを残して宙吊りで終わる"
  emotional_role:
    - "恐怖ではなく高揚のピーク（EP02の恐怖のピークと対をなす）"
    - "隼太の茫然自失"
    - "『自分が抱えてきた恐怖は何だったのか』という問い"
    - "招待であり宣告でもある、諏訪の一瞥"

structure:
  phases:
    - phase: "決断"
      description: "打つ手がない状況で、諏訪が動く。誰にも相談せず、ためらいもなく"
    - phase: "披露"
      description: "トゥルーノースの面々が、人々の前で堂々と魔法を使い、障害を排除していく"
    - phase: "通過"
      description: "避難民が渡っていく。誰も咎めない。むしろ感謝される"
    - phase: "茫然"
      description: "隼太とみず葉が立ち尽くす。理解が追いつかない"
    - phase: "一瞥（クリフハンガー）"
      description: "諏訪が振り返る。その目に、揺るぎない確信の色がある"

beats:
  - order: 1
    summary: "行き詰まった現場。日没が迫り、雨は止まない。誰も動けない"
  - order: 2
    summary: "諏訪が前に出る。ためらわない。隠れもしない。人々の見ている前で"
  - order: 3
    summary: "倒木が動く。土砂が退く。トゥルーノースの何人かが、それぞれの能力で障害を排除していく"
  - order: 4
    summary: "危険な橋を、彼らが安全にする（あるいは別の渡り方を作る）。避難民が渡っていく"
  - order: 5
    summary: >
      人々は驚くが、恐れない。むしろ感謝する。誰も『化け物』とは言わない。
      施設の職員だけは事態を正確に理解し、言いかけて飲み込む。避難を優先する判断
  - order: 6
    summary: "隼太とみず葉が茫然と立ち尽くす。隼太は動けない（＝目撃のみ。加担しない）"
  - order: 7
    summary: "みず葉に促され、隼太は祖母の車椅子を運ぶ手伝いをする。身内を運びながら、視線は諏訪たちの側にある"
  - order: 8
    summary: "避難が完了に向かう。諏訪は最後まで現場に残っている"
  - order: 9
    summary: "【クリフハンガー】諏訪が振り返り、隼太を見る。何も言わない。その目には揺るぎない確信の色がある"

cliffhanger:
  hook: >
    諏訪が隼太の前に来て、自分の意志を言葉で表明する（テーマの提示）。
    返事を求めずに去り、一度だけ振り返る。招待であり、宣告でもある目。
    隼太には問いだけが残る。
  type: "テーマの提示 / 問いの提示 / 宙吊り"
  note: >
    【厳守】ここで章を閉じる。答えを出さない。隼太に決意させない。
    諏訪は意志を語るが、隼太に同意・参加・返事を求めない。語り終えたら、それ以上何も言わずに去る。
    余韻の説明を書かない。

key_information_revealed:
  - "諏訪たちが魔法者であること（公然たる使用による開示）"
  - "彼らが隠すことなく魔法を使い、人を救うこと"
  - "一般の人々が、それを受け入れ、感謝すること"
  - "諏訪が隼太を見ていること（＝隼太が『見られている』側であること）"
withheld_information:
  - "諏訪の能力の正体（プラズマ系は未確定・温存。本SCでは断定させない）"
  - "諏訪が隼太の資料を見ていたこと（隼太は知らない。諏訪はパッシブ感知を根拠として語る）"
  - "この公然使用がもたらす結果（当局の反応・アメダス検知はEP04へ）"
  - "諏訪の変質（神との再接続）"
  - "隼太がどう動くか（答えを出さない）"

tension:
  level: "Peak"
  score_start: 88
  score_end: 92
  note: >
    EP02のピーク（95・恐怖）と対をなす、高揚のピーク。
    収束させない。上昇したまま宙吊りで章を閉じる（EP03-INV-03）。

tone:
  - "高揚"
  - "畏怖"
  - "美しさと恐ろしさの同居"
  - "取り残される感覚"

magic_and_rules:
  suwa_faction_magic:
    statement: "諏訪たちは公然と魔法を使う。人前で、堂々と、当たり前のように"
    application:
      - "複数の魔法者がそれぞれ異なる能力を見せる（系統の多様性を示す）"
      - "MR-01遵守：無から現象を生み出さない。既にあるものの運動・流れに干渉する"
      - "倒木を動かす、土砂を退ける、水流を制御する等、既存の物理現象への干渉に限る"
      - "虹彩の明滅を描写する（魔法使用時のみ＝裁定A）。ただし一般人は気づかない"
      - "諏訪自身の能力は断定的に描かない（プラズマ系は温存。彼は主に差配し、決定的な一撃は見せない、または曖昧に処理する）"
  mr02_compliance:
    statement: >
      諏訪は言葉と体験だけで働きかける。魔法による心理操作は一切ない（MR-02）。
    application:
      - "隼太への言葉は意志の表明に限る。同意・参加・返事を求めない"
      - "勧誘の定型（仲間になれ／こちらへ来い）を言わせない"
  author_ruling_suwa_statement:
    statement: >
      【作者裁定】最終話で諏訪は、自分の意志を言葉で明確に隼太へ伝える。これはテーマの提示である。
      ただし隼太に答えを求めてはならない。
    reconciliation: >
      正典FINALおよび ep03_structure EP03-INV-02『誰も説得せず』との関係：
      『説得』＝相手の同意を求める行為、『表明』＝自分の信念を差し出す行為として区別する。
      諏訪は表明するが、説得はしない。INV-02の趣旨（正しさで追い詰める）は維持される。
    content_points:
      - "隼太が守るために力を使ったことを肯定する（責めない）"
      - "その後に周囲を確かめた隼太の習い性を指摘する"
      - "『隠せ・使うな・見られたら終わり』という教えへの疑義"
      - "今日、誰も逃げず、誰も化け物と呼ばなかったという事実"
      - "力は使うためにある／誰かが前に立たねばならない（導く者の思想）"
      - "力を持って生まれたことを一度も恥じたことがない（隼太の self_view との対極）"
      - "『一度も恥じたことがない』の一言で締め、それ以上は語らずに立ち去る（答えを求めない）"
    knowledge_source_note: >
      諏訪が隼太の魔法使用を知る根拠はパッシブ感知（魔法による自然の乱れの相互探知）とする。
      盗んだ資料の存在は引き続き隼太に悟らせない。
  shunta_non_participation:
    statement: >
      【最重要・EP03-INV-01】隼太は『目撃』に留まる。加担しない。
      ただし完全な硬直は不自然なため、みず葉に促されて祖母を連れ出す手伝いはさせる。
    rationale: >
      『加担』はEP04へ繰り越す。ここで魔法を使わせる／他人を救わせると早すぎる。
      一方、祖母が目の前にいる状況で一切動かないのは人物として不自然。
      動機が『みず葉と祖母』に閉じていれば、SC07でみず葉を守ったのと同じ圏内であり、
      加担には当たらない。
    allowed:
      - "みず葉に言われて車椅子を押す／祖母に付き添う"
      - "身内を運ぶための物理的な手伝い"
      - "促されて動く（受動的であること）"
    prohibited:
      - "魔法を使うこと"
      - "見知らぬ他人を救うこと"
      - "諏訪たちの救援作業に加わること"
      - "自発的に『助けよう』と動き出すこと"
    structural_effect: >
      他人を救っている集団の横で、自分の身内だけを運んでいる——
      この構図が隼太の立ち位置を際立たせる。彼は『救う側』ではなく
      『守る側』に留まっており、その差が本人にも読者にも見えている状態を作る。
    application:
      - "魔法披露の最中は動かない。茫然と見ている"
      - "動くのは、みず葉に促されたときだけ"
      - "手伝いながらも、視線は諏訪たちの側に向いている"
  isolation_rule_note:
    statement: >
      公然使用は隔離条件（第三者への発覚）に真正面から触れる行為である。
      隼太がその危険性を理解しているからこそ、衝撃が生じる。
      ただし地の文で制度を説明しない。隼太の反応として示す。
    witness_note: >
      施設の職員は、公的な立場にある正気の目撃者であり、
      『発覚』の条件を満たしうる存在。この事実は本SCで説明しないが、
      職員が事態を理解した顔を見せることで、読者に帰結を予感させる。
      当局の反応・アメダス検知はEP04へ繰り越す。

character_notes:
  izuna_shunta:
    - "【最重要】魔法披露の最中は動けない。一歩も。手を出さない"
    - "動くのは、みず葉に促されて祖母を運ぶときだけ（受動的に動く）"
    - "身内を運びながら、視線は諏訪たちの側に向いている"
    - "理解が追いつかない。『なぜ』が処理できない"
    - "生涯隠してきたものを、目の前で堂々と使われている。しかも人が救われている"
    - "『では、僕が抱えてきた恐怖は何だったのか』——この問いを、説明せずに出す"
    - "感情を言語化しすぎない。短い断片で処理する"
  omiwa_mizuha:
    - "隼太の隣で同じく茫然とする"
    - "彼女は隼太の秘密を知る唯一の人物。だからこそ、この光景の意味が分かってしまう"
    - "祖母の手前、取り乱さない。だが隼太の顔を見る"
  suwa_komei:
    - "ためらいがない。恐れがない。恥じていない"
    - "英雄的に描かない。当たり前のことをしている顔で行う"
    - "声を荒げない。指示は簡潔"
    - "隼太の前に来て、穏やかに意志を語る。説き伏せる響きを持たせない"
    - "語り終えたら返事を待たずに去る。一度だけ振り返る。その目が確信している"
  katori_anne_marie:
    - "魔法者ではない（magic_user: false）。彼女は魔法を使わない"
    - "誘導・伝達・人の世話といった実務で動く"
    - "隼太の反応を見ている（が、何も言わない）"
  true_north_members:
    - "複数の魔法者。それぞれ異なる系統の能力を持つ"
    - "得意げでない。淡々としている。これが日常であるかのように"
  facility_staff:
    - "【重要】公然たる魔法使用の、最も正気で責任ある目撃者"
    - "入居者と違い、状況を正確に理解できる立場にある。だから反応が重い"
    - "最初は理解を拒む。次に、目の前の結果（道が開いた）を受け入れざるを得なくなる"
    - "『今のは』と言いかけて、避難を優先して飲み込む——職業人としての判断"
    - "恐れるより先に、入居者を通すことを考える。その優先順位が彼らの職業倫理"
    - "後で問題になることを分かっている顔をさせてよい（当局への報告義務など。ただし説明しない）"
  civilians:
    - "入居者。驚くが、恐れない。感謝する"
    - "『助かった』という実感が、理解を追い越す"
    - "誰も『化け物』と言わない。この反応が隼太の世界観を壊す"
    - "高齢者ゆえの反応の鈍さに逃げない。分かったうえで受け入れる者も混ぜる"

addressing:
  shunta_to_suwa: "諏訪さん"
  suwa_to_shunta: "飯綱くん（※本SCでは呼ばせない可能性が高い）"
  shunta_to_mizuha: "みず葉"

prose_length:
  target_chars: 3000
  tolerance: "±500（2500〜3500）"
  exception_note: >
    【要作者承認】EP03のクライマックスかつ最終話のため、通常基準を超える。
    分量は演出の必要に応じて判断する。
  note: >
    魔法披露の場面は畳みかける。短文の連続で速度を作る。
    隼太の内面は最小限の断片で。説明的な長文を置かない。

meta:
  source: "EP03_episode_breakdown_FINAL.md の『確信』（旧FINAL SC10）後半"
  structural_note: >
    正典の指定を厳守する。
    ・隼太はまだ何もしていない。手を汚していない。加担していない。だがもう見てしまった
    ・諏訪は一人も説得していない。ただ目の前で正しいことをやってみせただけ
    ・最も恐ろしい敵は、暴力ではなく『正しさ』で殴ってくる敵である
    ・諏訪は迷っていない、恐れていない、恥じていない。隼太が生涯抱えてきた恐怖と葛藤を、彼は持っていない
    ・『振り返る』——招待であり宣告でもある目
    ・答えは何一つ出ていない。示されたのは問いだけ
  ep_closing_note: >
    本SCでEP03が完結する（全9話）。EP04へ繰り越すもの：
    隼太が自ら魔法を使って人を救う／アメダス検知の説明／明神の疑惑と来訪／
    隼太の揺らぎ（不安・動揺・そしてわくわく感）。
  open_items:
    - "ep03_structure.yaml EP03-INV-02 の文言を『説得はせず、意志を表明し、正しさで追い詰める』に更新"
    - "canon側の番号・構成の更新（全9話）"
    - "EP01への虹彩目撃の追加（mao_clue_ruling を正とする）"
  depends_on:
    - "WORLD_AND_RULE_CONFIG@1.0.0"
    - "Config@3.1"
    - "addressing_rules@1.0"
    - "ep03_structure@1.0"
    - "EP03_SC08（行き詰まりから直結）"
  review_status: "draft"
  schema_version: "1.1.0"
