scene_id: "EP04_SC01"
title: "限界団地"
status: "draft"
schema_version: "1.1.0"

time:
  relative: "EP03の台風・老人ホーム救援後。真魚の調査はEP03_SC05から継続"
  part_of_day: "隼太の日常パート／真魚の深夜"
  exact_date: "未指定"
location:
  primary: "真魚の自室"
  secondary: "隼太の日常生活空間（詳細未指定）"
  on_screen: "インターネット動画に映った古い団地"

participants:
  - "氷川真魚"
  - "飯綱隼太（短い日常パート）"

continuity_from_ep03:
  source_scenes:
    - "EP03_SC04『二人の父』"
    - "EP03_SC05『香取桃子』"
  known_facts:
    - "真魚はEP02の時点から、父が魔法使用を理由に隔離されていると認識し、父を取り戻すために行動している"
    - "EP03_SC04の真魚とみず葉の対話はすでに終わっている。SC01で対話を再演しない"
    - "みず葉は隼太が幼少期に経験した『再教育』について語り、真魚に『古い団地のような場所』という手掛かりが伝わった"
    - "EP03_SC05の真魚パートで、その言葉を手掛かりにインターネット検索を開始している"
  sc01_start_condition: >
    真魚はすでに探索を始めており、本SCはその継続中から描く。
    検索を始める決断や、みず葉から情報を聞く場面を改めて描かない。
  information_boundary: >
    真魚が得たのは隔離施設の所在地や正式名称ではなく、外観・環境についての
    断片的な情報。新たな証言、現地の内部資料、確定的な所在地情報を
    EP03からの既知情報として追加しない。

purpose:
  story_role:
    - "EP03の非日常から、いったん日常へ戻す"
    - "EP03_SC05で始めた真魚の調査を進め、隔離施設の候補となる建物を発見させる"
    - "SC03の単独現地探索につながる対象と、現地で確認するという真魚の次の行動を提示する"
    - "真魚の執念と、自ら調べて判断する主体性を行動で見せる"
    - "SEED-2『団地での確信』の第一段階を配置する"
  emotional_role:
    - "隼太：老人ホームで見た光景と諏訪の言葉が、日常の中に残っている"
    - "真魚：繰り返す探索の疲労・焦燥から、発見への集中に移る"
    - "読者：何気ない団地動画に潜む不審さを感じる"

structure:
  phases:
    - phase: "日常への回帰（短く）"
      description: >
        隼太は以前の日常に戻ろうとしている。しかし老人ホームで見た諏訪たちの
        公然たる救援が頭から離れず、不安と認めたくない高揚が残る。
        自分が人々を魔法で救ったという誤った回想は置かない。
    - phase: "継続する探索"
      description: >
        深夜、真魚は以前から続けている団地関連の検索と動画視聴を進める。
        探索の発端はEP03で描写済みとして、説明や再演をしない。
    - phase: "異物の発見"
      description: >
        古い団地を映した動画に、周囲の住棟とは様子の異なる一棟が映る。
        他の住棟には生活の気配があるが、その棟だけが封鎖されている。
        真魚は再生を止め、巻き戻して確かめる。
    - phase: "疑念から現地調査の決意へ（クリフハンガー）"
      description: >
        みず葉から聞いた『古い団地のような場所』という情報と映像を重ねるが、
        一棟が異質である以外の材料はない。真魚は一度だけ映像を見直す。
        その建物が隔離施設だと結論づける代わりに、自分の目で確かめに行くと決める。
        決意は具体的な行動の予約として置き、現地での発見・確信はSC03に残す。

beats:
  - order: 1
    summary: >
      隼太の日常回帰を短く描く。老人ホームの救援と諏訪の言葉が心に残り、
      平穏のはずの時間に一瞬の揺らぎが生じる。
  - order: 2
    summary: >
      隼太はすぐに結論を出さず、目の前の生活に意識を戻す。
      EP04で自ら魔法を使って他人を救う決意や行動には進まない。
  - order: 3
    summary: >
      深夜、真魚はすでに続けているインターネット調査に没頭している。
      団地に関する動画をいくつも確認するが、父の居場所に直結するものはない。
  - order: 4
    summary: >
      古い団地を取材した一般投稿者の動画に行き当たる。
      投稿者は施設の秘密を知らず、団地の日常を紹介しているにすぎない。
  - order: 5
    summary: >
      同じ団地の一棟だけが封鎖されているのを見つける。
      真魚は動画を停止し、短く巻き戻して確認する。
  - order: 6
    summary: >
      みず葉から得た『古い団地のような場所』という言葉を思い出す。
      封鎖棟は気になるが、それだけでは隔離施設の証拠にならない。
      この場で動画の細部を調べ尽くしたり、警備や管理状況を確定したりしない。
  - order: 7
    summary: >
      真魚は別の動画へ移ろうとして、封鎖棟の映像に一度だけ視線を戻す。
      引っかかりは説明せず、指が止まるなど短い動作で示す。
  - order: 8
    summary: >
      【クリフハンガー】真魚は封鎖棟が何なのか結論を出せない。
      画面越しでは分からないと判断し、その場所へ行き、自分の目で確かめると決める。
      日程・侵入方法・現地の状況をこの場で描写せず、次の行動の予期で終える。

cliffhanger:
  hook: >
    ありふれた団地紹介動画の中に、一棟だけ封鎖された建物がある。
    真魚は違和感を覚えるが、画面では正体を確かめられない。
    だからこそ、現地に行って確かめると決める。
  type: "発見／未解決の疑念／次の行動の予約"
  note: >
    『ここに父がいる』という断定・確信には進まない。
    行動の決意そのものをSC01の引きとし、調査の実行と確信はSC03に残す。
    SEED-2の意味を地の文で説明しない。締めくくりに安堵や解決感を置かない。

key_information_revealed:
  - "EP03から続く真魚の探索に、具体的な候補地が現れたこと"
  - "動画内の古い団地には、ほかと異なり封鎖された一棟があること"
  - "真魚がその棟に引っかかりを覚え、現地で確かめると決めること"
withheld_information:
  - "封鎖棟が実際に隔離施設であることの確証"
  - "氷川総一郎の現在の所在地・安否"
  - "隔離施設の内部と警備の詳細（SC03で外観・警備の一部を示す）"
  - "真魚が現地で抱く確信と潜在能力の関係（SEED-2の再解釈）"

tension:
  score: 50
  note: "EP03の高揚から日常に戻り、真魚の発見で静かに不穏さを残す"

tone:
  - "日常への回帰"
  - "孤独な探索"
  - "静かな焦燥"
  - "発見の予感"

foreshadowing:
  id: "SEED-2"
  name: "団地での確信"
  placement: "動画の封鎖棟が気にかかり、現地で確かめようとする（SC01では確信しない）"
  surface_read: >
    EP03で得た証言と不自然な封鎖棟を結びつけ、実地調査を選ぶ真魚の執念と推理。
  rewatch_read: >
    後に潜在能力との関係を読み直せる余地を残す。
    ただし現段階では超常的感知として断定しない。
  restrictions:
    - "虹彩明滅を描写しない"
    - "パッシブ感知を明示しない"
    - "新たな超常現象や情報入手経路を追加しない"
    - "表層の手掛かりだけでも真魚の行動が成立するようにする"

magic_and_rules:
  - "WORLD_AND_RULE_CONFIG@1.1.1を参照"
  - "EP04で隼太はアクティブ魔法を使用しない"
  - "真魚の第四類潜在能力は本SCでは発現しない"

character_notes:
  izuna_shunta:
    - "老人ホームで諏訪たちの救援を目撃した。自身は加担していない"
    - "恐怖だけでなく認めたくない高揚も残るが、結論は出さない"
  hikawa_mao:
    - "父の居場所を自力で探し続ける目的意識はすでに成立している"
    - "感情の説明よりも、検索・停止・短い巻き戻し・行動の決定で示す"
    - "独り言・内心は自然な常体（Config v3.2.1）。対人会話の敬語原則は維持する"
    - "SC01の時点で超常的な能力を自覚・使用しない"

prose_direction:
  pov:
    opening: "隼太（短く／暫定案）"
    main: "真魚"
    ending: "真魚"
  rules:
    - "みず葉と真魚のEP03_SC04の会話を再現しない"
    - "EP03_SC05の調査開始を繰り返さない"
    - "隼太パートはSC02の役割を奪わない"
    - "動画の情報だけで施設の所在地や正体が確定したように書かない"
    - "封鎖棟発見後の動画検証を長引かせず、具体的な確認行為はSC03に送る"
    - "結末は『確信』でなく『現地へ確かめに行く決意』。次の行動を予期させて閉じる"
    - "真魚の独り言や内心に対人用の敬語を強制しない"
    - "伏線を解説しない。読者が不自然さを感じる描写に留める"

