scene_id: "EP04_SC02"
title: "日常という名の"
status: "draft"
schema_version: "1.1.0"

time:
  relative: "SC01の翌日"
  part_of_day: "隼太＝学校（日中）／明神＝同日夕方〜終業後／桃子＝同じ場面の末尾"
  exact_date: "未指定"
location:
  primary: "六ッ川高校（2年2組の教室ほか）"
  secondary: "南関東厚生地方局のオフィス"
  note: "局内の部署名は記さない（WORLD v1.1.1：部署名称の齟齬回避）"

participants:
  - "飯綱隼太（前段）"
  - "住吉奨太郎（前段）"
  - "クラスメイト複数（前段）"
  - "明神明（後段）"
  - "日吉拓哉（後段・明神の上司／統括官）"
  - "香取桃子（＝香取アンネ＝マリーの潜入時の通名。末尾のみ）"

continuity_from_sc01:
  known_facts:
    - "SC01で隼太は、自宅の机で老人ホームの光景と諏訪を思い出し、恐怖と『別の感覚』が混じることを一度自覚している"
    - "SC01の真魚は封鎖棟のある団地名をノートに書き写し、『行ってみよう』と決めた。実行はSC03"
  sc02_role_boundary: >
    隼太の揺らぎはSC01で一度提示済み。SC02は『回想して揺らぐ』を繰り返さず、
    人目のある日常の中で、身体に染みついた『隠す』習慣と、隠さなかった諏訪の記憶が
    ぶつかる形で示す（回想から反射へ、焦点を移す）。

purpose:
  story_role:
    - "隼太の『日常』が、隠すことの上に成り立っていることを行動で見せる"
    - "アメダス（魔法使用監視）の存在と、荒天下で機能不全だった事実を制度の内側から提示する（EP03からの繰り越し）"
    - "老人ホームの『怪情報』を当局が把握し、確証を持てないまま処理する様子を見せる（PREM-02）"
    - "SC04の明神の疑惑訪問への導線を引く"
    - "厚生局の情報が香取桃子に触れる瞬間を置く（SC04の部室報告への導線）"
  emotional_role:
    - "隼太：何も起きない日常の中の小さな引っかかり。不安と、認めたくない引力"
    - "明神：制度の内側の冷たさ（読者に怒りの燃料を溜める不在シーン）"
    - "末尾：日常のトーンの下で、見えない網が動き始める不穏"

structure:
  arrangement: "隼太→明神→桃子の順に一度ずつ置く。交互に切り替えない"
  phases:
    - phase: "前段：日常（隼太）"
      description: >
        教室の何気ない時間。目の前で物が落ちる・倒れる場面に居合わせ、
        止められる位置にいながら止めない。身体の反射と、それを押しとどめる習慣。
    - phase: "後段1：記録（明神）"
      description: "台風当夜の観測記録が、誤検知で埋め尽くされ使い物にならないことが業務会話で示される"
    - phase: "後段2：怪情報（明神×日吉）"
      description: "老人ホームの避難時の不可解な目撃談が上がっている。日吉は確証のなさを理由に事を収めようとする"
    - phase: "後段3：明神の目"
      description: "明神は指示に従いつつ、現場の位置が自分の監視対象の生活圏にあることに目を留める"
    - phase: "末尾：傍受（桃子）"
      description: "近くの席で事務作業をしていた桃子の手が、一拍だけ止まる"

beats:
  # ---- 前段：隼太 ----
  - order: 1
    summary: "SC01の翌日、学校。住吉の軽口など、いつもどおりの教室の空気"
  - order: 2
    summary: >
      近くで物が落ちる・倒れる（例：花瓶、積んだ荷物など。物は本文判断）。
      隼太の指がわずかに動くが、止めない。物は落ち、ちょっとした騒ぎになって、すぐ日常に戻る
  - order: 3
    summary: >
      隼太は反射的に周囲の視線を確かめる（染みついた習慣）。
      その直後、人前でためらわなかった諏訪たちの姿と『一度も恥じたことがない』がよぎる
  - order: 4
    summary: "隼太は何事もなかったように振る舞う。住吉にからかわれて受け流す。結論は出さない"
  # ---- 後段：明神 ----
  - order: 5
    summary: >
      同日夕方、南関東厚生地方局。明神が台風当夜の観測記録を確認している。
      記録は大量の誤検知で埋まり、どこで何があったのか判別できない
  - order: 6
    summary: >
      政府が魔法の使用を検知する仕組み（気象観測の名目で運用・通称アメダス）を
      運用していることを、明神視点の地の文で短く示す（原理・範囲・精度には触れない）。
      荒天の夜は攪乱されて機能しないことは、日吉との業務上のやりとりで示す
  - order: 7
    summary: >
      老人ホームの避難時の目撃談（怪情報）が上がっている。内容は現象の断片のみ
      （例：倒木がひとりでに動いた／避難者の周りだけ風が弱まった）。誰がやったかは含まない
  - order: 8
    summary: >
      日吉は、荒天の夜であること・証言者の多くが高齢の入居者であることを理由に、
      確証なしとして穏便に処理する方向を示す。明神は異を唱えず、指示どおり処理する
  - order: 9
    summary: "処理の手を止めず、明神は現場の位置を確認する。自分の監視対象（隼太）の生活圏の内側にある"
  # ---- 末尾：桃子 ----
  - order: 10
    summary: >
      【クリフハンガー】フロアの端で、地味なメガネの事務員・香取桃子が入力作業を続けている。
      髪に隠れた片耳のイヤホンから、明神の机のあたりの会話を盗聴している。
      『老人ホーム』の語のところで、キーを打つ指が一拍だけ止まり、また何事もなかったように動き出す

cliffhanger:
  hook: >
    誰も気に留めない事務員の指が、一拍だけ止まる。
    厚生局の内側の情報が、どこかへ流れ出す気配で終わる。
  type: "不穏の予感／情報の流出"
  note: >
    桃子が誰に何を伝えるかは描かない（忠誠の向きを示さない／ep04_structure INV-04）。
    諏訪の名も出さない。報告の場面はSC04に残す。

key_information_revealed:
  - "隼太は、止められた落下物を止めない。人目を確かめる習慣が身体に染みついている"
  - "国家は気象観測網を使って魔法の『使用』を監視している（通称アメダス）。隼太はこれを知らない"
  - "台風当夜、アメダスは荒天による大量の誤検知で機能していなかった"
  - "老人ホームの避難時の不可解な目撃談が当局に上がっている"
  - "当局（日吉）は確証なしとして穏便に処理する"
  - "明神は、現場が隼太の生活圏にあることに目を留めた"
  - "香取桃子は厚生局で、明神の机のあたりの会話を盗聴している（盗聴の手段の詳細は描かない）"
withheld_information:
  - "誰が老人ホームで魔法を使ったか（目撃談に当事者の特定を含めない）"
  - "隼太の魔法使用（みず葉の防衛）が記録に残ったかどうか（機能不全で確定不能）"
  - "明神が諏訪・True Northについて何を知っているか（SC04の動揺まで伏せる／ep04_structure OI-06）"
  - "桃子の情報の行き先と、彼女の忠誠の向き"
not_to_be_written:   # 正典上未確定のため、withheld ではなく本文で触れない事項
  - "アメダスの検知原理・検知できる規模や範囲・位置特定精度（WORLD unresolved_details）"
  - "四類による検知精度の違い（同上）"
  - "検知後の行政側の具体的な対応手順（同上）"
  - "探知専任の魔法者の存在（WORLD reserved_plot_option＝HOLD／canon: false）"

# 安全弁チェック:
#   □ 危機シーンではないため『実は安全』の配置問題は該当しない
#   □ 誤認の構造（IM-NL-002）: 日吉＝怪情報を荒天と高齢者の見間違いとして処理（意図的に目をつぶる）／
#     明神＝処理しつつ疑念を保留／隼太＝自分が当局にどう見えているかを知らない／
#     読者＝誰がやったかを知っている（EP03で目撃）。読者の情報優位が不穏を生む

tension:
  score: 40
  note: "日常のトーンの下に、見えない網が動き始める。構成書の値に準拠"

tone:
  - "日常の明るさ（前段）"
  - "事務的な冷たさ（後段）"
  - "静かな不穏（末尾）"

foreshadowing:
  - "明神が隼太の生活圏に目を留める → SC04の疑惑訪問"
  - "桃子の指が止まる → SC04のTrue North部室での報告"
  - "日吉の事なかれ処理 → 体制の構造悪（誰も悪くないのに体制は間違う）"

magic_and_rules:
  - "WORLD_AND_RULE_CONFIG@1.1.1を参照"
  - "EP04で隼太はアクティブ魔法を使用しない（beat 2の落下物は止めない）"
  - "虹彩の明滅は描写しない"
  - "明神・日吉・桃子は非魔法者"

character_notes:
  izuna_shunta:
    - "SC01の自覚を繰り返さない。回想ではなく、日常の中の反射と習慣で揺らぎを見せる"
    - "感情を名指ししない。指の動き、視線の確認、受け流す一言で示す"
    - "反芻の対象は目撃と諏訪の言葉に限る（他人を救った実感は存在しない／PREM-01）"
  sumiyoshi_shotaro:
    - "日常の空気を担う。茶化し・軽口。事情は何も知らない"
    - "からかいは日常の発想の範囲に留める（突飛な比喩・ネタで笑いを取りにいかない）"
  myojin_akira:
    - "上司に対しては丁寧語。事務的で抑揚が少ない（Config v3.2.1 speech_style）"
    - "日吉の事なかれ判断に異を唱えない。規則と指示に従う。だが処理の手つきの中で、自分の目は手放さない"
    - "内心の評価を地の文で説明しない。視線と手の動きで、疑念の保留を見せる"
  hiyoshi_takuya:
    speech_style:   # Config v3.2.1：政府側人物の口調はScene Cardで確定した範囲のみ適用
      status: "approved（作者承認 2026-11-09）"
      basis: "kannnagi_chara_data.xlsx：役人気質、保守的、不都合な事実に目をつぶりがち、穏やかな善人、マジメ、事なかれ主義"
      traits:
        - "穏やかで物腰が柔らかい"
        - "断定を避け、波風を立てない言い回し"
        - "判断の根拠を『確証のなさ』や手続きに預ける"
      examples:
        - "まあ、台風の晩のことだからね"
        - "確かなものが出てこないなら、そういうことでいいんじゃないかな"
      forbidden:
        - "悪意・威圧（善人である）"
        - "コメディ的な誇張（本SCは制度の冷たさを担う）"
  katori_momoko:
    - "香取アンネ＝マリーの潜入時の姿。地味なメガネの事務員。誰も気に留めない『いない人』"
    - "台詞なし。表情も変えない。盗聴していることはイヤホンで明示し、反応は指が一拍止まることのみ"
    - "誰に連絡するか、何を持ち出すかは描かない"

addressing:   # addressing_rules未登録。本SCで確定し、addressing_rules へ追加する
  status: "approved（作者承認 2026-11-09）"
  myojin_to_hiyoshi: "統括官"
  hiyoshi_to_myojin: "明神くん"

prose_direction:
  pov:
    opening: "隼太"
    main: "明神"
    ending: "桃子の外側から（短く、カメラ的に）"
  rules:
    - "アメダスを説明台詞で解説しない。存在は明神視点の地の文で短く示し、機能不全は業務の会話と記録の画面で分からせる"
    - "【話者明示】シーン冒頭、および視点・場面の切り替え直後の最初の台詞は、台詞より前に話者を特定できるようにする"
    - "not_to_be_written の事項に一切触れない"
    - "怪情報に当事者の特定を含めない。True Northの名も出さない"
    - "隼太パートでSC01の回想を再演しない"
    - "桃子の場面は短く。忠誠の向きを匂わせる描写（安堵・決意・連絡先）を書かない"

