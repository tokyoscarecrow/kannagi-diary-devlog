# ==========================================================
# SCENE CARD TEMPLATE  —  L4 シーンカード標準スキーマ
# Project: Kannagi Diary
# Version: 1.1.0
# Encoding: UTF-8 (LF, BOMなし) ※Shift_JIS禁止
#
# 目的:
#   EP02で混在した3つのラップ形式（scene:[] / scenes:[] / flat）を
#   flat単一に統一し、第三章以降の全シーンカードの基準とする。
#   EP02の優れた設計（緊張スコア、情報統制、phases分離）を継承しつつ、
#   RD-01で判明した「致死性情報の配置ミス」を構造的に防ぐ。
#
# CHANGELOG:
#   v1.1.0 — EP03検証で判明した4要素を追加（既存フィールドは不変・後方互換）:
#     + cliffhanger（必須）：各SCのラストの引き
#     + tension を score_start / score_end に拡張（話内変動を表現）
#     + reincarnation_seeds（任意）：周回の種。通常のforeshadowingと区別
#     + dual_line（任意）：2ライン交互進行のライン標識
#   v1.0.0 — flat統一・情報統制セクション新設
#
# GLOBAL_CONFIG 準拠:
#   - SCG-001〜005（Scene Card粒度・役割・境界の保護）に従う
#   - IM-NL-001/002（仕掛け・誤認は構造条件として明示）に従う
#   - 1カード=1つの明確な役割（複数大型機能の圧縮禁止）
#
# 記法:
#   <必須> = 必ず埋める  / <任意> = 該当時のみ  / # 例: = 記入例
# ==========================================================

# ---- 識別 ----
scene_id: "EP03_SC01"          # <必須> EP番号_SC番号。命名規則を全EPで統一
title: ""                      # <必須> シーンの主題（短く）

# ---- 時空間 ----
time:                          # <必須>
  relative: ""                 #   物語内の相対時間。例: "文化祭から1週間後"
  part_of_day: ""              #   <任意> 例: "放課後" "夜"
location:                      # <必須>
  primary: ""                  #   主舞台。固有名詞は proper_noun_registry 準拠
  secondary: ""                #   <任意> 副舞台
  # tertiary: ""               #   <任意> 必要時のみ追加

# ---- 登場人物 ----
participants:                  # <必須> このシーンに出る人物
  - ""                         #   表記は proper_noun_registry 準拠（飯綱隼太 等）
  # 群衆は "クラスメイト複数" のように役割で記す

# ---- 目的（このカードの存在理由）----
purpose:                       # <必須>
  story_role:                  #   <必須> 物語上の機能（複数可）
    - ""
  emotional_role:              #   <必須> 感情・トーン上の機能（複数可）
    - ""

# ---- 構造フェーズ（任意：緊張の高いカードで使用）----
structure:                     # <任意> EP02ではSC04以降で使用
  phases:                      #   起承転結や緊張曲線を持つカードに有効
    - phase: ""                #   例: "静" "誤認" "発動" "違和感"
      description: ""

# ---- 2ライン交互進行（任意：EP03 SC04〜07で使用）----
dual_line:                     # <任意> 1話で2つの筋を交互に進める場合のみ
  # 使わないカードでは丸ごと省略する
  line1:
    label: ""                  #   例: "みず葉 × 真魚"
    beats: []                  #   このラインに属する beat の order番号
  line2:
    label: ""                  #   例: "明神 × 隼太"
    beats: []
  interplay: ""                #   2ラインの対位法的効果（読者の情報優位など）

# ---- ビート（時系列の出来事）----
beats:                         # <必須> 順序付きの出来事
  - order: 1
    summary: ""
  # beatは「何が起きるか」のみ。台詞・心理の詳細はL5本文で。

# ---- クリフハンガー（必須：EP03は全SCがクリフハンガーで終わる）----
cliffhanger:                   # <必須> この話の最後の引き
  hook: ""                     #   読者を次話へ引っ張る最後の一撃
  type: ""                     #   例: "不穏の予感" "情報の暴露" "危機の発生" "問いの提示"
  # 弛緩から緊張への落差を意識する（コメディで緩めて不穏で締める等）

# ==========================================================
# 情報統制（RD-01の教訓を制約化した最重要セクション）
# ==========================================================
# 【鉄則】このカードで読者に「明かす」事実と「伏せる」事実を
#         排他的に分類する。両者の境界を曖昧にしない。
#
# RD-01の失敗：SC06で「水は致死量にならない（安全装置）」を
#   key_information_revealed に置いた結果、危機の緊張が事前に
#   解除された。安全・無害・制御済みといった「緊張を下げる情報」は
#   原則 withheld 側に置き、開示タイミングを意図的に設計すること。
# ----------------------------------------------------------
key_information_revealed:      # <必須> このカードで“今”読者に明かす事実
  - ""
withheld_information:          # <必須> まだ伏せる事実（後のカードで開示）
  - ""

# 安全弁チェック（記入者が自問する。テンプレcoメントとして残す）:
#   □ 危機シーンで「実は安全」という情報を revealed に置いていないか？
#   □ それは withheld に回し、開示カード/フェーズを指定したか？
#   □ 誰が・いつ・何を誤認するか（IM-NL-002）が beats か phases で明示か？

# ---- 緊張 ----
tension:                       # <必須>
  level: ""                    #   例: "Low" "Mid" "High" "Peak → Release"
  score_start: 0               #   話の開始時点の緊張（0-100）
  score_end: 0                 #   話の終了時点の緊張（0-100）。クリフハンガーで跳ねる想定
  # 話内で変動しない場合は score_start == score_end でよい
  # EP全体で山型（またはEP03は上昇継続型）の曲線を意識して配分

# ---- トーン ----
tone:                          # <必須> このカードの空気（複数可）
  - ""

# ---- 伏線 ----
foreshadowing:                 # <必須（なければ空リスト []）> 仕込む伏線
  - ""

# ---- 周回の種（任意：2周目に意味が反転する特殊な伏線）----
reincarnation_seeds:           # <任意> 通常の foreshadowing とは区別する
  # 使わないカードでは丸ごと省略する
  - id: ""                     #   例: "SEED-1"
    name: ""
    surface_read: ""           #   1周目の読者はこう読む
    rewatch_read: ""           #   2周目にこう反転する
    rule: ""                   #   生成上の鉄則（例: "説明を書かず描写のみ"）

# ---- キャラクター指示 ----
character_notes:               # <必須> 登場人物ごとの演技・心理メモ
  # キーは proper_noun_registry のキー体系に揃える（izuna_shunta 等）
  # ※EP02では hayata/mayo 等の旧短縮キーが使われていた。新規は新キーで。
  izuna_shunta:
    - ""

# ==========================================================
# メタ（任意：レビュー・依存管理用）
# ==========================================================
meta:                          # <任意>
  depends_on:                  #   このカードが前提とする上位レイヤー
    - "PROJECT_MASTER_CONTEXT@1.0.0"
    - "ep03_structure@1.0"
  review_status: "draft"       #   draft / needs_review / approved
  schema_version: "1.0.0"
